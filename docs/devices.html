<style>
.ui{white-space:normal}
figure.shot.side{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,.8fr);gap:16px;align-items:start}
figure.shot.side .shot-legend{margin-top:0}
.pane{display:none}.pane.on{display:block}
.tabbar{margin:2px 0 14px}
.plab{margin-top:18px;padding-top:14px;border-top:1px solid var(--line)}
.plab h3{margin:0 0 4px}
.devs{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;margin:2px 0 12px}
.devs button{display:flex;flex-direction:column;align-items:flex-start;gap:2px;text-align:left;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:8px 10px;color:var(--soft);font-family:inherit;cursor:pointer;transition:border-color .15s}
.devs button b{font-size:14px;color:var(--ink)}
.devs button small{font-size:12px;color:var(--muted);line-height:1.25}
.devs button.on{border-color:var(--gold);background:linear-gradient(180deg,rgba(255,204,51,.12),var(--panel))}
.tiles.four{grid-template-columns:repeat(4,1fr)}
.tile .big.mid{font-size:19px}
ol.chk{list-style:none;margin:12px 0 0;padding:0;display:grid;gap:7px;counter-reset:ck}
ol.chk>li{counter-increment:ck;position:relative;padding:8px 12px 8px 50px;background:var(--panel);border:1px solid var(--line);border-radius:12px;color:var(--soft);cursor:pointer;transition:border-color .15s,opacity .15s;user-select:none}
ol.chk>li::before{content:counter(ck);position:absolute;left:12px;top:8px;width:26px;height:26px;border-radius:50%;background:var(--panel2);color:var(--soft);font-weight:800;font-size:13px;display:grid;place-items:center;border:1px solid #34426b}
ol.chk>li:hover{border-color:var(--gold)}
ol.chk>li.done{opacity:.6}
ol.chk>li.done::before{content:"✓";background:var(--ok);color:#06210f;border-color:var(--ok)}
.cfgt{width:100%;border-collapse:collapse;font:13.5px system-ui;color:var(--soft)}
.cfgt th{font-weight:600;color:var(--muted);text-align:left;padding:5px 8px;border-bottom:1px solid var(--line)}
.cfgt td{padding:5px 8px;border-bottom:1px solid rgba(37,48,77,.6);font-variant-numeric:tabular-nums}
.cfgt tr.top td{background:rgba(255,204,51,.10)}
.cfgt tr.top td:first-child{box-shadow:inset 3px 0 0 var(--gold)}
.cfgt tr.moved td{animation:mv 1s}
@keyframes mv{0%{background:rgba(91,227,138,.35)}}
.cfgt td .btn{padding:3px 9px;font-size:12.5px}
.cfgwrap{overflow-x:auto}
.docs{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px;min-height:32px}
.docs span{background:#fffbe5;color:#1a1300;border-radius:6px 6px 0 0;padding:4px 10px;font:600 12.5px system-ui;border-bottom:3px solid var(--gold)}
.docs span.bad{border-bottom-color:var(--photo)}.docs span.good{border-bottom-color:var(--ok)}
.goal{font-size:16px;font-weight:700;color:var(--ink);margin:2px 0 10px}
.goal b{color:var(--gold)}
@media (max-width:1000px){.devs{grid-template-columns:repeat(3,1fr)}}
@media (max-width:900px){figure.shot.side{grid-template-columns:1fr}.tiles.four{grid-template-columns:1fr 1fr}}
@media (max-width:560px){.devs{grid-template-columns:1fr 1fr}}
</style>

<script>

GUIDE.texts({ ru: {"mc.n": "Кристалл", "mc.k": "Монте-Карло", "mc.h": "Кристалл решает: Ø40 против Ø76", "mc.lead": "Один и тот же источник в 2 см от торца, одни и те же фотоны. Слева кристалл Ø40 × 40 мм, справа Ø76 × 76 мм. Каждый трек сосчитан по физике взаимодействия, спектры — в общем масштабе на испущенный фотон.", "mc.pick": "Фотоны:", "mc.l1": "NaI Ø40 × 40 мм", "mc.l2": "NaI Ø76 × 76 мм", "mc.t1": "в пике у Ø40", "mc.t2": "в пике у Ø76", "mc.t3": "большой ловит в пик больше", "mc.f1": "<b>Больше кристалл — больше пик.</b> Фотону труднее проскочить насквозь, особенно на высоких энергиях: на 2614 кэВ разница в разы.", "mc.f2": "<b>Плато относительно пика ниже у большого.</b> Рассеянный фотон чаще догорает внутри и всё-таки попадает в пик.", "mc.f3": "<b>Ширину пика размер почти не меняет</b> — её задают кристалл и электроника. Здесь у обоих одна: 7.5 % при 662 кэВ."},
 en: {"mc.n": "Crystal", "mc.k": "Monte Carlo", "mc.h": "The crystal decides: Ø40 versus Ø76", "mc.lead": "The same source 2 cm from the face, the same photons. On the left a Ø40 × 40 mm crystal, on the right Ø76 × 76 mm. Every track follows the interaction physics; the spectra share one scale per emitted photon.", "mc.pick": "Photons:", "mc.l1": "NaI Ø40 × 40 mm", "mc.l2": "NaI Ø76 × 76 mm", "mc.t1": "in the peak, Ø40", "mc.t2": "in the peak, Ø76", "mc.t3": "the big one puts more into the peak", "mc.f1": "<b>A bigger crystal gives a bigger peak.</b> It is harder for a photon to slip through, especially at high energies: at 2614 keV the difference is several-fold.", "mc.f2": "<b>The plateau is lower relative to the peak in the big one.</b> A scattered photon more often ends up absorbed inside and lands in the peak after all.", "mc.f3": "<b>Size hardly changes the peak width</b> — the crystal and electronics set it. Both use the same here: 7.5 % at 662 keV."} });
(function () {
  const { $, $$, sig, fx, t, Q } = GUIDE;
  const CH = [[59.54, 'Am-241'], [661.66, 'Cs-137'], [1460.82, 'K-40'], [2614.5, 'Tl-208']];
  let E = 661.66;
  const mc = Q.mcDuo($('#cvMC'), { scenes: [{ geo: { size: 4.0, gap: 2.0, src: 'point' }, label: () => t('mc.l1') }, { geo: { size: 7.6, gap: 2.0, src: 'point' }, label: () => t('mc.l2') }], lines: [[E, 1]], onStats: () => {
    const s = mc.scenes; if (!s[0] || s[0].S.n < 800) return;
    const e0 = s[0].S.fep / s[0].S.n, e1 = s[1].S.fep / s[1].S.n;
    $('#mcT1').textContent = sig(100 * e0, 2) + ' %'; $('#mcT2').textContent = sig(100 * e1, 2) + ' %';
    $('#mcT3').textContent = '× ' + fx(e1 / Math.max(e0, 1e-9), 1);
  } });
  function chips() {
    $('#mcChips').innerHTML = CH.map(([e, n]) => '<button class="chip' + (Math.abs(e - E) < 1 ? ' on' : '') + '" data-e="' + e + '">' + n + ' · ' + Math.round(e) + '</button>').join('');

  }
  GUIDE.onRedraw(chips); chips();
})();
</script>

'hoodtxt':'<li>Тип устройства — запись в реестре типов: на каждый тип своя тройка «страница настроек / контроллер / конфигурация». Типов шесть: Звуковой вход, AtomSpectraVCP, RadiaCode, Obsidian, AmplitudaUSB, AmplitudaSerial.</li><li>Живое время — модель без продления: <code>LT = T·(1 − n·τ)</code>, где n — посчитанная скорость; при n·τ ≥ 1 живое время — ноль (прибор насыщен). Отсюда и «Мерт. Время %» = 100·(T − LT)/T.</li><li>τ по типам: RadiaCode и Obsidian — 5 мкс; Atom Spectra — из ответа прибора; AmplitudaUSB — поле, 14 мкс по умолчанию; звуковой вход — ширина импульса / частота дискретизации (16 / 44100 = 363 мкс); AmplitudaSerial — живое время присылает сам блок.</li><li>Список конфигураций отсортирован по времени сохранения, свежая сверху; новый спектр берёт первую строку — с её каналами, калибровкой и лимитом времени.</li><li>Каждая конфигурация — отдельный XML в <code>config\\device</code>; файл спектра хранит ссылку на неё (имя и GUID), а не копию. Один прибор в каждый момент пишет только в один спектр.</li>',

function tabset(barId) {
  const bar = $('#' + barId), panes = $$('.pane', bar.parentNode);
  bar.innerHTML = panes.map((p, i) => '<button class="chip' + (i ? '' : ' on') + '" data-i="' + i + '" data-t="' + p.dataset.tab + '"></button>').join('');
  $$('button', bar).forEach(b => b.onclick = () => { $$('button', bar).forEach(x => x.classList.toggle('on', x === b)); panes.forEach((p, i) => p.classList.toggle('on', i === +b.dataset.i)); });
}

/* ── 1а. звуковой вход: окно, образец и пороги (`AMBER251`) ──
   Детектор — как в CorrelativePulseDetector: высота — наложение образца на окно
   (свёртка с нулевым средним, здесь в % шкалы), срабатывание от НПП, вершина — наибольшая

    marks.forEach(m => { const x0 = X(m.from), x1 = X(m.end), xc = (x0 + x1) / 2; if (x1 < S.l) return; ctx.fillStyle = rgba(VC[m.v], 0.16); ctx.fillRect(Math.max(S.l, x0), S.t, x1 - Math.max(S.l, x0), S.b - S.t); const s = t('pl.v.' + m.v), sw = ctx.measureText(s).width; if (x0 > S.l && xc - sw / 2 > lbl + 6) { ctx.fillStyle = VC[m.v]; ctx.textAlign = 'center'; ctx.fillText(s, xc, S.t + 11); lbl = xc + sw / 2; } });
    [[L, VC.ok, 'pl.lld'], [U, VC.high, 'pl.uld']].forEach(([v, c, k]) => { ctx.strokeStyle = c; ctx.setLineDash([5, 4]); ctx.beginPath(); ctx.moveTo(S.l, Y(v)); ctx.lineTo(S.r, Y(v)); ctx.stroke(); ctx.setLineDash([]); ctx.fillStyle = c; ctx.textAlign = 'left'; ctx.fillText(t(k), S.l + 3, Y(v) - 3); });

    const k0 = n - x.length; for (let j = 0; j < x.length; j++) { const k = k0 + j; if (X(k) < S.l) continue; const yy = Y(x[j]); ctx.lineTo(X(k), yy); } ctx.stroke(); ctx.lineWidth = 1;

(function chooser() {

    { id: 'rc', link: 'ble', body: 'hand', ch: '1024', tau: 'tau.fix', cal: true },
    { id: 'obs', link: 'ble', body: 'hand', ch: '1024', tau: 'tau.fix', cal: true },
    { id: 'ausb', link: 'hid', body: 'block', ch: 'ch.amp', tau: 'tau.ausb', cal: false },
    { id: 'aser', link: 'rs', body: 'block', ch: 'ch.blk', tau: 'tau.aser', cal: false },

  $$('#devs button').forEach(b => b.onclick = () => { cur = +b.dataset.i; resetSim(); ui(); });

    const tile = (k, v) => '<div class="tile"><div class="small">' + t(k) + '</div><div class="big mid">' + v + '</div></div>';
    $('#devTiles').innerHTML = tile('tl.link', t(LINK[d.link])) + tile('tl.ch', d.ch[0] === 'c' ? t(d.ch) : d.ch) + tile('tl.tau', t(d.tau)) + tile('tl.cal', t(d.cal ? 'cal.yes' : 'cal.no'));
    const st = steps(d);
    $('#devSteps').innerHTML = st.map((k, i) => '<li data-i="' + i + '" class="' + (done[cur].has(i) ? 'done' : '') + '">' + t(k) + '</li>').join('');
    $$('#devSteps li').forEach(li => li.onclick = () => { const i = +li.dataset.i; done[cur].has(i) ? done[cur].delete(i) : done[cur].add(i); ui(); });
    const n = done[cur].size, all = n === st.length;
    $('#devRes').innerHTML = '<span class="pill ' + (all ? 'good' : '') + '">' + t('st.n', n, st.length) + (all ? ' · ' + t('st.ok') : '') + '</span>' + (d.id === 'atom' ? '<span class="pill">' + t('atom.note') + '</span>' : '');
  }
  /* анимация: источник → кристалл → связь → BecqMoni */
  const cv = $('#cvLink'); io.observe(cv);
  const NB = 44; let hist, buf, flying, flashes, photons, lastEv, lastPk, lastReq, T0;
  function resetSim() { hist = new Float64Array(NB); buf = new Float64Array(NB); flying = []; flashes = []; photons = []; lastEv = 0; lastPk = 0; lastReq = 0; T0 = performance.now(); }
  resetSim();
  function sampleBin() { const u = Math.random(); if (u < 0.42) return clamp(Math.round(30 + 1.2 * GUIDE.gauss()), 0, NB - 1); if (u < 0.5) return clamp(Math.round(3 + GUIDE.gauss()), 0, NB - 1); return Math.floor(Math.random() * 25); }
  function pathPt(L, u) {   // точка на линии связи, u: 0 у прибора → 1 у ПК
    const x = lerp(L.x0, L.x1, u), y = L.y + (L.bow ? -Math.sin(Math.PI * u) * L.bow : 0); return [x, y];
  }
  function draw(now) {
    const d = DEV[cur], { ctx, w, h } = setup(cv), s = (now - T0) / 1000;
    const det = { x: w * 0.06, y: h * 0.42, w: Math.max(80, w * 0.2), h: h * 0.3 };
    const pc = { x: w * 0.68, y: h * 0.14, w: w * 0.29, h: h * 0.56 };
    const L = { x0: det.x + det.w, x1: pc.x, y: h * 0.58, bow: d.link === 'ble' ? h * 0.22 : 0 };
    // события: фотон из источника → вспышка в кристалле
    if (s - lastEv > 1.5) { lastEv = s - 0.05; lastPk = Math.max(lastPk, s - 1); lastReq = Math.max(lastReq, s - 1.6); flying = flying.filter(f => s - f.t < f.dur); }   // вкладка спала: не догонять пропущенное
    while (lastEv < s) { lastEv += -Math.log(1 - Math.random()) / 9; photons.push({ t: lastEv, bin: sampleBin() }); }
    photons = photons.filter(p => { if (s - p.t > 0.35) { flashes.push({ t: p.t + 0.35, bin: p.bin }); if (d.link === 'audio') flying.push({ t: p.t + 0.35, kind: 'pulse', bins: [p.bin], dur: 0.9 }); else buf[p.bin]++; return false; } return true; });
    // посылки: гистограмма раз в секунду; у RS-232 — по запросу ПК
    if (d.link === 'rs') { if (s - lastReq > 1.6) { lastReq = s; flying.push({ t: s, kind: 'req', dur: 0.8 }); } }
    else if (d.link !== 'audio' && s - lastPk > 1.0) { lastPk = s; flying.push({ t: s, kind: 'pkt', b: Float64Array.from(buf), dur: d.link === 'ble' ? 1.0 : 0.8 }); buf.fill(0); }
    flying = flying.filter(f => { if ((s - f.t) / f.dur >= 1) { if (f.kind === 'req') { flying.push({ t: s, kind: 'pkt', b: Float64Array.from(buf), dur: 0.8 }); buf.fill(0); } else if (f.kind === 'pkt') f.b.forEach((v, i) => hist[i] += v); else f.bins.forEach(i => hist[i]++); return false; } return true; });
    // источник
    const src = { x: det.x + det.w * 0.18, y: h * 0.13 };
    ctx.save(); ctx.translate(src.x, src.y); ctx.fillStyle = '#ffcc33'; ctx.beginPath(); ctx.arc(0, 0, 4, 0, 7); ctx.fill();
    for (let k = 0; k < 3; k++) { ctx.beginPath(); ctx.moveTo(0, 0); ctx.arc(0, 0, 13, k * 2.094 - 0.5, k * 2.094 + 0.5); ctx.closePath(); ctx.fill(); }
    ctx.restore();
    photons.forEach(p => { const u = (s - p.t) / 0.35, x0 = src.x, y0 = src.y + 14, x1 = det.x + det.w * 0.3 + (p.bin % 7) * 4, y1 = det.y + det.h * 0.5; ctx.strokeStyle = 'rgba(255,204,51,.95)'; ctx.lineWidth = 1.8; ctx.beginPath(); const v0 = Math.max(0, u - 0.4); for (let k = 0; k <= 10; k++) { const v = lerp(v0, u, k / 10), x = lerp(x0, x1, v) + Math.sin(v * 38) * 4, y = lerp(y0, y1, v); k ? ctx.lineTo(x, y) : ctx.moveTo(x, y); } ctx.stroke(); ctx.lineWidth = 1; });
    // прибор
    ctx.fillStyle = '#1d2744'; ctx.strokeStyle = '#3a4a78';
    if (d.body === 'hand') { ctx.beginPath(); ctx.roundRect(det.x, det.y - det.h * 0.25, det.w, det.h * 1.45, 14); ctx.fill(); ctx.stroke(); ctx.fillStyle = '#0b1020'; ctx.fillRect(det.x + det.w * 0.55, det.y - det.h * 0.1, det.w * 0.36, det.h * 0.5); ctx.fillStyle = '#5be38a'; ctx.font = '700 10px system-ui'; ctx.textAlign = 'center'; ctx.fillText('0.12', det.x + det.w * 0.73, det.y + det.h * 0.2); }
    else if (d.body === 'block') { ctx.beginPath(); ctx.roundRect(det.x, det.y - det.h * 0.1, det.w, det.h * 1.2, 8); ctx.fill(); ctx.stroke(); }
    else { ctx.beginPath(); ctx.roundRect(det.x, det.y, det.w, det.h, 10); ctx.fill(); ctx.stroke(); }
    const cr = { x: det.x + det.w * 0.08, y: det.y + det.h * 0.15, w: det.w * 0.42, h: det.h * 0.7 };
    const g = ctx.createLinearGradient(cr.x, 0, cr.x + cr.w, 0); g.addColorStop(0, 'rgba(106,168,255,.55)'); g.addColorStop(1, 'rgba(106,168,255,.25)'); ctx.fillStyle = g; ctx.beginPath(); ctx.roundRect(cr.x, cr.y, cr.w, cr.h, 5); ctx.fill();
    flashes = flashes.filter(f => s - f.t < 0.3); flashes.forEach(f => { const a = 1 - (s - f.t) / 0.3; ctx.fillStyle = 'rgba(255,255,255,' + (0.85 * a) + ')'; ctx.beginPath(); ctx.arc(cr.x + cr.w * (0.25 + (f.bin % 5) * 0.12), cr.y + cr.h * 0.5, 4 + 8 * (1 - a), 0, 7); ctx.fill(); });
    ctx.fillStyle = '#cdd8f3'; ctx.font = '700 12px system-ui'; ctx.textAlign = 'center'; ctx.fillText(t('dv.' + d.id), det.x + det.w / 2, det.y + det.h * (d.body === 'hand' ? 1.45 : 1.3) + 6);
    // связь
    ctx.strokeStyle = d.link === 'ble' ? 'rgba(106,168,255,.55)' : '#56648a'; ctx.lineWidth = d.link === 'ble' ? 1.5 : 4; if (d.link === 'ble') ctx.setLineDash([5, 6]);
    ctx.beginPath(); for (let k = 0; k <= 30; k++) { const [x, y] = pathPt(L, k / 30); k ? ctx.lineTo(x, y) : ctx.moveTo(x, y); } ctx.stroke(); ctx.setLineDash([]); ctx.lineWidth = 1;
    if (d.link === 'ble') { for (let k = 0; k < 3; k++) { const r = 10 + ((s * 30 + k * 14) % 42); ctx.strokeStyle = 'rgba(106,168,255,' + (0.6 * (1 - r / 52)) + ')'; ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(L.x0, L.y - 6, r, -1.1, 1.1); ctx.stroke(); } ctx.lineWidth = 1; }
    ctx.fillStyle = '#93a3c4'; ctx.font = '600 11.5px system-ui'; ctx.textAlign = 'center'; const [lx, ly] = pathPt(L, 0.5); ctx.fillText(t(LINK[d.link]), lx, ly + (d.link === 'ble' ? -10 : 22));
    flying.forEach(f => {
      const u = (s - f.t) / f.dur; let [x, y] = pathPt(L, f.kind === 'req' ? 1 - u : u);
      if (f.kind === 'pulse') { ctx.strokeStyle = '#ff6b8b'; ctx.lineWidth = 2; ctx.beginPath(); for (let k = -10; k <= 14; k++) { const v = k < 0 ? 0 : -Math.exp(-k / 4) * (1 - Math.exp(-k * 1.5)) * 16; k === -10 ? ctx.moveTo(x + k, y + v) : ctx.lineTo(x + k, y + v); } ctx.stroke(); ctx.lineWidth = 1; }
      else if (f.kind === 'req') { ctx.fillStyle = '#6aa8ff'; ctx.beginPath(); ctx.moveTo(x - 7, y); ctx.lineTo(x + 3, y - 6); ctx.lineTo(x + 3, y + 6); ctx.fill(); ctx.font = '600 10px system-ui'; ctx.fillText(t('lk.req'), x, y - 9); }
      else { const sum = f.b.reduce((a, v) => a + v, 0); ctx.fillStyle = '#5be38a'; ctx.beginPath(); ctx.roundRect(x - 13, y - 9, 26, 18, 4); ctx.fill(); ctx.fillStyle = '#06210f'; ctx.font = '800 10px system-ui'; ctx.fillText('+' + sum, x, y + 4); }
    });
    // ПК с BecqMoni
    ctx.fillStyle = '#e9edf5'; ctx.beginPath(); ctx.roundRect(pc.x, pc.y, pc.w, pc.h, 6); ctx.fill();
    ctx.fillStyle = '#5a6684'; ctx.fillRect(pc.x + pc.w * 0.42, pc.y + pc.h, pc.w * 0.16, h * 0.06); ctx.fillRect(pc.x + pc.w * 0.3, pc.y + pc.h + h * 0.06, pc.w * 0.4, 4);
    ctx.fillStyle = '#273350'; const sx = pc.x + 5, sy = pc.y + 18, sw = pc.w - 10, sh = pc.h - 23; ctx.fillRect(sx, sy, sw, sh);
    ctx.fillStyle = '#111'; ctx.font = '600 10.5px system-ui'; ctx.textAlign = 'left'; ctx.fillText(t('pc'), pc.x + 7, pc.y + 13);
    const mx = Math.max(4, ...hist); const bw = sw / NB; ctx.fillStyle = '#20c040';
    for (let i = 0; i < NB; i++) { const bh = Math.sqrt(hist[i] / mx) * (sh - 6); ctx.fillRect(sx + i * bw, sy + sh - bh, Math.max(1, bw - 0.6), bh); }
    ctx.fillStyle = '#cdd8f3'; ctx.textAlign = 'right'; ctx.font = '600 10px system-ui'; ctx.fillText(hist.reduce((a, v) => a + v, 0).toFixed(0), sx + sw - 4, sy + 12);
  }
  function loop(now) { if (visible.get(cv) !== false) draw(now); requestAnimationFrame(loop); }
  requestAnimationFrame(loop);
  GUIDE.onRedraw(ui);
})();

/* ── 2. игра «какую конфигурацию возьмёт новый документ» ── */
(function order() {
  const D = (y, mo, d, hh, mm, ss) => new Date(y, mo - 1, d, hh, mm, ss);
  const START = [['RC-103', D(2026, 10, 7, 22, 30, 15)], ['Atom Spectra 80x80', D(2026, 10, 7, 22, 18, 2)], ['1.Atom Spectra Nano 16 Pro RadiaScan 701A', D(2026, 10, 7, 21, 50, 57)], ['Obsidian', D(2026, 7, 7, 16, 8, 39)], ['RC-101', D(2024, 10, 7, 18, 19, 53)]];
  const GOALS = ['Obsidian', 'RC-101', 'Atom Spectra 80x80'];
  let cfg, clock, docs, goal, moved, msg;
  const p2 = v => String(v).padStart(2, '0');
  const fmt = d => p2(d.getDate()) + '.' + p2(d.getMonth() + 1) + '.' + d.getFullYear() + ' ' + p2(d.getHours()) + ':' + p2(d.getMinutes()) + ':' + p2(d.getSeconds());
  function reset() { cfg = START.map(([n, d]) => ({ n, d })); clock = D(2026, 10, 19, 10, 0, 0); docs = []; goal = 0; moved = ''; msg = ''; }
  reset();
  function ui() {
    cfg.sort((a, b) => b.d - a.d);
    $('#gGoal').innerHTML = goal < GOALS.length ? t('g.goal', goal + 1, GOALS.length, GOALS[goal]) : t('g.win');
    $('#gTable').innerHTML = '<tr><th>' + t('g.name') + '</th><th>' + t('g.upd') + '</th><th></th></tr>' + cfg.map((c, i) => '<tr class="' + (i ? '' : 'top ') + (c.n === moved ? 'moved' : '') + '"><td>' + c.n + '</td><td>' + fmt(c.d) + '</td><td><button class="btn" data-n="' + c.n + '">' + t('g.save') + '</button></td></tr>').join('');
    $$('#gTable button').forEach(b => b.onclick = () => { clock = new Date(clock.getTime() + 60000 + Math.floor(Math.random() * 90000)); const c = cfg.find(x => x.n === b.dataset.n); c.d = new Date(clock); moved = c.n; msg = '<span class="pill">' + t('g.saved', c.n, fmt(clock)) + '</span>'; ui(); });
    $('#gDocs').innerHTML = docs.map((d, i) => '<span class="' + d.cls + '">' + t('g.doc', i + 1, d.n) + '</span>').join('');
    $('#gRes').innerHTML = msg; $('#gNew').disabled = goal >= GOALS.length;
  }
  $('#gNew').onclick = () => {
    const got = cfg[0].n, want = GOALS[goal], ok = got === want;
    docs.push({ n: got, cls: ok ? 'good' : 'bad' }); if (docs.length > 6) docs.shift();
    msg = '<span class="pill ' + (ok ? 'good' : 'bad') + '">' + (ok ? t('g.ok', got) : t('g.bad', got, want)) + '</span>';
    if (ok) goal++; moved = ''; ui();
  };
  $('#gReset').onclick = () => { reset(); ui(); };
  GUIDE.onRedraw(ui);
})();

/* ── 5. мёртвое время: турникет и кривая насыщения ── */
(function dead() {
  const DEVS = [['RadiaCode / Obsidian', 5e-6], ['Atom Spectra', 1.357e-6], ['AmplitudaUSB', 14e-6], ['@dv.audio', 363e-6]];
  let tau = 5e-6, m = Math.pow(10, 3.3);
  const r = $('#dtR'), cv = $('#cvTurn'), cs = $('#cvSat'); io.observe(cv);
  let di = 0;
  function chips() {
    $('#dtDev').innerHTML = DEVS.map(([n, v], i) => '<button class="chip' + (i === di ? ' on' : '') + '" data-i="' + i + '">' + (n[0] === '@' ? t(n.slice(1)) : n) + ' · ' + fx(v * 1e6, v * 1e6 < 2 ? 2 : 0) + ' ' + t('dt.us') + '</button>').join('');
    $$('#dtDev .chip').forEach(b => b.onclick = () => { di = +b.dataset.i; tau = DEVS[di][1]; chips(); restart(); stats(); sat(); });
  }
  r.addEventListener('input', () => { m = Math.pow(10, +r.value); restart(); stats(); sat(); });
  // имитация: события Пуассона, после засчитанного прибор закрыт на τ (модель без продления)
  let ev, now, nextT, busy, cntAll, cntLost, last;
  function win() { return Math.max(28 / m, 7 * tau); }
  function restart() { ev = []; now = 0; nextT = -Math.log(1 - Math.random()) / m; busy = -1; cntAll = 0; cntLost = 0; last = performance.now(); }
  restart();
  const fmtRate = v => v >= 1e4 ? fx(v / 1e3, v >= 1e5 ? 0 : 1) + 'k' : fx(v, v < 100 ? 1 : 0);
  function step(dt) {
    const W = win(); now += W / 4.5 * dt;
    let guard = 0;
    while (nextT < now && guard++ < 5000) { const lost = nextT < busy; if (!lost) busy = nextT + tau; ev.push({ t: nextT, lost }); cntAll++; if (lost) cntLost++; nextT += -Math.log(1 - Math.random()) / m; }
    while (ev.length && ev[0].t < now - W * 1.05) ev.shift();
  }
  function drawTurn() {
    const { ctx, w, h } = setup(cv), W = win(), bx = { l: 12, r: w - 12, t: 26, b: h - 30 };
    const X = tt => bx.r - (now - tt) / W * (bx.r - bx.l);
    ctx.strokeStyle = 'rgba(255,255,255,.22)'; ctx.beginPath(); ctx.moveTo(bx.l, bx.b); ctx.lineTo(bx.r, bx.b); ctx.stroke();
    ev.forEach(e => { if (!e.lost) { const x0 = X(e.t), x1 = X(e.t + tau); ctx.fillStyle = 'rgba(255,204,51,.28)'; ctx.fillRect(x0, bx.t + 8, Math.max(2, x1 - x0), bx.b - bx.t - 8); } });
    ev.forEach(e => { const x = X(e.t); if (x < bx.l) return; if (e.lost) { ctx.strokeStyle = '#ff4d6d'; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(x, bx.b); ctx.lineTo(x, bx.b - (bx.b - bx.t) * 0.45); ctx.stroke(); ctx.beginPath(); ctx.moveTo(x - 4, bx.t + 30); ctx.lineTo(x + 4, bx.t + 38); ctx.moveTo(x + 4, bx.t + 30); ctx.lineTo(x - 4, bx.t + 38); ctx.stroke(); } else { ctx.strokeStyle = '#5be38a'; ctx.lineWidth = 2.4; ctx.beginPath(); ctx.moveTo(x, bx.b); ctx.lineTo(x, bx.t + 8); ctx.stroke(); } ctx.lineWidth = 1; });
    ctx.fillStyle = '#93a3c4'; ctx.font = '11.5px system-ui'; ctx.textAlign = 'left';
    const span = W >= 1 ? fx(W, 1) + ' ' + t('dt.s') : W >= 1e-3 ? fx(W * 1e3, 1) + ' ' + t('dt.ms') : fx(W * 1e6, 0) + ' ' + t('dt.us');
    ctx.fillText('← ' + span + ' →', bx.l, h - 10); ctx.textAlign = 'right'; ctx.fillText(t('dt.t'), bx.r, h - 10);
    ctx.textAlign = 'left'; ctx.fillStyle = '#ffcc33'; ctx.fillText('τ = ' + sig(tau * 1e6, 3) + ' ' + t('dt.us'), bx.l, 16);
  }
  function stats() {
    const n = m / (1 + m * tau), dtp = 100 * n * tau, lt = 3600 * (1 - n * tau);
    const col = dtp <= 20 ? 'var(--ink)' : dtp <= 50 ? '#ff9a3c' : '#ff4d6d';
    const tile = (k, v, c) => '<div class="tile"><div class="small">' + t(k) + '</div><div class="big" style="' + (c ? 'color:' + c : '') + '">' + v + '</div></div>';
    $('#dtRv').textContent = fmtRate(m) + ' ' + t('dt.cps');
    $('#dtTiles').innerHTML = tile('dt.m', fmtRate(m)) + tile('dt.n', fmtRate(n)) + tile('dt.dt', fx(dtp, dtp < 10 ? 2 : 1), col) + tile('dt.lt', fx(lt, 0) + ' ' + t('dt.s'));
    const st = dtp <= 20 ? ['good', 'dt.ok'] : dtp <= 50 ? ['', 'dt.warn'] : ['bad', 'dt.bad'];
    $('#dtRes').innerHTML = '<span class="pill ' + st[0] + '">' + t(st[1]) + '</span>' + (cntAll > 20 ? '<span class="pill">' + t('dt.sim', cntLost, cntAll, fx(100 * cntLost / cntAll, 1)) + '</span>' : '');
  }
  function sat() {
    const { ctx, w, h } = setup(cs), bx = { l: 46, t: 12, r: w - 10, b: h - 24 };
    const X = scale('log', 10, 1e6, bx.l, bx.r), Y = scale('log', 10, 1e6, bx.b, bx.t);
    // полосы 20 % и 50 %: m·τ > 0.25 и m·τ > 1
    const x20 = X(clamp(0.25 / tau, 10, 1e6)), x50 = X(clamp(1 / tau, 10, 1e6));
    ctx.fillStyle = 'rgba(255,154,60,.10)'; ctx.fillRect(x20, bx.t, x50 - x20, bx.b - bx.t); ctx.fillStyle = 'rgba(255,77,109,.12)'; ctx.fillRect(x50, bx.t, bx.r - x50, bx.b - bx.t);
    axes(ctx, bx, X, Y, { xl: t('dt.ax.m'), yl: t('dt.ax.n') });
    ctx.setLineDash([4, 4]); ctx.strokeStyle = 'rgba(255,255,255,.35)'; ctx.beginPath(); ctx.moveTo(X(10), Y(10)); ctx.lineTo(X(1e6), Y(1e6)); ctx.stroke();
    const yl = Y(1 / tau); if (yl > bx.t) { ctx.strokeStyle = 'rgba(255,77,109,.6)'; ctx.beginPath(); ctx.moveTo(bx.l, yl); ctx.lineTo(bx.r, yl); ctx.stroke(); ctx.fillStyle = '#ff8fa6'; ctx.font = '11px system-ui'; ctx.textAlign = 'right'; ctx.fillText(t('dt.lim'), X(Math.min(1e6, 0.05 / tau)), yl + 13); }
    ctx.setLineDash([]); ctx.strokeStyle = '#ffcc33'; ctx.lineWidth = 2.2; ctx.beginPath();
    for (let k = 0; k <= 120; k++) { const mm = Math.pow(10, 1 + 5 * k / 120), n = mm / (1 + mm * tau); k ? ctx.lineTo(X(mm), Y(n)) : ctx.moveTo(X(mm), Y(n)); } ctx.stroke(); ctx.lineWidth = 1;
    const n = m / (1 + m * tau); ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(X(m), Y(n), 5, 0, 7); ctx.fill(); ctx.strokeStyle = '#ffcc33'; ctx.lineWidth = 2; ctx.stroke(); ctx.lineWidth = 1;
    ctx.fillStyle = 'rgba(255,255,255,.55)'; ctx.font = '11px system-ui'; ctx.textAlign = 'right'; ctx.fillText(t('dt.ideal'), X(3e5), Y(3e5) - 6);
  }
  let tick = 0;
  function loop(nw) { const dt = Math.min(0.1, (nw - last) / 1000); last = nw; if (visible.get(cv) !== false) { step(dt); drawTurn(); if (++tick % 20 === 0) stats(); } requestAnimationFrame(loop); }
  requestAnimationFrame(loop);
  GUIDE.onRedraw(() => { chips(); stats(); sat(); drawTurn(); });
})();

GUIDE.Q.heroAnim(document.getElementById('cvHero'), document.getElementById('heroStat'));   // заставка с квантами, как на главной (`AMBER246`)
GUIDE.init();
