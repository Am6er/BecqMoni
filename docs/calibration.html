'hoodtxt':'<li>The solver takes the highest workable degree not above the one ordered: if the curve bends between anchors, the degree goes down and the top coefficient stays 0.</li><li>One point gives a line through zero (a “channel 0 = 0 keV” point is added).</li><li>“Get all points” collects points from all open documents; “Reset” brings back the device calibration.</li><li>RadiaCode and Obsidian also keep a quadratic copy of the calibration — that is the form the device itself accepts.</li><li>Peak width comes from the spectrum\'s FWHM calibration; the response matrix has no width in it.</li>',
}});

/* ── игра «откалибруйте сами» ── */
const LIB = [[74.97, 'Pb Kα', '#FF9900'], [295.22, 'Pb-214', '#FF6655'], [351.93, 'Pb-214', '#FF6655'], [609.31, 'Bi-214', '#447700'], [661.66, 'Cs-137', '#FFCC77'], [1460.82, 'K-40', '#CCDD00'], [1764.49, 'Bi-214', '#447700'], [2614.5, 'Tl-208', '#CCDD88']];
const NCH = 1024, TRUE = [3.0, 2.915, 0.000018];          // истинная шкала: e + d·ch + c·ch²
const START = [14, 2.71, 0];                                // сдвинутая шкала «до калибровки»
const Etrue = ch => TRUE[0] + TRUE[1] * ch + TRUE[2] * ch * ch;
function chOf(E) { let lo = 0, hi = NCH; for (let i = 0; i < 40; i++) { const m = (lo + hi) / 2; if (Etrue(m) < E) lo = m; else hi = m; } return (lo + hi) / 2; }
const PEAKS = [[74.97, 6], [351.93, 1.1], [295.22, 0.6], [609.31, 1.3], [661.66, 5], [1460.82, 1.6], [1764.49, 0.45], [2614.5, 0.35]];
const SPEC = (() => {
  const s = new Float64Array(NCH);
  for (let c = 0; c < NCH; c++) { const e = Etrue(c); s[c] = 900 * Math.exp(-e / 210) + 60 * Math.exp(-e / 900) + 4; }
  PEAKS.forEach(([E, a]) => { const sg = 0.07 * 662 * Math.sqrt(E / 662) / 2.355, ce = E * (2 * E / 511) / (1 + 2 * E / 511); for (let c = 0; c < NCH; c++) { const e = Etrue(c); s[c] += a * 400 * Math.exp(-0.5 * ((e - E) / sg) ** 2) + (e < ce ? a * 22 : 0) * (1 / (1 + Math.exp((e - ce) / sg))); } });
  return Float64Array.from(s, v => poisson(v));
})();
const PK = PEAKS.map(([E]) => Math.round(chOf(E)));        // каналы пиков для подписей
let CAL = START.slice(), pts = [], picking = false, anim = null, msg = '';
const Ecal = ch => CAL[0] + CAL[1] * ch + CAL[2] * ch * ch;
function nearestPeak(ch) {   // вершина рядом со щелчком, затем центр тяжести над линейной подложкой окна
  let best = ch, bv = -1; for (let c = Math.max(3, ch - 10); c <= Math.min(NCH - 4, ch + 10); c++) { const v = SPEC[c - 1] + SPEC[c] + SPEC[c + 1]; if (v > bv) { bv = v; best = c; } }
  const E = Etrue(best), half = Math.max(3, Math.round(0.8 * 0.07 * 662 * Math.sqrt(E / 662) / TRUE[1])), a = Math.max(1, best - half), b = Math.min(NCH - 2, best + half);
  const yl = (SPEC[a - 1] + SPEC[a] + SPEC[a + 1]) / 3, yr = (SPEC[b - 1] + SPEC[b] + SPEC[b + 1]) / 3; let s = 0, sx = 0;
  for (let c = a; c <= b; c++) { const v = SPEC[c] - (yl + (yr - yl) * (c - a) / (b - a)); if (v > 0) { s += v; sx += v * c; } }
  return +(s > 0 ? sx / s : best).toFixed(1);
}
function fitCal() {
  const P = pts.filter(p => p.E > 0); if (!P.length) { msg = t('g.need'); draw(); return; }
  let xs = P.map(p => p.ch), ys = P.map(p => p.E); if (P.length === 1) { xs = [0].concat(xs); ys = [0].concat(ys); }
  const deg = Math.min(2, xs.length - 1), n = deg + 1, A = Array.from({ length: n }, () => new Float64Array(n + 1));
  xs.forEach((x, i) => { const pw = [1, x, x * x]; for (let r = 0; r < n; r++) { for (let c = 0; c < n; c++) A[r][c] += pw[r] * pw[c]; A[r][n] += pw[r] * ys[i]; } });
  for (let c = 0; c < n; c++) { let p = c; for (let r = c + 1; r < n; r++) if (Math.abs(A[r][c]) > Math.abs(A[p][c])) p = r; [A[c], A[p]] = [A[p], A[c]]; for (let r = 0; r < n; r++) if (r !== c) { const f = A[r][c] / A[c][c]; for (let k = c; k <= n; k++) A[r][k] -= f * A[c][k]; } }
  const co = [0, 0, 0]; for (let r = 0; r < n; r++) co[r] = A[r][n] / A[r][r];
  const from = CAL.slice(), t0 = performance.now(); msg = '';
  anim = () => { const u = Math.min(1, (performance.now() - t0) / 700), e = 1 - Math.pow(1 - u, 3); CAL = from.map((v, i) => lerp(v, co[i], e)); draw(); if (u < 1) requestAnimationFrame(anim); else anim = null; };
  requestAnimationFrame(anim);
}
function ptsUI() {
  const box = $('#gPts');
  box.innerHTML = pts.map((p, i) => '<span class="pill">' + t('g.pt', i + 1, fx(p.ch, 1)) + ' <select data-i="' + i + '"><option value="0">' + t('g.choose') + '</option>' + LIB.map(l => '<option value="' + l[0] + '"' + (p.E === l[0] ? ' selected' : '') + '>' + l[1] + ' ' + fx(l[0], 2) + '</option>').join('') + '</select> <a href="#" data-del="' + i + '">' + t('g.del') + '</a></span>').join('');
  $$('select', box).forEach(s => s.onchange = () => { pts[+s.dataset.i].E = +s.value; draw(); });
  $$('a[data-del]', box).forEach(a => a.onclick = e => { e.preventDefault(); pts.splice(+a.dataset.del, 1); ptsUI(); draw(); });
}
const cv = $('#cvCal'); let G = null, help = false;
function draw() {
  const { ctx, w, h } = setup(cv), bx = { l: 50, t: 30, r: w - 12, b: h - 26 };
  const X = scale('lin', 0, 3000, bx.l, bx.r); let mx = 0; for (let c = 5; c < NCH; c++) mx = Math.max(mx, SPEC[c]);
  const Y = scale('sqrt', 0, mx * 1.08, bx.b, bx.t); G = { X, bx };
  axes(ctx, bx, X, Y, { xl: t('ax.e'), yl: t('ax.c') });
  // линии библиотеки
  ctx.font = '600 11px system-ui'; ctx.textAlign = 'center';
  LIB.forEach(([E, nm, col], i) => { const x = X(E); ctx.strokeStyle = rgba(col, .65); ctx.setLineDash([5, 5]); ctx.beginPath(); ctx.moveTo(x, bx.t); ctx.lineTo(x, bx.b); ctx.stroke(); ctx.setLineDash([]); ctx.fillStyle = col; ctx.fillText(nm, x, bx.t - 6 - (i % 2) * 12 + 12); });
  // спектр по текущей калибровке
  ctx.beginPath(); for (let c = 2; c < NCH; c++) ctx.lineTo(X(Ecal(c)), Y(SPEC[c])); ctx.lineTo(X(Ecal(NCH - 1)), bx.b); ctx.lineTo(X(Ecal(2)), bx.b); ctx.closePath();
  const g = ctx.createLinearGradient(0, bx.t, 0, bx.b); g.addColorStop(0, 'rgba(91,227,138,.85)'); g.addColorStop(1, 'rgba(91,227,138,.15)'); ctx.fillStyle = g; ctx.fill();
  // подписи найденных пиков: ближайшая линия в допуске 2 %
  let found = 0; ctx.font = '700 11px system-ui';
  PK.forEach(c => { const e = Ecal(c); let best = null; LIB.forEach(l => { if (Math.abs(l[0] - e) < Math.max(4, 0.02 * l[0]) && (!best || Math.abs(l[0] - e) < Math.abs(best[0] - e))) best = l; }); const x = X(e), y = Y(SPEC[c]) - 8; if (best) found++; ctx.fillStyle = best ? best[2] : '#93a3c4'; ctx.fillText(best ? best[1] : t('unk'), x, Math.max(bx.t + 26, y)); });
  // точки калибровки
  pts.forEach((p, i) => { const x = X(Ecal(p.ch)); ctx.strokeStyle = '#ff4d6d'; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(x, bx.t + 30); ctx.lineTo(x, bx.b); ctx.stroke(); ctx.lineWidth = 1; ctx.fillStyle = '#ff4d6d'; ctx.beginPath(); ctx.arc(x, bx.t + 30, 9, 0, 7); ctx.fill(); ctx.fillStyle = '#fff'; ctx.font = '800 11px system-ui'; ctx.fillText(i + 1, x, bx.t + 34); });
  if (help) { [661.66, 1460.82].forEach(E => { const x = X(Ecal(chOf(E))); ctx.strokeStyle = 'rgba(255,204,51,.9)'; ctx.lineWidth = 3; ctx.beginPath(); ctx.arc(x, Y(SPEC[Math.round(chOf(E))]) + 10, 18, 0, 7); ctx.stroke(); ctx.lineWidth = 1; }); }
  const rows = []; const res = pts.filter(p => p.E > 0);
  rows.push('<span class="pill">' + t('g.res', fx(CAL[1], 4) + '·ch' + (Math.abs(CAL[2]) > 1e-9 ? ' + ' + CAL[2].toExponential(2) + '·ch²' : '') + (CAL[0] >= 0 ? ' + ' : ' − ') + fx(Math.abs(CAL[0]), 2)) + '</span>');
  if (res.length) { const mse = Math.sqrt(res.reduce((a, p) => a + (Ecal(p.ch) - p.E) ** 2, 0) / res.length); rows.push('<span class="pill">' + t('g.mse', fx(mse, 2)) + '</span>'); }
  rows.push('<span class="pill ' + (found === PK.length ? 'good' : found ? '' : 'bad') + '">' + t('g.id', found, PK.length) + '</span>');
  if (msg) rows.push('<span class="pill bad">' + msg + '</span>'); if (help) rows.push('<span class="pill">' + t('g.help1') + '</span>');
  $('#gRes').innerHTML = rows.join('');
  $('#gPick').textContent = picking ? t('g.pickOn') : t('g.pick'); $('#gPick').classList.toggle('main', picking);
}
cv.addEventListener('click', ev => { if (!picking || !G) return; const r = cv.getBoundingClientRect(), E = G.X.inv(ev.clientX - r.left); let ch = 0; for (let c = 0; c < NCH; c++) if (Math.abs(Ecal(c) - E) < Math.abs(Ecal(ch) - E)) ch = c; pts.push({ ch: nearestPeak(ch), E: 0 }); picking = false; cv.style.cursor = ''; ptsUI(); draw(); });
$('#gPick').onclick = () => { picking = !picking; cv.style.cursor = picking ? 'crosshair' : ''; draw(); };
$('#gRun').onclick = fitCal;
$('#gHelp').onclick = () => { help = !help; draw(); };
$('#gReset').onclick = () => { CAL = START.slice(); pts = []; picking = false; help = false; msg = ''; ptsUI(); draw(); };
GUIDE.onRedraw(() => { ptsUI(); draw(); });

/* ── ширина пика ── */
(function fwhm() {
  const cvf = $('#cvFw'), r = $('#fwR'), LINES = [[583.19, 0.85, '#CCDD88'], [609.31, 1.0, '#447700'], [661.66, 1.6, '#FFCC77']];
  const chips = [['fw.chip.csi', 85], ['fw.chip.nai', 65], ['fw.chip.good', 60]];
  $('#fwChips').innerHTML = chips.map(([k, v]) => '<button class="chip" data-v="' + v + '" data-t="' + k + '"></button>').join('');
  $$('#fwChips .chip').forEach(b => b.onclick = () => { r.value = b.dataset.v; draw(); });
  r.addEventListener('input', draw);
  function draw() {
    const f = +r.value / 10, sg = E => f / 100 * 662 * Math.sqrt(E / 662) / 2.355;
    const { ctx, w, h } = setup(cvf), bx = { l: 40, t: 14, r: w - 12, b: h - 26 }, X = scale('lin', 480, 760, bx.l, bx.r);
    const N = 400, xs = Array.from({ length: N }, (_, i) => 480 + 280 * i / (N - 1)), one = (E, a, e) => a * Math.exp(-0.5 * ((e - E) / sg(E)) ** 2) * (sg(662) / sg(E));
    const tot = xs.map(e => LINES.reduce((s, [E, a]) => s + one(E, a, e), 0) + 0.06);
    const Y = scale('lin', 0, Math.max(...tot) * 1.12, bx.b, bx.t);
    axes(ctx, bx, X, Y, { xl: GUIDE.lang === 'ru' ? 'энергия, кэВ' : 'energy, keV', noY: true });
    LINES.forEach(([E, a, col]) => { ctx.beginPath(); xs.forEach((e, i) => { const y = Y(one(E, a, e) + 0.06); i ? ctx.lineTo(X(e), y) : ctx.moveTo(X(e), y); }); ctx.strokeStyle = rgba(col, .9); ctx.lineWidth = 1.5; ctx.setLineDash([4, 3]); ctx.stroke(); ctx.setLineDash([]); });
    ctx.beginPath(); xs.forEach((e, i) => { const y = Y(tot[i]); i ? ctx.lineTo(X(e), y) : ctx.moveTo(X(e), y); }); ctx.lineTo(X(760), bx.b); ctx.lineTo(X(480), bx.b); ctx.closePath(); ctx.fillStyle = 'rgba(91,227,138,.28)'; ctx.fill(); ctx.strokeStyle = '#5be38a'; ctx.lineWidth = 2.2; ctx.stroke(); ctx.lineWidth = 1;
    // половина высоты у 662
    const peakY = one(661.66, 1.6, 661.66) + 0.06, half = 0.06 + (peakY - 0.06) / 2, fw = 2.355 * sg(661.66), y = Y(half), x0 = X(661.66 - fw / 2), x1 = X(661.66 + fw / 2);
    ctx.strokeStyle = '#ffcc33'; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(x0, y); ctx.lineTo(x1, y); ctx.stroke(); [x0, x1].forEach((x, i) => { ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x + (i ? -7 : 7), y - 5); ctx.moveTo(x, y); ctx.lineTo(x + (i ? -7 : 7), y + 5); ctx.stroke(); });
    ctx.setLineDash([3, 3]); ctx.beginPath(); ctx.moveTo(X(640), Y(peakY)); ctx.lineTo(X(690), Y(peakY)); ctx.stroke(); ctx.setLineDash([]); ctx.lineWidth = 1;
    ctx.fillStyle = '#ffcc33'; ctx.font = '700 12px system-ui'; ctx.textAlign = 'center'; ctx.fillText('FWHM ' + fx(fw, 1) + (GUIDE.lang === 'ru' ? ' кэВ' : ' keV'), (x0 + x1) / 2, y - 10);
    ctx.font = '600 11px system-ui'; LINES.forEach(([E, , col]) => { ctx.fillStyle = col; ctx.fillText(fx(E, 0), X(E), bx.t + 10); });
    // разделены ли 583 и 609: есть ли провал между ними
    let mid = Infinity; xs.forEach((e, i) => { if (e > 590 && e < 602) mid = Math.min(mid, tot[i]); }); const top = Math.min(...xs.map((e, i) => (Math.abs(e - 583) < 2 || Math.abs(e - 609) < 2) ? tot[i] : Infinity).filter(isFinite));
    const sep = mid < 0.9 * top;
    $('#fwV').textContent = fx(f, 1) + ' %';
    $('#fwRes').innerHTML = '<span class="pill ' + (sep ? 'good' : 'bad') + '">' + t('fw.sep', t(sep ? 'fw.ok' : 'fw.merge')) + '</span><span class="pill">' + t('fw.w', fx(fw, 1)) + '</span>';
  }
  io.observe(cvf); GUIDE.onRedraw(draw);
})();

GUIDE.Q.heroAnim(document.getElementById('cvHero'), document.getElementById('heroStat'));   // заставка с квантами, как на главной (`AMBER246`)
GUIDE.init();
