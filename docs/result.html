<script>
/* Монте-Карло-сцена главы (`AMBER246`) */
GUIDE.texts({ ru: {"mc.n": "Распады", "mc.k": "Монте-Карло в 3D", "mc.h": "От распадов к отсчётам", "mc.lead": "Почему отсчётов в пике так мало по сравнению с распадами? Каждая ступень отнимает свою долю: не каждый распад даёт фотон, не каждый фотон летит в кристалл, не каждый попавший отдаёт всю энергию. Смотрите, как это складывается на распадах Cs-137 в банке.", "mc.lab": "Cs-137 в банке на торце, Ø63 × 63 мм", "mc.fh": "Воронка счёта", "mc.r1": "распадов", "mc.r2": "дали фотон 662 кэВ", "mc.r3": "долетели до кристалла", "mc.r4": "отдали всю энергию — в пике", "mc.form": "y = <b>{0}</b> · ε = в пике / фотонов = <b>{1}</b><br>из 1000 распадов в пике ≈ <b>{2}</b><br>A = N / (t × ε × y)", "mc.wait": "считаю распады…", "mc.f1": "<b>ε × y</b> — доля распадов, дающих отсчёт в пике. Её BecqMoni берёт из кривой эффективности или матрицы отклика.", "mc.f2": "<b>Ступени перемножаются:</b> 85 % × десяток процентов × доля пика — поэтому из тысячи распадов в пике лишь десятки.", "mc.f3": "<b>Отсюда формула окна результата:</b> A = N / (t · ε · y) — отсчёты делятся на время и на эту долю."},
 en: {"mc.n": "Decays", "mc.k": "Monte Carlo in 3D", "mc.h": "From decays to counts", "mc.lead": "Why are there so few counts in the peak compared with decays? Every step takes its share: not every decay gives a photon, not every photon flies into the crystal, not every one that hits gives up all its energy. Watch it add up for Cs-137 decays in a jar.", "mc.lab": "Cs-137 in a jar on the face, Ø63 × 63 mm", "mc.fh": "The counting funnel", "mc.r1": "decays", "mc.r2": "gave a 662 keV photon", "mc.r3": "reached the crystal", "mc.r4": "gave up all energy — in the peak", "mc.form": "y = <b>{0}</b> · ε = in the peak / photons = <b>{1}</b><br>out of 1000 decays, in the peak ≈ <b>{2}</b><br>A = N / (t × ε × y)", "mc.wait": "counting decays…", "mc.f1": "<b>ε × y</b> is the share of decays that give a count in the peak. BecqMoni takes it from the efficiency curve or the response matrix.", "mc.f2": "<b>The steps multiply:</b> 85 % × some ten percent × the peak share — that is why only tens out of a thousand decays end up in the peak.", "mc.f3": "<b>Hence the results-window formula:</b> A = N / (t · ε · y) — counts divided by time and by that share."} });
(function () {
  const { $, fx, t, Q } = GUIDE;
  const Y = 0.851;
  const ROWS = [['mc.r1', '#93a3c4'], ['mc.r2', '#ffcc33'], ['mc.r3', '#6aa8ff'], ['mc.r4', '#ff4d6d']];
  const mc = Q.mcDuo($('#cvMC'), { scenes: [{ geo: { size: 6.3, gap: 1.0, src: 'jar' }, label: () => t('mc.lab') }], lines: [[661.66, Y]], analog: 220, emax: 800, onStats: show });
  function show() {
    const s = mc.scenes[0]; if (!s) return; const A = s.A, v = [A.dec, A.ph, A.hit, A.pk];
    $('#mcFunnel').innerHTML = ROWS.map(([k, c], i) => {
      const p = A.dec ? 100 * v[i] / A.dec : 0;
      return '<div style="margin:8px 0"><div style="display:flex;justify-content:space-between;font-size:14px"><span>' + t(k) + '</span><b style="font-variant-numeric:tabular-nums">' + v[i] + ' · ' + (p >= 10 ? fx(p, 0) : fx(p, 1)) + ' %</b></div>' +
        '<div style="height:12px;border-radius:6px;background:var(--panel2);overflow:hidden;margin-top:4px"><i style="display:block;height:100%;width:' + Math.max(p, 0.6) + '%;background:' + c + ';transition:width .3s"></i></div></div>';
    }).join('');
    const eps = A.ph ? A.pk / A.ph : 0;
    $('#mcF').innerHTML = A.ph > 200 ? t('mc.form', fx(Y, 3), fx(eps, 4), fx(Y * eps * 1000, 1)) : t('mc.wait');
  }
  GUIDE.onRedraw(show);
})();
</script>

'hoodtxt':'<li>Бк = (амплитуда разбора / живое время) × K; K = 1 при абсолютной шкале (матрица или кривая из геометрии / ЛСРМ) и 0, когда беккерели скрыты — тогда строка пишет «нет K», а не молчаливый ноль.</li><li>Погрешность — в абсолютной форме: σ²(Бк) = (σ имп/с · K)² + (имп/с · σK)²; колонка «Неопред.» умножает её на уровень из настроек.</li><li>«На дату отбора» = среднее за набор × 2^((начало − отбор)/T½) × λT/(1 − e^(−λT)), T — полное время набора (распад идёт и в мёртвое время). МДА умножается тем же множителем. Год в T½ — 365 суток, как у импорта из NucBase; у члена ряда T½ — корня ряда.</li><li>МДА — предел обнаружения разбора a# по ISO 11929 (Xu 2022), раздутый на √(χ²/ndf); это не MDA Карри по зоне. При «Результат &gt; MDA» строка без МДА считается не обнаруженной.</li><li>Вес хранится в килограммах: поле «Вес» в граммах делится на 1000; Бк/кг = Бк / вес, Бк/л = Бк / объём.</li>',

'p.s2':'Count the sample. In <span class="ui">Sample Information</span> type the <span class="ui">Weight</span> and the <span class="ui">Sampling Date</span>.',
'p.s3':'<span class="ui">Efficiency</span> — the curve of this vessel with a geometry (chapter <a href="geometry.html">8</a>).',
'p.s4':'<span class="ui m">View → Peak Detection</span> → <span class="ui">Use set:</span> — one with Cs-137.',
'p.s5':'<span class="ui">View:</span> → <span class="ui">Show FSA (full-spectrum decomposition)</span>.',
'p.s6':'<span class="ui m">View → Measurement Result</span> → units <span class="ui">Bq/kg</span>, correction <span class="ui">Half Lifetime Correction</span>.',
'p.s7':'The header must read <span class="ui">FSA: Bq by response matrix</span>; the second column — <span class="ui">At sampling</span>.',
'p.warn':'<b>Weight is typed in grams</b> (unless kilograms are chosen in the preferences), while Bq/kg is per kilogram. 250 g of mushrooms — type 250, the program converts it.',
'p.f1':'<b>Weight 0 — no Bq/kg.</b> Rows say “no weight”; the same with volume and Bq/l.',
'p.f2':'<b>Sampling date is not the measuring date.</b> For I-131 a week’s difference is almost a factor of two.',
'p.f3':'<b>Everything is saved into the spectrum file</b> — weight, dates and notes.',
'r.k':'Quick','r.h':'“Selected Region”: an estimate from one line',
'r.lead':'Need a quick look at one line without FSA? Drag a selection across the peak — a panel appears on the right with the area, thresholds and, when possible, the activity. Like weighing one fruit without unpacking the whole basket.',
'r.cap':'A selection across the Cs-137 peak and the “Selected Region” panel',
'r.l1':'<b>Selection</b> — drag the left mouse button across the peak',
'r.l2':'<b>Channel</b> and <b>Energy</b> — the selection bounds',
'r.l3':'<b>Gross counts</b>, <b>background counts</b> and their ratio',
'r.l4':'<b>Net cps</b> and <b>net counts</b> with uncertainty',
'r.l5':'<b>Detected</b>, thresholds <b>Lc</b> and <b>Ld</b>',
'r.l6':'<b>Peak counts</b>, <b>FWHM</b> and <b>Centroid</b> — the fitted peak',
'r.info':'<b>When the activity “from line:” appears:</b> exactly one detected peak lies in the selection, it is labelled with a line that has a yield per decay, and the spectrum has a background and an efficiency curve. Otherwise the panel says why in words: “no background spectrum”, “outside the efficiency curve”, “line yield below …”, “net count is not above zero”.',
'r.f1':'<b>An estimate, not a replacement for FSA.</b> One line knows nothing of its neighbours, Compton and summing — for a report use the result window.',
'r.f2':'<b>No background — no becquerels.</b> The panel computes the area, but shows the activity only with a background spectrum.',
'r.f3':'<b>The correction is shared.</b> “Half Lifetime Correction” in the result window also decides for the selection panel’s becquerels.',
'hoodtxt':'<li>Bq = (decomposition amplitude / live time) × K; K = 1 with an absolute scale (matrix, or a curve from geometry / LSRM) and 0 when becquerels are hidden — the row then says “no K” rather than a silent zero.</li><li>The uncertainty is in absolute form: σ²(Bq) = (σ cps · K)² + (cps · σK)²; the “Uncertainty” column multiplies it by the level from the preferences.</li><li>“At sampling” = acquisition mean × 2^((start − sampling)/T½) × λT/(1 − e^(−λT)), T being the full acquisition time (decay goes on in dead time too). The MDA is multiplied by the same factor. A year in T½ is 365 days, as in the NucBase import; a chain member takes the T½ of the chain root.</li><li>MDA is the decomposition detection limit a# by ISO 11929 (Xu 2022), inflated by √(χ²/ndf); it is not the Currie MDA of a zone. With “Result &gt; MDA” a row without an MDA counts as not detected.</li><li>Weight is stored in kilograms: the “Weight” field in grams is divided by 1000; Bq/kg = Bq / weight, Bq/l = Bq / volume.</li>',
}});

/* ── 1. заголовок окна результата: что значит каждое состояние ── */
(function states() {
  const ROWS = [['K-40', '106.36', '±56.36 (52.99%)', '90.3…'], ['Th-232', '965.18', '±9.87 (1.02%)', '5.1…']];
  const ROWS2 = [['K-40', '215.19', '±77.04 (35.80%)', '118.7…'], ['Th-232', '1085.09', '±16.54 (1.52%)', '10.6…']];
  let s = 1;
  function draw() {
    $('#dStates').innerHTML = [1, 2, 3, 4, 5, 6, 7].map(i => '<button class="chip' + (i === s ? ' on' : '') + '" data-i="' + i + '">' + t('d.s' + i) + '</button>').join('');
    $$('#dStates .chip').forEach(b => b.onclick = () => { s = +b.dataset.i; draw(); });
    const unit = s === 7 ? t('u.bqkg') : t('u.bq');
    let body;
    if (s === 1) body = ROWS.map(r => '<tr><td>' + r[0] + '</td><td class="n">' + r[1] + '</td><td class="n">' + r[2] + '</td><td class="n">' + r[3] + '</td></tr>').join('');
    else if (s === 2) body = ROWS2.map(r => '<tr><td>' + r[0] + '</td><td class="n">' + r[1] + '</td><td class="n">' + r[2] + '</td><td class="n">' + r[3] + '</td></tr>').join('');
    else if (s === 6) body = '<tr><td>FSA</td><td colspan="3" class="span">' + t('c.comp') + '</td></tr>';
    else if (s === 5) body = '<tr><td>FSA</td><td colspan="3" class="span">' + t('c.geo') + '</td></tr>';
    else body = ROWS.map(r => '<tr><td>' + r[0] + '</td><td colspan="3" class="span">' + t(s === 7 ? 'c.nom' : 'c.nok') + '</td></tr>').join('');
    $('#dWin').innerHTML = '<div class="bar"><span>' + unit + ' ▾</span><span>' + t('corr.no') + ' ▾</span></div><table><tr><th>' + t('d.h' + s) + '</th><th>' + t('col.mean') + '</th><th>' + t('col.u') + ' 2σ</th><th>' + t('col.mda') + '</th></tr>' + body + '</table>';
    $('#dTxt').innerHTML = t('d.t' + s);
  }
  GUIDE.onRedraw(draw);
})();

/* ── 2. калькулятор: та же формула, что у программы (MeasurementResultManager.DecayToSamplingFactor) ── */
(function calc() {
  const Y = 365;                                   // год в T½ — 365 суток, как у программы
  const NUC = [['Cs-137', 30.08 * Y], ['Cs-134', 2.0652 * Y], ['I-131', 8.0252], ['Be-7', 53.22], ['K-40', 1.248e9 * Y], ['Ra-226', 1600 * Y], ['Am-241', 432.6 * Y], ['none', 0]];
  const EX = [
    { nuc: 0, a: '85', u: '9.4', unit: 1, m: '250', ts: '2026-09-01T10:00', t0: '2026-10-15T09:00', dur: '24' },
    { nuc: 2, a: '40', u: '6', unit: 2, m: '1000', ts: '2026-10-01T08:00', t0: '2026-10-11T08:00', dur: '12' },
    { nuc: 2, a: '40', u: '6', unit: 0, m: '1000', ts: '2026-10-01T08:00', t0: '2026-10-01T09:00', dur: '192.6' },
  ];
  let corr = 1;
  const num = v => { const x = parseFloat(String(v).replace(',', '.')); return isFinite(x) ? x : NaN; };
  function load(e) {
    $('#kNuc').value = e.nuc; $('#kA').value = e.a; $('#kU').value = e.u; $('#kUnit').value = e.unit; $('#kM').value = e.m;
    $('#kTs').value = e.ts; $('#kT0').value = e.t0; $('#kDur').value = e.dur; corr = 1; draw();
  }
  function halfTxt(d) { return d <= 0 ? t('k.none') : d >= Y ? sig(d / Y, 4) + ' ' + t('k.y') : sig(d, 4) + ' ' + t('k.d'); }
  function ui() {
    const nv = $('#kNuc').value, uv = $('#kUnit').value;
    $('#kNuc').innerHTML = NUC.map((n, i) => '<option value="' + i + '">' + (n[0] === 'none' ? t('k.none') : n[0] + ' (' + halfTxt(n[1]) + ')') + '</option>').join('');
    $('#kUnit').innerHTML = ['u.bq', 'u.bqkg', 'u.bql'].map((k, i) => '<option value="' + i + '">' + t(k) + '</option>').join('');
    if (nv !== '') $('#kNuc').value = nv; if (uv !== '') $('#kUnit').value = uv;
    $('#kEx').innerHTML = [1, 2, 3].map(i => '<button class="chip" data-i="' + i + '">' + t('k.ex' + i) + '</button>').join('');
    $$('#kEx .chip').forEach(b => b.onclick = () => load(EX[+b.dataset.i - 1]));
  }
  function draw() {
    $('#kCorr').innerHTML = ['corr.no', 'corr.hl'].map((k, i) => '<button class="chip' + (i === corr ? ' on' : '') + '" data-i="' + i + '">' + t(k) + '</button>').join('');
    $$('#kCorr .chip').forEach(b => b.onclick = () => { corr = +b.dataset.i; draw(); });
    const unit = +$('#kUnit').value; $('#kMassL').textContent = t(unit === 2 ? 'k.vol' : 'k.mass'); $('#kM').disabled = unit === 0;
    const T = NUC[+$('#kNuc').value][1], A = num($('#kA').value), U = num($('#kU').value), m = num($('#kM').value);
    const ts = new Date($('#kTs').value).getTime(), t0 = new Date($('#kT0').value).getTime(), dur = num($('#kDur').value) / 24;
    const dt = (t0 - ts) / 864e5, ok = isFinite(A) && isFinite(dt) && dt >= 0 && dur >= 0 && (unit === 0 || m > 0);
    if (!ok) { $('#kTiles').innerHTML = ''; $('#kF').textContent = ''; $('#kMsg').innerHTML = '<span class="pill bad">' + t('k.bad') + '</span>'; setup($('#cvDecay')); return; }
    let f = 1, toStart = 1, mean = 1;
    if (T > 0) { toStart = Math.pow(2, dt / T); const x = Math.LN2 * dur / T; mean = x > 0 ? (x < 1e-4 ? 1 + x / 2 + x * x / 12 : x / (1 - Math.exp(-x))) : 1; f = toStart * mean; }
    const div = unit === 0 ? 1 : m / 1000, uname = t(['u.bq', 'u.bqkg', 'u.bql'][unit]);
    const Am = A / div, As = A * f / div, Um = isFinite(U) ? U / div : NaN;
    $('#kF').textContent = T > 0 ? fx(A, 2) + ' × 2^(' + fx(dt, 3) + ' / ' + sig(T, 5) + ') × ' + fx(mean, 4) + ' = ' + fx(A * f, 2) + ' ' + t('u.bq') + (unit ? '  →  / ' + fx(div, 3) + ' = ' + fx(As, 2) + ' ' + uname : '') : t('k.noT');
    const show = corr ? As : Am;
    $('#kTiles').innerHTML =
      '<div class="tile"><div class="big"' + (corr ? '' : ' style="color:var(--gold)"') + '>' + fx(Am, 2) + '</div><div class="small">' + uname + ' · ' + t('k.t.mean') + (isFinite(Um) ? ' · ±' + fx(Um, 2) : '') + '</div></div>' +
      '<div class="tile"><div class="big"' + (corr ? ' style="color:var(--gold)"' : '') + '>' + fx(As, 2) + '</div><div class="small">' + uname + ' · ' + t('k.t.samp') + (isFinite(Um) ? ' · ±' + fx(Um * f, 2) : '') + '</div></div>' +
      '<div class="tile"><div class="big">×' + fx(f, 3) + '</div><div class="small">' + t('k.t.f') + ' · ' + t('k.t.fs', fx(dt, 2)) + '</div></div>';
    $('#kMsg').innerHTML = '<span class="pill good">' + (corr ? t('col.samp') : t('col.mean')) + ': <b>' + fx(show, 2) + ' ' + uname + '</b></span>';
    // график: активность пробы от даты отбора до конца набора
    const cv = $('#cvDecay'), { ctx, w, h } = setup(cv), bx = { l: 52, t: 16, r: w - 14, b: h - 26 };
    const tEnd = dt + dur, X = scale('lin', 0, Math.max(tEnd * 1.12, 1), bx.l, bx.r), A0 = A * f;
    const At = d => T > 0 ? A0 * Math.pow(2, -d / T) : A0;
    const Y2 = scale('lin', 0, A0 * 1.15, bx.b, bx.t);
    axes(ctx, bx, X, Y2, { xl: t('k.ax.t'), yl: t('k.ax.a') });
    ctx.fillStyle = 'rgba(106,168,255,.16)'; ctx.fillRect(X(dt), bx.t, Math.max(2, X(tEnd) - X(dt)), bx.b - bx.t);
    ctx.fillStyle = '#6aa8ff'; ctx.font = '600 11px system-ui'; ctx.textAlign = 'center'; ctx.textBaseline = 'top'; ctx.fillText(t('k.lab.acq'), (X(dt) + X(tEnd)) / 2, bx.t + 2);
    ctx.beginPath(); for (let i = 0; i <= 200; i++) { const d = X.d1 * i / 200; ctx.lineTo(X(d), Y2(At(d))); } ctx.strokeStyle = '#5be38a'; ctx.lineWidth = 2.2; ctx.stroke(); ctx.lineWidth = 1;
    ctx.strokeStyle = '#ffcc33'; ctx.lineWidth = 2.5; ctx.beginPath(); ctx.moveTo(X(dt), Y2(A)); ctx.lineTo(X(tEnd) + (tEnd === dt ? 4 : 0), Y2(A)); ctx.stroke(); ctx.lineWidth = 1;
    ctx.fillStyle = '#ffcc33'; ctx.textAlign = 'left'; ctx.textBaseline = 'bottom'; ctx.fillText(t('k.lab.mean') + ' ' + fx(A, 2), Math.min(X(dt) + 4, bx.r - 150), Y2(A) - 4);
    ctx.fillStyle = '#5be38a'; ctx.beginPath(); ctx.arc(X(0), Y2(A0), 5, 0, 7); ctx.fill(); ctx.textAlign = 'left'; ctx.textBaseline = 'top'; ctx.fillText(t('k.lab.samp') + ' ' + fx(A0, 2), X(0) + 8, Y2(A0) + 4);
  }
  ['#kNuc', '#kA', '#kU', '#kM', '#kTs', '#kT0', '#kDur', '#kUnit'].forEach(id => $(id).addEventListener('input', draw));
  GUIDE.onRedraw(() => { ui(); draw(); });
  ui(); load(EX[0]);
  io.observe($('#cvDecay'));
})();

/* ── 3. «настройте окно»: та же логика, что у DCResultView (обнаружено, ND, уровень σ) ── */
(function settings() {
  // [имя, значение, σ (1σ), МДА]; K-40 и Th-232 — со снимка (2σ: ±56.36 и ±9.87)
  const R = [['K-40', 106.36, 28.18, 90.3, '90.3…'], ['Th-232', 965.18, 4.935, 5.1, '5.1…'], ['ex', 3.10, 2.40, 7.90, '7.90']];
  function preset(i) { $('#sLev').value = i ? 2 : 1; $('#sK').value = i ? 2 : 3; $('#sCond').value = 0; $('#sNd').checked = !!i; draw(); }
  function ui() {
    $('#sPre').innerHTML = ['s.def', 's.shot'].map((k, i) => '<button class="chip" data-i="' + i + '">' + t(k) + '</button>').join('');
    $$('#sPre .chip').forEach(b => b.onclick = () => preset(+b.dataset.i));
    const v = $('#sCond').value; $('#sCond').innerHTML = '<option value="0">' + t('s.c0') + '</option><option value="1">' + t('s.c1') + '</option>'; if (v !== '') $('#sCond').value = v;
  }
  function draw() {
    const lev = +$('#sLev').value, k = +$('#sK').value, cond = +$('#sCond').value, nd = $('#sNd').checked;
    $('#sLevV').textContent = fx(lev, 2) + ' σ'; $('#sKV').textContent = fx(k, 2) + ' σ';
    let det = 0;
    const rows = R.map(([n, v, s, mda, mdaTxt]) => {
      const d = cond === 0 ? (s > 0 && v >= s * k) : (mda > 0 && v >= mda); if (d) det++;
      const e = s * lev, val = (nd || d) ? fx(v, 2) : '0', unc = (nd || d) ? '±' + fx(e, 2) + (v !== 0 ? ' (' + fx(100 * e / Math.abs(v), 2) + '%)' : '') : '-';
      return '<tr><td>' + (n === 'ex' ? t('s.ex') : n) + '</td><td class="n">' + (d ? '' : '<span class="nd">ND</span>') + val + '</td><td class="n">' + unc + '</td><td class="n">' + mdaTxt + '</td></tr>';
    }).join('');
    $('#sWin').innerHTML = '<div class="bar"><span>' + t('u.bq') + ' ▾</span><span>' + t('corr.no') + ' ▾</span></div><table><tr><th>' + t('d.h1') + '</th><th>' + t('col.mean') + '</th><th>' + t('col.u') + ' ' + (lev === 1 ? '' : fx(lev, 2).replace(/\.?0+$/, '')) + 'σ</th><th>' + t('col.mda') + '</th></tr>' + rows + '</table>';
    const why = cond === 0 ? t('s.why0', fx(R[0][1], 2), fx(k, 2), fx(R[0][2] * k, 2)) : t('s.why1', fx(R[0][1], 2), R[0][4]);
    $('#sMsg').innerHTML = '<span class="pill">' + t('s.msg', det, R.length) + '</span><span class="pill">' + why + '</span>';
  }
  ['#sLev', '#sK', '#sCond', '#sNd'].forEach(id => $(id).addEventListener('input', draw));
  GUIDE.onRedraw(() => { ui(); draw(); });
})();

GUIDE.Q.heroAnim(document.getElementById('cvHero'), document.getElementById('heroStat'));   // заставка с квантами, как на главной (`AMBER246`)
GUIDE.init();
</script>
