<script>
/* Монте-Карло-сцена главы (`AMBER246`) */
GUIDE.texts({ ru: {"mc.n": "Слой", "mc.k": "Монте-Карло", "mc.h": "Как рождается слой", "mc.lead": "Слой — это то, как нуклид со всеми своими линиями выглядит именно в вашей геометрии. Его печатает тот же перенос фотонов: каждая линия ряда летит в кристалл со своим выходом, и из оставленной энергии складывается форма слоя — пики, плато, пики вылета вместе.", "mc.pick": "Нуклид:", "mc.chain": "(ряд)", "mc.lab": "слой {0} в банке на торце", "mc.t1": "линий в слое", "mc.t2": "фотонов прогнано", "mc.t3": "в пиках на испущенный фотон", "mc.f1": "<b>Слой — это целый нуклид</b>, а не отдельный пик. Поэтому FSA разбирает даже перекрытые линии: 583 и 609 кэВ из разных рядов не путаются.", "mc.f2": "<b>Слой зависит от геометрии.</b> Один и тот же нуклид в банке и в Маринелли даёт разные слои — потому матрица считается для вашей геометрии.", "mc.f3": "<b>В программе слои не считаются заново</b> на каждом разборе: они берутся из матрицы отклика, которую программа один раз считает для вашей геометрии."},
 en: {"mc.n": "Layer", "mc.k": "Monte Carlo", "mc.h": "How a layer is born", "mc.lead": "A layer is what a nuclide with all its lines looks like in exactly your geometry. The same photon transport prints it: every line of the chain flies into the crystal with its own yield, and the energy left behind builds the shape of the layer — peaks, plateaus and escape peaks together.", "mc.pick": "Nuclide:", "mc.chain": "(chain)", "mc.lab": "{0} layer, jar on the face", "mc.t1": "lines in the layer", "mc.t2": "photons run", "mc.t3": "in the peaks per emitted photon", "mc.f1": "<b>A layer is a whole nuclide</b>, not a single peak. That is why FSA separates even overlapping lines: 583 and 609 keV from different chains do not get mixed up.", "mc.f2": "<b>The layer depends on the geometry.</b> The same nuclide in a jar and in a Marinelli beaker gives different layers — so the matrix is computed for your geometry.", "mc.f3": "<b>The app does not recompute layers</b> on every analysis: it takes them from the response matrix the program computes once for your geometry."} });
(function () {
  const { $, $$, fx, t, Q } = GUIDE;
  const NUC = [
    { id: 'Cs-137', c: '#6aa8ff', L: [[661.66, 0.851]] },
    { id: 'K-40', c: '#ff9f43', L: [[1460.82, 0.1034]] },
    { id: 'Ra-226', c: '#5be38a', L: [[186.2, 0.036], [242.0, 0.073], [295.2, 0.184], [351.9, 0.356], [609.3, 0.455], [768.4, 0.049], [1120.3, 0.149], [1238.1, 0.058], [1764.5, 0.153]] },
    { id: 'Th-232', c: '#c38bff', L: [[238.6, 0.436], [338.3, 0.113], [583.2, 0.304], [727.3, 0.067], [911.2, 0.258], [969.0, 0.158], [2614.5, 0.359]] },
  ];
  let cur = 3;
  const mc = Q.mcDuo($('#cvMC'), { scenes: [{ geo: { size: 6.3, gap: 1.0, src: 'jar' }, label: () => t('mc.lab', NUC[cur].id) }], lines: NUC[cur].L, emax: 2900, layer: () => NUC[cur].c,
    onStats: () => { const s = mc.scenes[0]; $('#mcT1').textContent = NUC[cur].L.length; $('#mcT2').textContent = s.S.n; $('#mcT3').textContent = s.S.n ? fx(100 * s.S.fep / s.S.n, 2) + ' %' : '…'; } });
  function chips() {
    $('#mcChips').innerHTML = NUC.map((n, i) => '<button class="chip' + (i === cur ? ' on' : '') + '" data-i="' + i + '">' + n.id + (n.L.length > 1 ? ' ' + t('mc.chain') : '') + '</button>').join('');
    $$('#mcChips .chip').forEach(b => b.onclick = () => { cur = +b.dataset.i; mc.setLines(NUC[cur].L); chips(); });
  }
  GUIDE.onRedraw(chips); chips();
})();
</script>

'r.cap':'«Отчёт FSA»: диск Th-232, разбор с матрицей; таблица прокручена к концу, к «Качеству разбора»',
'r.l1':'<b>Источник состава</b>: «По меткам найденных пиков» — только нуклиды подписанных пиков, каждый своей строкой; «Из NucBase» — родитель по пикам вместе с дочерними. Излучения и выходы в обоих режимах из базы',

'r.l3':'<b>Дополнительные компоненты модели</b>: атомный рентген, каскадное суммирование, обратное рассеяние, пики вылета и 511 кэВ, наложение импульсов. По умолчанию всё включено. Под галками — «Нижняя граница разбора, кэВ»: каналы ниже неё в разбор не входят (0 — по порогу АЦП)',
'r.l4':'<b>Отрисовка</b>: группировка (родительские / дочерние нуклиды), «Невязка модели» — лента расхождений, «Данные спектра»',
'r.l5':'<b>Слой матрицы</b>: показать только пик, комптон, вылеты… (живо только при матрице)',
'r.l6':'<b>Строка состояния</b>: зелёная «расчёт завершён», жёлтая «идёт расчёт», красная «ошибка» с причиной, серая «расчёта не было»',
'r.l7':'<b>Таблица</b>: доля каждого компонента в %, «— ряд Th-232», «— сумм-пик», при матрице — «— пики вылета» и «— обратное рассеяние» под нуклидом. Строки отдельных пиков и горбов под ними свёрнуты: стрелка ▶ перед подписью раскрывает их, а свёрнутая строка показывает сумму их отсчётов и в скобках — сколько строк скрыто. С клавиатуры у выбранной строки: → раскрывает группу (повторное → — переход к её первой строке), ← сворачивает (со строки группы — возврат к заголовку), Enter и Пробел раскрывают и сворачивают. Раскрытая группа остаётся раскрытой до закрытия программы. Щелчок по строке подсвечивает её слой на графике. Строка «— сумм-пик», «— пики вылета» или «— обратное рассеяние» подсвечивает свою штриховку целиком, строка отдельного пика или горба под ней — только его участок (±FWHM вокруг пика); остальная полоса того же нуклида при этом бледнеет вполовину, прочие слои — как при выборе любой строки',
'r.l8':'<b>Качество разбора</b> — разберём в разделе 3',
'r.tip':'<b>Блоки 1–3 меняют расчёт</b> — после щелчка разбор пересчитывается. <b>Блоки 4–5 меняют только картинку</b> — ничего не пересчитывается. Подсказка у каждой галки говорит то же самое. При матрице галка «Обратное рассеяние» меняет только показ, кроме защиты без слоёв (шаг 4).',

'r.m4':'<b>Просмотр:</b> — режим FSA на полосе под графиком',
'r.m5':'<b>Геометрия</b> — кривая с геометрией, по ней идёт разбор',

'q.e1h':'Расхождение и уровень шума','q.e1':'Какая доля измеренных отсчётов не описана моделью: «+» — в спектре больше, чем в модели; «−» — модель выше спектра. Сравнивайте с уровнем шума: даже идеальная модель даёт около него из-за статистики. Здесь +4.5 / −5.4 % при уровне шума 2.4 % — кое-что не описано (см. последнюю строку). «На графике обрезано ниже нуля» значит только, что на графике лента обрезана у нуля.',
'q.e2h':'Качество подгонки χ²/ndf','q.e2':'Около 1 — модель согласна со статистикой. 2–3 — есть заметные расхождения: не хватает компонента или нуклида. Десятки — что-то всерьёз не так: калибровка, кривая, состав.',
'q.e3h':'Поправка погрешности на качество подгонки','q.e3':'Подгонка хуже чистой статистики — и программа честно увеличивает погрешности во столько раз. 1.000 — поправки нет. Неопределённость в окне результата уже включает этот множитель.',
'q.e4h':'Матрица отклика','q.e4':'Зелёное «учтена»: образы нуклидов построены из матрицы — с комптоном и вылетами. Красное «не учтена» или «устарела» — посчитайте или пересчитайте матрицу (глава <a href="geometry.html#matrix">8</a>).',
'q.e5h':'Кривая эффективности','q.e5':'«учтена»: веса линий внутри образа и беккерели берутся по ней. «не учтена» — низ спектра перекошен, а беккерели окно результата скроет.',
'q.e6h':'Каскадное суммирование','q.e6':'Учитывается только при матрице. Без неё нуклиды с каскадами (Co-60, Bi-214, Tl-208 и др.) занижаются — по корпусу до 11 %.',
'q.e7h':'Опорные пики шкалы','q.e7':'По скольким опорным пикам FSA сверил шкалу энергий и какую поправку нашёл: растяжение шкалы в процентах и сдвиг в кэВ. Доли процента и нули — норма; проценты и килоэлектронвольты — повод перекалибровать (глава <a href="calibration.html">6</a>).',
'q.e10h':'Пик не объяснён нуклидами разбора','q.e10':'В спектре есть пик, которого нет в модели: на 353.0 кэВ счёт на 11 % выше модели, значимость z 26.8. Рядом в библиотеке — линия Pb-214 из ряда Ra-226 (и ещё Ba-133, Eu-152), но этих нуклидов нет в составе разбора — отсюда «нет в составе». Если такой нуклид в пробе есть, пик должен получить его подпись в поиске пиков (набор нуклидов, допуск) — тогда нуклид войдёт в состав разбора.',
'q.e11h':'Матрица отклика: не учтена','q.e11':'Красное «не учтена» — и цена в подсказке строки: суммирование каскадов не учтено, нуклиды с каскадами занижены до 11 %, в модели нет комптоновской части спектра и пиков вылета. Наведите мышь на строку — подсказка скажет то же. Лечится одним действием — матрицей из геометрии (глава <a href="geometry.html#matrix">8</a>).',
'q.cap':'Тот же диск без матрицы: красные строки',
'q.l1':'<b>Отдельные компоненты</b> — пик вылета SE-1588 и обратное рассеяние («не найдено»): без матрицы они живут в таблице сами по себе',

'q.l4':'<b>Строка «Матрица отклика»</b> — наведите мышь: подсказка назовёт цену разбора без матрицы — нуклиды с каскадами занижены до 11 %, в модели нет комптоновской части и пиков вылета',

'q.f2':'<b>Расхождение сравнивается с уровнем шума, а не с нулём.</b> 3 % при уровне шума 2.5 % — отлично; 15 % при уровне шума 2 % — модель что-то упускает.',
'q.f3':'<b>Красная строка с энергией</b> — подсказка, какой нуклид забыт. Чаще всего это член ряда радия или тория, не попавший в набор.','q.mask':'<b>Фон больше спектра.</b> Если фон на участке значимо больше спектра, FSA не учитывает этот участок в подгонке: на графике он заштрихован, в окне отчёта назван его диапазон. Чаще всего так бывает, когда фон снят без пробы (пустой сосуд) или в другой обстановке. Если участок накрывает сильнейшую линию состава или без него становится меньше опор шкалы, разбор считается как обычно и горит предупреждение «Фон больше спектра».','q.knife':'Только при матрице отклика, когда окно этого предупреждения лежит в 30–100 кэВ, и только у образов с сильнейшей линией выше 100 кэВ, активность считается по линиям выше 100 кэВ: нижняя часть образа идёт свободно. В окне отчёта об этом есть своя строка.',

'm.f2':'<b>Каскадное суммирование</b> — два кванта одного распада пойманы разом: их пики проседают, а на сумме энергий вырастает пик. Без компонента Co-60 занижен.',
'm.f3':'<b>Обратное рассеяние</b> — горб от квантов, отразившихся назад от защиты, корпуса или пробы. Без матрицы это отдельный компонент; что меняется при матрице — ниже.','es.h':'Что матрица уже несёт внутри образа','es.hint':'Схема: Tl-208 при матрице отклика. Снимайте и ставьте галки: штриховка и строки таблицы появляются и исчезают, а полоса нуклида остаётся на месте. Форма упрощена, подписи строк — пример.','es.e':'Пики вылета и аннигиляция 511 кэВ','es.b':'Обратное рассеяние','es.col1':'Компонент','es.col2':'Значение','es.share':'N %','es.n':'N отсч.','es.r1':'Tl-208 — пики вылета','es.r2':'SE 2126 кэВ от 2614.5','es.r3':'Tl-208 — обратное рассеяние','es.r4':'Горб 293 кэВ от 2614.5','es.lbF':'пик 2614.5','es.lbS':'SE','es.lbD':'DE','es.lbB':'горб','es.se':'<b>Пики вылета.</b> Квант выше 1022 кэВ может родить в кристалле пару, и один или оба кванта 511 кэВ вылетают: в спектре появляются пики одиночного (SE) и двойного (DE) вылета. При матрице отклика они уже внутри образа нуклида: полоса нуклида несёт их встречной штриховкой, а под строкой нуклида стоит «Tl-208 — пики вылета (n)» с суммой отсчётов; строки вида «SE 2126 кэВ от 2614.5 | N отсч.» под ней свёрнуты и раскрываются стрелкой ▶. Щелчок по строке пика выделяет его на графике. Энергия — в шкале матрицы: кривая света поднимает SE выше E − 511. Показаны все линии, чей пик заметен: площадь не меньше 3σ спектра в ±FWHM; близкие линии идут одной строкой, полный список — в подсказке. В долю и активность они уже входят и второй раз не складываются. Снятая галка «Пики вылета и аннигиляция 511 кэВ» убирает строки и штриховку; пик остаётся в цвете нуклида. Снимает она и образ 511 кэВ, поэтому разбор спектра, где он есть, меняется. Без матрицы вылет выражает свободная колонка: отдельная строка «SE-2615» со своей долей.','es.bs':'<b>Обратное рассеяние.</b> Гамма-квант может рассеяться назад на защите, корпусе или пробе и уже потом попасть в кристалл. Он приносит мало энергии, поэтому на спектре появляется широкий горб: у 662 кэВ примерно от 185 до 290 кэВ, плотнее всего у нижнего края. Граница «на 90° и больше» условная. При матрице отклика горб уже входит в образ нуклида. Галка «Обратное рассеяние» управляет только показом: строкой «X — обратное рассеяние» и штриховкой; расчёт не меняется. Исключение — защита без слоёв (галка «Измерение в защите»): тогда отдельный образ обратного рассеяния идёт в разбор, и галка меняет расчёт. Подпись называет центр горба в шкале матрицы, поэтому по оси спектра он может стоять чуть в стороне. Рентген защиты сюда не входит. Для прежней матрицы, посчитанной без этой строки, показа нет.',

'hoodtxt':'<li>В обоих режимах линии и выходы берутся из базы, всех излучений распада, включая рентген. «По меткам найденных пиков» берёт только нуклиды подписанных пиков, каждый со свободной активностью; «Из NucBase» выводит родителя по пикам и добавляет дочерних. Линия, вбитая руками, идёт в разбор, только если нуклида нет в базе или у него нет линий. «Равновесие ряда» работает только с NucBase, «Родительские нуклиды» — только при NucBase и равновесии.</li><li>При матрице галки «Обратное рассеяние» и «Пики вылета и аннигиляция 511 кэВ» управляют показом: образы нуклидов и их подгонка те же. Вторая галка, как и без матрицы, ставит в разбор и снимает отдельный образ аннигиляции 511 кэВ. Защита, которой нет в геометрии (галка «Измерение в защите» без слоёв), получает отдельный образ обратного рассеяния и при матрице.</li><li>Расхождение модели и спектра считается от нижней границы диапазона прибора (вкладка «Анализ» конфигурации), уровень шума — ожидаемое пуассоново отклонение идеальной модели в той же полосе.</li><li>Поправка погрешности (×) — корень из χ²/ndf самого решателя с робастными весами (Хубер), поэтому она не равна корню из пуассоновского χ²/ndf строкой выше.</li><li>Один сеанс FSA на документ: график, отчёт и окно результата читают один расчёт. Пауза при записи — «Полноспектральный разбор при записи спектра» в «Системных», по умолчанию 30 с.</li>',

'r.l7':'<b>The table</b>: the share of each component in %, “— Th-232 chain”, “— sum peak”, with a matrix also “— escape peaks” and “— backscatter” under the nuclide. The rows of single peaks and humps under them are collapsed: the ▶ arrow before the caption shows them, and a collapsed row shows the sum of their counts and, in brackets, how many rows are hidden. From the keyboard, on the selected row: → expands a group (→ again moves to its first row), ← collapses it (from a row of the group — back to its header), Enter and Space expand and collapse. An expanded group stays expanded until the program is closed. A click on a row highlights its layer on the chart. A “— sum peak”, “— escape peaks” or “— backscatter” row highlights its whole hatch, and the row of a single peak or hump under it only its own stretch (±FWHM around the peak); the rest of that nuclide’s band then fades by half, and the other layers fade as for any selected row',

'q.v.used':'used','q.v.notUsed':'not used','q.v.applied':'applied','q.v.noMx':'not applied: no response matrix','q.v.notInSet':'not in the composition',
'q.e1h':'Difference and the noise level','q.e1':'What share of the measured counts the model does not describe: “+” — the spectrum has more than the model; “−” — the model is above the spectrum. Compare with the noise level: even a perfect model shows about that much from statistics. Here +4.5 / −5.4 % against a noise level of 2.4 % — something is undescribed (see the last row). “Clipped below zero on the chart” only means the band on the chart is cut at zero.',
'q.e2h':'Goodness of fit χ²/ndf','q.e2':'About 1 — the model agrees with the statistics. 2–3 — visible differences: a component or a nuclide is missing. Tens — something is seriously off: calibration, curve, composition.',
'q.e3h':'Uncertainty correction for the fit quality','q.e3':'The fit is worse than pure statistics, and the program honestly increases the uncertainties by this factor. 1.000 — no correction. The uncertainty in the result window already includes it.',
'q.e4h':'Response matrix','q.e4':'Green “used”: the nuclide images are built from the matrix — with Compton and escapes. Red “not used” or “stale” — compute or recompute the matrix (chapter <a href="geometry.html#matrix">8</a>).',

'q.e6h':'Cascade summing','q.e6':'Applied only with a matrix. Without it, nuclides with cascades (Co-60, Bi-214, Tl-208 and others) read low — up to 11 % in the corpus.',
'q.e7h':'Reference peaks of the scale','q.e7':'How many reference peaks FSA checked the energy scale on, and what correction it found: the scale stretch in percent and the shift in keV. Fractions of a percent and zeros are normal; percents and kilo-electronvolts are a reason to recalibrate (chapter <a href="calibration.html">6</a>).',
'q.e10h':'Peak not explained by the analysis nuclides','q.e10':'The spectrum has a peak the model lacks: at 353.0 keV the count is 11 % above the model, significance z 26.8. Nearby in the library is the Pb-214 line of the Ra-226 chain (and also Ba-133, Eu-152), but these nuclides are not in the analysis composition — hence “not in the composition”. If such a nuclide is in the sample, the peak has to get its label in the peak search (nuclide set, tolerance) — then the nuclide enters the analysis composition.',
'q.e11h':'Response matrix: not used','q.e11':'A red “not used” — and the price is in the row tooltip: cascade summing is not applied, nuclides with cascades read up to 11 % low, the model has no Compton part of the spectrum and no escape peaks. Hover over the row — the tooltip says the same. One action cures it — a matrix from the geometry (chapter <a href="geometry.html#matrix">8</a>).',

'q.f3':'<b>A red row with an energy</b> hints at a forgotten nuclide. Most often it is a radium or thorium chain member missing from the set.','q.mask':'<b>Background above the spectrum.</b> If the background over a region is significantly above the spectrum, FSA leaves that region out of the fit: it is hatched on the chart and its range is named in the report window. This usually means the background was taken without the sample (an empty vessel) or in different surroundings. If the region covers the strongest line of the composition, or the energy scale would lose anchors without it, the analysis runs as usual and the “Background exceeds the spectrum” warning stays on.','q.knife':'Only with a response matrix, when that warning’s window lies within 30–100 keV, and only for images whose strongest line is above 100 keV, is the activity taken from the lines above 100 keV: the lower part of the image is left free. The report window has its own row for this.',

'm.f3':'<b>Backscatter</b> — a hump from photons bounced back off the shield, housing or sample. Without a matrix it is a separate component; what changes with a matrix is below.','es.h':'What the matrix already carries inside an image','es.hint':'A diagram: Tl-208 with a response matrix. Tick and untick the boxes: the hatching and the table rows come and go, while the nuclide band stays where it is. The shape is simplified, the row labels are an example.','es.e':'Escape peaks and 511 keV annihilation','es.b':'Backscatter','es.col1':'Component','es.col2':'Value','es.share':'N %','es.n':'N counts','es.r1':'Tl-208 — escape peaks','es.r2':'SE 2126 keV from 2614.5','es.r3':'Tl-208 — backscatter','es.r4':'Hump 293 keV from 2614.5','es.lbF':'2614.5 peak','es.lbS':'SE','es.lbD':'DE','es.lbB':'hump','es.se':'<b>Escape peaks.</b> A photon above 1022 keV can create a pair in the crystal, and one or both 511 keV quanta may leave it: the spectrum then shows single (SE) and double (DE) escape peaks. With a response matrix they are already inside the nuclide image: the nuclide band carries them with a reverse hatch, and under the nuclide row you see “Tl-208 — escape peaks (n)” with the sum of counts; rows such as “SE 2126 keV from 2614.5 | N counts” under it are collapsed and open with the ▶ arrow. A click on a peak row highlights it on the chart. The energy is on the matrix scale: the light curve lifts SE above E − 511. All lines with a noticeable peak are shown: an area of at least 3σ of the spectrum within ±FWHM; close lines share one row, with the full list in its tooltip. They are already part of the share and activity and are not added twice. Clearing “Escape peaks and 511 keV annihilation” removes the rows and the hatch; the peak stays in the nuclide colour. It also removes the 511 keV image, so the analysis of a spectrum that has one changes. Without a matrix the escape is a free column: a separate “SE-2615” row with its own share.','es.bs':'<b>Backscatter.</b> A gamma quantum can scatter back off the shield, the housing or the sample and only then reach the crystal. It carries little energy, so the spectrum shows a broad hump: for 662 keV from about 185 to 290 keV, densest at the lower edge. The limit of 90° or more is a convention. With a response matrix the hump is already part of the nuclide image. The Backscatter box controls only how it is shown, as the row “X — backscatter” and hatching; the calculation does not change. The exception is a shield without layers (the “Measured inside a shield” box): the separate backscatter image then enters the fit, and the box changes the calculation. The label gives the centre of the hump on the matrix scale, so on the spectrum axis it may sit slightly aside. Shield X-rays are not included. A matrix computed before this row existed shows nothing.',

'hoodtxt':'<li>In both modes lines and yields come from the database, all decay radiations, X-rays included. “From labels of detected peaks” takes only the nuclides of labelled peaks, each with a free activity; “From NucBase” infers the parent from the peaks and adds its daughters. A line typed in by hand enters the analysis only if the nuclide is not in the database or has no lines there. “Chain equilibrium” works only with NucBase, “Parent nuclides” only with NucBase and equilibrium.</li><li>With a matrix the “Backscatter” and “Escape peaks and 511 keV annihilation” boxes control the display: the nuclide images and their fit stay. The second box, as without a matrix, adds or removes the separate 511 keV annihilation image. A shield that is not in the geometry (the “Measured inside a shield” box without layers) gets a separate backscatter image even with a matrix.</li><li>The difference between model and spectrum is counted from the lower edge of the detector range (the “Analysis” tab of the configuration); the noise level is the expected Poisson deviation of a perfect model in the same band.</li><li>The uncertainty correction (×) is the square root of the solver’s own χ²/ndf with robust (Huber) weights, so it does not equal the square root of the Poisson χ²/ndf above it.</li><li>One FSA session per document: the chart, the report and the result window read one calculation. The pause while recording is “Full-spectrum analysis while a spectrum is being recorded” on the “System” tab, 30 s by default.</li>',

/* ── схема: что несёт образ нуклида при матрице (`AMBER298`): только показ, форма условная ── */
(function escapeScheme() {
  const cv = $('#cvEsc'); io.observe(cv);
  const g = (E, c, s) => { const z = (E - c) / s; return Math.exp(-0.5 * z * z); };
  // условная форма образа Tl-208: пик, вылеты, комптон, горб
  const FE = E => 1.0 * g(E, 2614.5, 42), SE = E => 0.16 * g(E, 2126, 38), DE = E => 0.1 * g(E, 1591, 34), BS = E => 0.2 * (E < 235 ? g(E, 235, 22) : Math.exp(-(E - 235) / 110));
  const CO = E => (E < 2382 ? 0.13 + 0.05 * (E / 2382) : 0.18 * Math.exp(-(E - 2382) / 20)) * (1 - Math.exp(-E / 60));
  function hatch(ctx, X, Y, fn, x0, x1, base, step, dir, col) {
    ctx.save(); ctx.beginPath(); ctx.moveTo(X(x0), Y(base(x0)));
    for (let E = x0; E <= x1; E += 4) ctx.lineTo(X(E), Y(base(E) + fn(E)));
    for (let E = x1; E >= x0; E -= 4) ctx.lineTo(X(E), Y(base(E)));
    ctx.closePath(); ctx.clip(); ctx.strokeStyle = col; ctx.lineWidth = 1.2; ctx.beginPath();
    for (let x = X(x0) - 200; x < X(x1) + 200; x += step) { if (dir === 0) { ctx.moveTo(x, Y(1.3)); ctx.lineTo(x, Y(0)); } else { ctx.moveTo(x, Y(1.3)); ctx.lineTo(x + dir * 120, Y(0)); } }
    ctx.stroke(); ctx.restore();
  }
  function draw() {
    if (!GUIDE.visible.get(cv) && cv._seen) return; cv._seen = 1;
    const { ctx, w, h } = setup(cv), bx = { l: 44, r: w - 12, t: 16, b: h - 26 };
    const X = scale('lin', 0, 2800, bx.l, bx.r), Y = scale('sqrt', 0, 1.15, bx.b, bx.t), col = '#c38bff';
    axes(ctx, bx, X, Y, { xl: t('ax.e'), yl: t('ax.c'), noY: 1 });
    const tot = E => CO(E) + FE(E) + SE(E) + DE(E) + BS(E);
    ctx.fillStyle = rgba(col, 0.55); ctx.beginPath(); ctx.moveTo(X(0), Y(0));
    for (let E = 0; E <= 2800; E += 4) ctx.lineTo(X(E), Y(tot(E)));
    ctx.lineTo(X(2800), Y(0)); ctx.closePath(); ctx.fill();
    ctx.strokeStyle = col; ctx.lineWidth = 1.5; ctx.beginPath(); for (let E = 0; E <= 2800; E += 4) { const m = E ? 'lineTo' : 'moveTo'; ctx[m](X(E), Y(tot(E))); } ctx.stroke();
    const showE = $('#eE').checked, showB = $('#eB').checked, ink = '#eef3ff';
    if (showE) { hatch(ctx, X, Y, SE, 1980, 2270, CO, 7, 1, ink); hatch(ctx, X, Y, DE, 1460, 1720, CO, 7, 1, ink); }
    if (showB) hatch(ctx, X, Y, BS, 150, 800, CO, 6, 0, ink);
    ctx.fillStyle = '#cdd8f3'; ctx.font = '12px system-ui,sans-serif'; ctx.textAlign = 'center';
    ctx.fillText(t('es.lbF'), X(2500), Y(1.04));
    if (showE) { ctx.fillText(t('es.lbS'), X(2126), Y(tot(2126)) - 8); ctx.fillText(t('es.lbD'), X(1591), Y(tot(1591)) - 8); }
    if (showB) ctx.fillText(t('es.lbB'), X(280), Y(tot(240)) - 8);
    const r = (a, b, sub) => '<div class="r"' + (sub ? ' style="padding-left:24px"' : '') + '><span>' + a + '</span><i>' + b + '</i></div>';
    $('#eTab').innerHTML = '<div class="hd" style="display:grid;grid-template-columns:1fr auto">' + '<span>' + t('es.col1') + '</span><span>' + t('es.col2') + '</span></div>' + r('Tl-208', t('es.share')) +
      (showE ? r(t('es.r1'), '') + r(t('es.r2'), t('es.n'), 1) : '') + (showB ? r(t('es.r3'), '') + r(t('es.r4'), t('es.n'), 1) : '');
  }
  $('#eE').onchange = draw; $('#eB').onchange = draw; GUIDE.onRedraw(() => { cv._seen = 0; draw(); });
  const vis = new IntersectionObserver(es => es.forEach(e => { if (e.isIntersecting) { cv._seen = 0; draw(); } })); vis.observe(cv);
})();

/* ── 1. проверка готовности: какие тексты покажет программа ── */
(function ready() {
  const KEYS = ['ecal', 'fwhm', 'curve', 'geo', 'peaks', 'mx'];
  const on = { ecal: true, fwhm: true, curve: true, geo: true, peaks: true, mx: true };
  function draw() {
    $('#cChecks').innerHTML = KEYS.map(k => {
      const dis = (k === 'geo' || k === 'mx') && !on.curve || k === 'mx' && !on.geo;
      return '<label class="sw' + (dis ? ' off' : '') + '"><input type="checkbox" data-k="' + k + '"' + (on[k] && !dis ? ' checked' : '') + '><span>' + t('c.' + k) + '</span></label>';
    }).join('');
    $$('#cChecks input').forEach(c => c.onchange = () => { on[c.dataset.k] = c.checked; draw(); });
    const geo = on.curve && on.geo, mx = geo && on.mx;
    let dlg = '', status, head, qual = '';
    if (!on.fwhm) dlg = '<div class="dlg"><div class="ttl">' + t('d.fwhmT') + '</div><div class="bd">' + t('d.fwhmQ') + '</div></div>';
    else if (!on.curve) dlg = '<div class="dlg"><div class="ttl">' + t('d.effT') + '</div><div class="bd">' + t('d.effQ') + '<br><i style="color:#555">' + t('d.after') + '</i></div></div>';
    if (!on.peaks) status = ['#c0262d', t('s.err') + ': ' + t('e.peaks')];   // как в программе: пустой состав — отказ ещё до разбора
    else if (!on.ecal) status = ['#c0262d', t('s.err') + ': ' + t('e.cal')];
    else if (!geo) status = ['#c0262d', t('s.err') + ': ' + t('e.geo')];
    else { status = ['#1a8a1a', t('s.done')]; qual = t(mx ? 'q.mxOk' : 'q.mxNo'); }
    head = status[0] === '#1a8a1a' ? t(mx ? 'h.mx' : 'h.curve') : t('h.err');
    $('#cOut').innerHTML = dlg +
      '<div class="statusbar"><span style="color:#555">' + t('c.status') + '</span> <b style="color:' + status[0] + '">' + status[1] + '</b></div>' +
      (qual ? '<div class="statusbar"><span style="color:#555">' + t('c.qual') + '</span> ' + qual + '</div>' : '') +
      '<div class="statusbar"><span style="color:#555">' + t('c.head') + '</span> <b>' + head + '</b></div>';
  }
  GUIDE.onRedraw(draw);
})();

/* ── 3. «прочитайте отчёт»: макет блока «Качество разбора» ── */
(function quality() {
  // строки: [ключ подписи, значение (ключ или число), цвет, ключ объяснения]
  const WITH = [['q.r1', '+4.5 / −5.4 %', '', 1], ['q.r2', '2.66', '', 2], ['q.r3', '1.412', '', 3], ['q.r4', 'q.v.used', 'g', 4], ['q.r5', 'q.v.used', 'g', 5], ['q.r6', 'q.v.applied', 'g', 6], ['q.r7', '4', '', 7], ['q.r8', '-0.37', '', 7], ['q.r9', '+0.00', '', 7], ['q.r10', 'q.v.notInSet', 'bad', 10]];
  // (AMBER284) без матрицы отдельной строки-предупреждения нет: цена — подсказкой строки «Матрица отклика»
  const WITHOUT = [['q.r1', '+4.9 / −5.6 %', '', 1], ['q.r2', '3.15', '', 2], ['q.r3', '1.631', '', 3], ['q.r4', 'q.v.notUsed', 'bad', 11], ['q.r5', 'q.v.used', 'g', 5], ['q.r6', 'q.v.noMx', 'bad', 6]];
  let mode = 0, sel = 0;

    $$('#qMode .chip').forEach(b => b.onclick = () => { mode = +b.dataset.i; sel = 0; draw(); });
    const rows = mode ? WITHOUT : WITH;
    $('#qTab').innerHTML = '<div class="hd">' + t('q.hd') + '</div>' + rows.map((r, i) => '<div class="r' + (i === sel ? ' on' : '') + '" data-i="' + i + '"><span>' + t(r[0]) + '</span><i class="' + r[2] + '">' + (/^q\./.test(r[1]) ? t(r[1]) : r[1]) + '</i></div>').join('');
    $$('#qTab .r').forEach(d => d.onclick = () => { sel = +d.dataset.i; draw(); });
    const e = rows[sel][3];
    $('#qExp').innerHTML = '<h4>' + t('q.e' + e + 'h') + '</h4>' + t('q.e' + e);
  }
  GUIDE.onRedraw(draw);
})();

/* ── 4. игрушечный FSA: Cs-137 + Co-60 в свинцовом домике, подгонка с неотрицательными долями ── */
(function toyFsa() {
  const E0 = 20, DE = 4, N = 700, EN = Array.from({ length: N }, (_, i) => E0 + DE * (i + .5));
  const sg = E => 0.07 * 662 * Math.sqrt(E / 662) / 2.355;
  const gaussA = (E, area) => EN.map(e => area * DE * Math.exp(-0.5 * ((e - E) / sg(E)) ** 2) / (sg(E) * 2.5066));
  const compton = (E, area) => { const ec = E * (2 * E / 511) / (1 + 2 * E / 511), s = sg(ec); return EN.map(e => area * DE / ec * (0.7 + 0.3 * e / ec) / (1 + Math.exp((e - ec) / s)) * 0.95); };
  const add = (a, b, k = 1) => a.map((v, i) => v + k * b[i]);
  const line = (E, area, ctr) => add(gaussA(E, area), compton(E, area * ctr));
  const SUM = 0.08;                                              // доля потерь пика на суммирование
  const cs = line(661.66, 1, 1.6), co0 = add(line(1173.2, 1, 1.9), line(1332.5, 1, 1.9));
  const coS = add(add(line(1173.2, 1 - SUM, 1.9), line(1332.5, 1 - SUM, 1.9)), gaussA(2505.7, 0.035));
  const xr = add(gaussA(74.2, 1), gaussA(84.9, 0.32));
  const bs = EN.map(e => DE * Math.exp(-0.5 * ((e - 200) / 26) ** 2) / (26 * 2.5066));
  const bg = [EN.map(e => Math.exp(-e / 120)), EN.map(e => Math.exp(-e / 450)), EN.map(e => Math.exp(-e / 1400)), EN.map(() => 1)];
  const TRUE = { cs: 60000, co: 22000, x: 9000, b: 14000, bg: [4000, 1200, 160, 2.5] };
  let data = null;
  function makeData() {
    const m = EN.map((_, i) => TRUE.cs * cs[i] + TRUE.co * coS[i] + TRUE.x * xr[i] + TRUE.b * bs[i] + bg.reduce((s, b, k) => s + TRUE.bg[k] * b[i], 0));
    data = m.map(v => poisson(v));
  }
  function fit() {
    const useX = $('#kX').checked, useS = $('#kS').checked, useB = $('#kB').checked;
    const comps = [['cs', cs], ['co', useS ? coS : co0]];
    if (useX) comps.push(['x', xr]); if (useB) comps.push(['b', bs]);
    bg.forEach((b, k) => comps.push(['bg' + k, b]));
    const K = comps.length, lo = Math.round((40 - E0) / DE), w = data.map(y => 1 / Math.max(y, 1));
    const Gm = Array.from({ length: K }, () => new Float64Array(K)), bv = new Float64Array(K);
    for (let i = lo; i < N; i++) for (let a = 0; a < K; a++) { const fa = comps[a][1][i] * w[i]; bv[a] += fa * data[i]; for (let b = a; b < K; b++) Gm[a][b] += fa * comps[b][1][i]; }
    for (let a = 0; a < K; a++) for (let b = 0; b < a; b++) Gm[a][b] = Gm[b][a];
    const x = new Float64Array(K).fill(0);
    for (let a = 0; a < K; a++) x[a] = Math.max(0, bv[a] / Gm[a][a]) * 0.5;
    for (let it = 0; it < 3000; it++) for (let a = 0; a < K; a++) { let r = bv[a]; for (let b = 0; b < K; b++) r -= Gm[a][b] * x[b]; x[a] = Math.max(0, x[a] + r / Gm[a][a]); }
    const model = EN.map((_, i) => comps.reduce((s, c, k) => s + x[k] * c[1][i], 0));
    let tot = 0, pos = 0, neg = 0, chi = 0, flo = 0;
    for (let i = lo; i < N; i++) { const d = data[i] - model[i]; tot += data[i]; if (d > 0) pos += d; else neg -= d; chi += d * d / Math.max(model[i], 1); flo += Math.sqrt(Math.max(model[i], 1)) / 2.5066; }
    return { comps, x, model, lo, pos: 100 * pos / tot, neg: 100 * neg / tot, floor: 100 * flo / tot, chi: chi / (N - lo - K), co: 100 * x[1] / TRUE.co };
  }
  const COL = { cs: '#FFCC77', co: '#6aa8ff', x: '#c38bff', b: '#4dd0e1', bg: '#6a7899' };
  function draw() {
    if (!data) makeData();
    const R = fit(), cv = $('#cvFit'), { ctx, w, h } = setup(cv), bx = { l: 48, t: 12, r: w - 10, b: h - 24 };
    const X = scale('lin', 0, 2800, bx.l, bx.r); let mx = 0; data.forEach(v => mx = Math.max(mx, v));
    const Y = scale('log', 3, mx * 1.6, bx.b, bx.t);
    axes(ctx, bx, X, Y, { xl: t('ax.e'), yl: t('ax.c') });
    // слои модели стопкой: подложка, обр. рассеяние, рентген, Co-60, Cs-137
    const order = [];
    R.comps.forEach((c, k) => { if (/^bg/.test(c[0])) order.unshift([k, 'bg']); });
    ['b', 'x', 'co', 'cs'].forEach(id => R.comps.forEach((c, k) => { if (c[0] === id) order.push([k, id]); }));
    let base = new Float64Array(N);
    order.forEach(([k, id]) => {
      const top = base.map((v, i) => v + R.x[k] * R.comps[k][1][i]);
      ctx.beginPath(); for (let i = 0; i < N; i++) ctx.lineTo(X(EN[i]), Y(Math.max(top[i], 3))); for (let i = N - 1; i >= 0; i--) ctx.lineTo(X(EN[i]), Y(Math.max(base[i], 3)));
      ctx.closePath(); ctx.fillStyle = rgba(COL[id], id === 'bg' ? .35 : .62); ctx.fill(); base = top;
    });
    ctx.fillStyle = '#eef3ff'; for (let i = 0; i < N; i++) { if (data[i] > 0) ctx.fillRect(X(EN[i]) - 1, Y(data[i]) - 1, 2, 2); }
    // полоса невязки
    const cr = $('#cvRes'), r2 = setup(cr), c2 = r2.ctx, Xr = scale('lin', 0, 2800, bx.l, r2.w - 10), mid = r2.h / 2;
    c2.strokeStyle = 'rgba(255,255,255,.2)'; c2.beginPath(); c2.moveTo(bx.l, mid); c2.lineTo(r2.w - 10, mid); c2.stroke();
    for (let i = R.lo; i < N; i++) { const z = clamp((data[i] - R.model[i]) / Math.sqrt(Math.max(R.model[i], 1)), -6, 6); c2.fillStyle = z > 0 ? 'rgba(255,204,51,.85)' : 'rgba(255,77,109,.85)'; const bw = Math.max(1, (r2.w - 10 - bx.l) / N); c2.fillRect(Xr(EN[i]) - bw / 2, mid, bw, -z * (mid - 3) / 6); }
    c2.fillStyle = '#7f8db0'; c2.font = '11px system-ui'; c2.textAlign = 'left'; c2.textBaseline = 'top'; c2.fillText('±6σ', 4, 3);
    // легенда и числа
    const legIds = ['cs', 'co'].concat($('#kX').checked ? ['x'] : [], $('#kB').checked ? ['b'] : [], ['bg']);
    $('#gLeg').innerHTML = legIds.map(id => '<span><i style="background:' + COL[id] + '"></i>' + t('g.c.' + id) + '</span>').join('');
    const good = R.pos < 1.6 * R.floor && R.neg < 1.6 * R.floor;
    $('#gRes').innerHTML = '<span class="pill ' + (good ? 'good' : 'bad') + '">' + t('g.res', fx(R.pos, 1), fx(R.neg, 1)) + '</span><span class="pill">' + t('g.floor', fx(R.floor, 1)) + '</span><span class="pill ' + (R.chi < 1.5 ? 'good' : 'bad') + '">' + t('g.chi', fx(R.chi, 2)) + '</span><span class="pill ' + (Math.abs(R.co - 100) < 3 ? 'good' : 'bad') + '">' + t('g.co', fx(R.co, 1)) + '</span>';
  }
  ['#kX', '#kS', '#kB'].forEach(id => $(id).addEventListener('change', draw));
  $('#gNew').onclick = () => { makeData(); draw(); };
  io.observe($('#cvFit')); GUIDE.onRedraw(draw);
})();

/* ── 5. лента набора: пересчёт FSA не чаще раза в N с от начала прошлого счёта ── */
(function live() {
  const cv = $('#cvLive'), SPAN = 600, SPEED = 20;
  let sim = 0, run = false, last = 0;
  function runs() {
    const iv = +$('#lvInt').value, du = +$('#lvDur').value, out = []; let s = 0;
    while (s < SPAN) { out.push([s, s + du]); s = Math.max(s + iv, s + du); }
    return out;
  }
  function draw() {
    const iv = +$('#lvInt').value, du = +$('#lvDur').value;
    $('#lvIntV').textContent = iv + ' ' + t('lv.s'); $('#lvDurV').textContent = du + ' ' + t('lv.s');
    const { ctx, w, h } = setup(cv), bx = { l: 14, t: 18, r: w - 14, b: h - 26 }, X = scale('lin', 0, SPAN, bx.l, bx.r);
    axes(ctx, bx, X, scale('lin', 0, 1, bx.b, bx.t), { noY: true, xl: t('lv.axis') });
    const R = runs(), yb = bx.t + (bx.b - bx.t) * 0.25, hb = (bx.b - bx.t) * 0.5;
    let busy = 0, nDone = 0, cur = null;
    R.forEach(([a, b]) => {
      busy += Math.min(b, SPAN) - a;
      if (a > sim) { ctx.fillStyle = 'rgba(255,255,255,.08)'; ctx.fillRect(X(a), yb, Math.max(2, X(Math.min(b, SPAN)) - X(a)), hb); return; }
      const e = Math.min(b, sim); ctx.fillStyle = b <= sim ? 'rgba(91,227,138,.75)' : 'rgba(255,204,51,.9)';
      ctx.fillRect(X(a), yb, Math.max(2, X(e) - X(a)), hb); if (b <= sim) nDone++; else cur = [a, b];
    });
    ctx.strokeStyle = '#ff4d6d'; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(X(sim), bx.t - 6); ctx.lineTo(X(sim), bx.b); ctx.stroke(); ctx.lineWidth = 1;
    const mmss = s => { s = Math.round(s); const m = Math.floor(s / 60), r = s % 60; return m + ':' + (r < 10 ? '0' : '') + r; };
    const st = cur ? ['#b38600', t('lv.running')] : nDone ? ['#1a8a1a', t('lv.done')] : ['#777', t('lv.idle')];
    $('#lvStatus').innerHTML = '<b style="color:' + st[0] + '">' + st[1] + '</b>';
    $('#lvRes').innerHTML = '<span class="pill">' + t('lv.time', mmss(sim)) + '</span><span class="pill">' + t('lv.runs', R.length) + '</span><span class="pill ' + (busy / SPAN > 0.6 ? 'bad' : 'good') + '">' + t('lv.busy', fx(100 * busy / SPAN, 0)) + '</span>';
    $('#lvRun').textContent = run ? t('lv.pause') : t('lv.run');
  }
  function tick(now) { if (!run) return; sim = Math.min(SPAN, sim + (now - last) / 1000 * SPEED); last = now; if (sim >= SPAN) run = false; draw(); if (run) requestAnimationFrame(tick); }
  $('#lvRun').onclick = () => { if (run) { run = false; draw(); return; } if (sim >= SPAN) sim = 0; run = true; last = performance.now(); draw(); requestAnimationFrame(tick); };
  $('#lvReset').onclick = () => { run = false; sim = 0; draw(); };
  ['#lvInt', '#lvDur'].forEach(id => $(id).addEventListener('input', draw));
  io.observe(cv); GUIDE.onRedraw(draw);
})();
