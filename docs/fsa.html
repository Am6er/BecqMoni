<script>
/* Монте-Карло-сцена главы (`AMBER246`) */
GUIDE.texts({ ru: {"mc.n": "Слой", "mc.k": "Монте-Карло", "mc.h": "Как рождается слой", "mc.lead": "Слой — это то, как нуклид со всеми своими линиями выглядит именно в вашей геометрии. Его печатает тот же перенос фотонов: каждая линия ряда летит в кристалл со своим выходом, и из оставленной энергии складывается форма слоя — пики, плато, пики вылета вместе.", "mc.pick": "Нуклид:", "mc.chain": "(ряд)", "mc.lab": "слой {0} в банке на торце", "mc.t1": "линий в слое", "mc.t2": "фотонов прогнано", "mc.t3": "в пиках на испущенный фотон", "mc.f1": "<b>Слой — это целый нуклид</b>, а не отдельный пик. Поэтому FSA разбирает даже перекрытые линии: 583 и 609 кэВ из разных рядов не путаются.", "mc.f2": "<b>Слой зависит от геометрии.</b> Один и тот же нуклид в банке и в Маринелли даёт разные слои — потому матрица считается для вашей геометрии.", "mc.f3": "<b>В программе слои не считаются заново</b> на каждом разборе: они берутся из матрицы отклика, которую прибор считает один раз."},
 en: {"mc.n": "Layer", "mc.k": "Monte Carlo", "mc.h": "How a layer is born", "mc.lead": "A layer is what a nuclide with all its lines looks like in exactly your geometry. The same photon transport prints it: every line of the chain flies into the crystal with its own yield, and the energy left behind builds the shape of the layer — peaks, plateaus and escape peaks together.", "mc.pick": "Nuclide:", "mc.chain": "(chain)", "mc.lab": "{0} layer, jar on the face", "mc.t1": "lines in the layer", "mc.t2": "photons run", "mc.t3": "in the peaks per emitted photon", "mc.f1": "<b>A layer is a whole nuclide</b>, not a single peak. That is why FSA separates even overlapping lines: 583 and 609 keV from different chains do not get mixed up.", "mc.f2": "<b>The layer depends on the geometry.</b> The same nuclide in a jar and in a Marinelli beaker gives different layers — so the matrix is computed for your geometry.", "mc.f3": "<b>The app does not recompute layers</b> on every analysis: it takes them from the response matrix the detector computes once."} });
(function () {
  const { $, $$, fx, t, Q } = GUIDE;
  const NUC = [
    { id: 'Cs-137', c: '#6aa8ff', L: [[661.66, 0.851]] },
    { id: 'K-40', c: '#ff9f43', L: [[1460.82, 0.1066]] },
    { id: 'Ra-226', c: '#5be38a', L: [[186.2, 0.036], [242.0, 0.073], [295.2, 0.184], [351.9, 0.356], [609.3, 0.455], [768.4, 0.049], [1120.3, 0.149], [1238.1, 0.058], [1764.5, 0.153]] },
    { id: 'Th-232', c: '#c38bff', L: [[238.6, 0.436], [338.3, 0.113], [583.2, 0.304], [727.3, 0.067], [911.2, 0.258], [969.0, 0.158], [2614.5, 0.359]] },
  ];
  let cur = 3;
  const mc = Q.mcDuo($('#cvMC'), { scenes: [{ geo: { size: 6.3, gap: 1.0, src: 'jar' }, label: () => t('mc.lab', NUC[cur].id) }], lines: NUC[cur].L, emax: 2900, layer: () => NUC[cur].c,
    onStats: () => { const s = mc.scenes[0]; $('#mcT1').textContent = NUC[cur].L.length; $('#mcT2').textContent = s.S.n; $('#mcT3').textContent = s.S.n ? fx(100 * s.S.fep / s.S.n, 2) + ' %' : '…'; } });
  function chips() {
    $('#mcChips').innerHTML = NUC.map((n, i) => '<button class="chip' + (i === cur ? ' on' : '') + '" data-i="' + i + '">' + n.id + (n.L.length > 1 ? ' ' + t('mc.chain') : '') + '</button>').join('');
    $$('#mcChips .chip').forEach(b => b.onclick = () => { cur = +b.dataset.i; mc.setLines(NUC[cur].L); chips(); });
  }
  GUIDE.onRedraw(chips); chips();
})();
</script>

'q.e1h':'Невязка и шумовой пол','q.e1':'Какая доля измеренных отсчётов не описана моделью: «+» — в спектре больше, чем в модели; «−» — модель выше спектра. Сравнивайте с шумовым полом: даже идеальная модель даёт около него из-за статистики. Здесь 4.8 % при поле 2.4 % — кое-что не описано (см. последнюю строку). «Показ подрезан» значит только, что на графике лента обрезана у нуля.',
'q.e2h':'χ²/ndf','q.e2':'Около 1 — модель согласна со статистикой. 2–3 — есть заметные расхождения: не хватает компонента или нуклида. Десятки — что-то всерьёз не так: калибровка, кривая, состав.',

'q.e7h':'Привязка шкалы','q.e7':'По скольким опорным пикам FSA сверил шкалу энергий и какую поправку нашёл. Доли процента и нули — норма; проценты и килоэлектронвольты — повод перекалибровать (глава <a href="calibration.html">6</a>).',
'q.e10h':'Пик вне состава','q.e10':'В спектре есть пик, которого нет в модели: на 353.6 кэВ счёт на 12 % выше модели, значимость z 21.6. Рядом линия Pb-214 из ряда Ra-226, а этого нуклида нет в наборе — «нет в сете». Добавьте его в набор или включите «Из NucBase».',
'q.e11h':'Нет матрицы отклика','q.e11':'Красное предупреждение со ценой: каскадные нуклиды могут быть занижены до 11 %. Лечится одним действием — матрицей из геометрии.',

'hoodtxt':'<li>«По меткам найденных пиков» строит состав только из подписанных пиков; «Из NucBase» выводит его по пикам и собирает из всех излучений распада, включая рентген и дочерних. «Равновесие ряда» работает только с NucBase, «Родительские нуклиды» — только при NucBase и равновесии.</li><li>При матрице галки «Обратное рассеяние» и «Пики вылета» управляют лишь отдельной добавкой — вклад, заложенный в матрицу, остаётся. Галка геометрии «Измерение в защите» сохраняет образ обратного рассеяния и при матрице.</li><li>Невязка считается от нижней границы диапазона прибора (вкладка «Анализ» конфигурации), шумовой пол — ожидаемое пуассоново отклонение идеальной модели в той же полосе.</li><li>σ× — корень из χ²/ndf самого решателя с робастными весами (Хубер), поэтому он не равен корню из пуассоновского χ²/ndf строкой выше.</li><li>Один сеанс FSA на документ: график, отчёт и окно результата читают один расчёт. Пауза при записи — «Полноспектральный разбор при записи спектра» в «Системных», по умолчанию 30 с.</li>',

/* ── 1. проверка готовности: какие тексты покажет программа ── */
(function ready() {
  const KEYS = ['ecal', 'fwhm', 'curve', 'geo', 'peaks', 'mx'];
  const on = { ecal: true, fwhm: true, curve: true, geo: true, peaks: true, mx: true };
  function draw() {
    $('#cChecks').innerHTML = KEYS.map(k => {
      const dis = (k === 'geo' || k === 'mx') && !on.curve || k === 'mx' && !on.geo;
      return '<label class="sw' + (dis ? ' off' : '') + '"><input type="checkbox" data-k="' + k + '"' + (on[k] && !dis ? ' checked' : '') + '><span>' + t('c.' + k) + '</span></label>';
    }).join('');
    $$('#cChecks input').forEach(c => c.onchange = () => { on[c.dataset.k] = c.checked; draw(); });
    const geo = on.curve && on.geo, mx = geo && on.mx;
    let dlg = '', status, head, qual = '';
    if (!on.fwhm) dlg = '<div class="dlg"><div class="ttl">' + t('d.fwhmT') + '</div><div class="bd">' + t('d.fwhmQ') + '</div></div>';
    else if (!on.curve) dlg = '<div class="dlg"><div class="ttl">' + t('d.effT') + '</div><div class="bd">' + t('d.effQ') + '<br><i style="color:#555">' + t('d.after') + '</i></div></div>';
    if (!on.ecal) status = ['#c0262d', t('s.err') + ': ' + t('e.cal')];
    else if (!geo) status = ['#c0262d', t('s.err') + ': ' + t('e.geo')];
    else if (!on.peaks) status = ['#c0262d', t('s.err') + ': ' + t('e.peaks')];
    else { status = ['#1a8a1a', t('s.done')]; qual = t(mx ? 'q.mxOk' : 'q.mxNo'); }
    head = status[0] === '#1a8a1a' ? t(mx ? 'h.mx' : 'h.curve') : t('h.err');
    $('#cOut').innerHTML = dlg +
      '<div class="statusbar"><span style="color:#555">' + t('c.status') + '</span> <b style="color:' + status[0] + '">' + status[1] + '</b></div>' +
      (qual ? '<div class="statusbar"><span style="color:#555">' + t('c.qual') + '</span> ' + qual + '</div>' : '') +
      '<div class="statusbar"><span style="color:#555">' + t('c.head') + '</span> <b>' + head + '</b></div>';
  }
  GUIDE.onRedraw(draw);
})();

/* ── 4. игрушечный FSA: Cs-137 + Co-60 в свинцовом домике, подгонка с неотрицательными долями ── */
(function toyFsa() {
  const E0 = 20, DE = 4, N = 700, EN = Array.from({ length: N }, (_, i) => E0 + DE * (i + .5));
  const sg = E => 0.07 * 662 * Math.sqrt(E / 662) / 2.355;
  const gaussA = (E, area) => EN.map(e => area * DE * Math.exp(-0.5 * ((e - E) / sg(E)) ** 2) / (sg(E) * 2.5066));
  const compton = (E, area) => { const ec = E * (2 * E / 511) / (1 + 2 * E / 511), s = sg(ec); return EN.map(e => area * DE / ec * (0.7 + 0.3 * e / ec) / (1 + Math.exp((e - ec) / s)) * 0.95); };
  const add = (a, b, k = 1) => a.map((v, i) => v + k * b[i]);
  const line = (E, area, ctr) => add(gaussA(E, area), compton(E, area * ctr));
  const SUM = 0.08;                                              // доля потерь пика на суммирование
  const cs = line(661.66, 1, 1.6), co0 = add(line(1173.2, 1, 1.9), line(1332.5, 1, 1.9));
  const coS = add(add(line(1173.2, 1 - SUM, 1.9), line(1332.5, 1 - SUM, 1.9)), gaussA(2505.7, 0.035));
  const xr = add(gaussA(74.2, 1), gaussA(84.9, 0.32));
  const bs = EN.map(e => DE * Math.exp(-0.5 * ((e - 200) / 26) ** 2) / (26 * 2.5066));
  const bg = [EN.map(e => Math.exp(-e / 120)), EN.map(e => Math.exp(-e / 450)), EN.map(e => Math.exp(-e / 1400)), EN.map(() => 1)];
  const TRUE = { cs: 60000, co: 22000, x: 9000, b: 14000, bg: [4000, 1200, 160, 2.5] };
  let data = null;
  function makeData() {
    const m = EN.map((_, i) => TRUE.cs * cs[i] + TRUE.co * coS[i] + TRUE.x * xr[i] + TRUE.b * bs[i] + bg.reduce((s, b, k) => s + TRUE.bg[k] * b[i], 0));
    data = m.map(v => poisson(v));
  }
  function fit() {
    const useX = $('#kX').checked, useS = $('#kS').checked, useB = $('#kB').checked;
    const comps = [['cs', cs], ['co', useS ? coS : co0]];
    if (useX) comps.push(['x', xr]); if (useB) comps.push(['b', bs]);
    bg.forEach((b, k) => comps.push(['bg' + k, b]));
    const K = comps.length, lo = Math.round((40 - E0) / DE), w = data.map(y => 1 / Math.max(y, 1));
    const Gm = Array.from({ length: K }, () => new Float64Array(K)), bv = new Float64Array(K);
    for (let i = lo; i < N; i++) for (let a = 0; a < K; a++) { const fa = comps[a][1][i] * w[i]; bv[a] += fa * data[i]; for (let b = a; b < K; b++) Gm[a][b] += fa * comps[b][1][i]; }
    for (let a = 0; a < K; a++) for (let b = 0; b < a; b++) Gm[a][b] = Gm[b][a];
    const x = new Float64Array(K).fill(0);
    for (let a = 0; a < K; a++) x[a] = Math.max(0, bv[a] / Gm[a][a]) * 0.5;
    for (let it = 0; it < 3000; it++) for (let a = 0; a < K; a++) { let r = bv[a]; for (let b = 0; b < K; b++) r -= Gm[a][b] * x[b]; x[a] = Math.max(0, x[a] + r / Gm[a][a]); }
    const model = EN.map((_, i) => comps.reduce((s, c, k) => s + x[k] * c[1][i], 0));
    let tot = 0, pos = 0, neg = 0, chi = 0, flo = 0;
    for (let i = lo; i < N; i++) { const d = data[i] - model[i]; tot += data[i]; if (d > 0) pos += d; else neg -= d; chi += d * d / Math.max(model[i], 1); flo += Math.sqrt(Math.max(model[i], 1)) / 2.5066; }
    return { comps, x, model, lo, pos: 100 * pos / tot, neg: 100 * neg / tot, floor: 100 * flo / tot, chi: chi / (N - lo - K), co: 100 * x[1] / TRUE.co };
  }
  const COL = { cs: '#FFCC77', co: '#6aa8ff', x: '#c38bff', b: '#4dd0e1', bg: '#6a7899' };
  function draw() {
    if (!data) makeData();
    const R = fit(), cv = $('#cvFit'), { ctx, w, h } = setup(cv), bx = { l: 48, t: 12, r: w - 10, b: h - 24 };
    const X = scale('lin', 0, 2800, bx.l, bx.r); let mx = 0; data.forEach(v => mx = Math.max(mx, v));
    const Y = scale('log', 3, mx * 1.6, bx.b, bx.t);
    axes(ctx, bx, X, Y, { xl: t('ax.e'), yl: t('ax.c') });
    // слои модели стопкой: подложка, обр. рассеяние, рентген, Co-60, Cs-137
    const order = [];
    R.comps.forEach((c, k) => { if (/^bg/.test(c[0])) order.unshift([k, 'bg']); });
    ['b', 'x', 'co', 'cs'].forEach(id => R.comps.forEach((c, k) => { if (c[0] === id) order.push([k, id]); }));
    let base = new Float64Array(N);
    order.forEach(([k, id]) => {
      const top = base.map((v, i) => v + R.x[k] * R.comps[k][1][i]);
      ctx.beginPath(); for (let i = 0; i < N; i++) ctx.lineTo(X(EN[i]), Y(Math.max(top[i], 3))); for (let i = N - 1; i >= 0; i--) ctx.lineTo(X(EN[i]), Y(Math.max(base[i], 3)));
      ctx.closePath(); ctx.fillStyle = rgba(COL[id], id === 'bg' ? .35 : .62); ctx.fill(); base = top;
    });
    ctx.fillStyle = '#eef3ff'; for (let i = 0; i < N; i++) { if (data[i] > 0) ctx.fillRect(X(EN[i]) - 1, Y(data[i]) - 1, 2, 2); }
    // полоса невязки
    const cr = $('#cvRes'), r2 = setup(cr), c2 = r2.ctx, Xr = scale('lin', 0, 2800, bx.l, r2.w - 10), mid = r2.h / 2;
    c2.strokeStyle = 'rgba(255,255,255,.2)'; c2.beginPath(); c2.moveTo(bx.l, mid); c2.lineTo(r2.w - 10, mid); c2.stroke();
    for (let i = R.lo; i < N; i++) { const z = clamp((data[i] - R.model[i]) / Math.sqrt(Math.max(R.model[i], 1)), -6, 6); c2.fillStyle = z > 0 ? 'rgba(255,204,51,.85)' : 'rgba(255,77,109,.85)'; const bw = Math.max(1, (r2.w - 10 - bx.l) / N); c2.fillRect(Xr(EN[i]) - bw / 2, mid, bw, -z * (mid - 3) / 6); }
    c2.fillStyle = '#7f8db0'; c2.font = '11px system-ui'; c2.textAlign = 'left'; c2.textBaseline = 'top'; c2.fillText('±6σ', 4, 3);
    // легенда и числа
    const legIds = ['cs', 'co'].concat($('#kX').checked ? ['x'] : [], $('#kB').checked ? ['b'] : [], ['bg']);
    $('#gLeg').innerHTML = legIds.map(id => '<span><i style="background:' + COL[id] + '"></i>' + t('g.c.' + id) + '</span>').join('');
    const good = R.pos < 1.6 * R.floor && R.neg < 1.6 * R.floor;
    $('#gRes').innerHTML = '<span class="pill ' + (good ? 'good' : 'bad') + '">' + t('g.res', fx(R.pos, 1), fx(R.neg, 1)) + '</span><span class="pill">' + t('g.floor', fx(R.floor, 1)) + '</span><span class="pill ' + (R.chi < 1.5 ? 'good' : 'bad') + '">' + t('g.chi', fx(R.chi, 2)) + '</span><span class="pill ' + (Math.abs(R.co - 100) < 3 ? 'good' : 'bad') + '">' + t('g.co', fx(R.co, 1)) + '</span>';
  }
  ['#kX', '#kS', '#kB'].forEach(id => $(id).addEventListener('change', draw));
  $('#gNew').onclick = () => { makeData(); draw(); };
  io.observe($('#cvFit')); GUIDE.onRedraw(draw);
})();

/* ── 5. лента набора: пересчёт FSA не чаще раза в N с от начала прошлого счёта ── */
(function live() {
  const cv = $('#cvLive'), SPAN = 600, SPEED = 20;
  let sim = 0, run = false, last = 0;
  function runs() {
    const iv = +$('#lvInt').value, du = +$('#lvDur').value, out = []; let s = 0;
    while (s < SPAN) { out.push([s, s + du]); s = Math.max(s + iv, s + du); }
    return out;
  }
  function draw() {
    const iv = +$('#lvInt').value, du = +$('#lvDur').value;
    $('#lvIntV').textContent = iv + ' ' + t('lv.s'); $('#lvDurV').textContent = du + ' ' + t('lv.s');
    const { ctx, w, h } = setup(cv), bx = { l: 14, t: 18, r: w - 14, b: h - 26 }, X = scale('lin', 0, SPAN, bx.l, bx.r);
    axes(ctx, bx, X, scale('lin', 0, 1, bx.b, bx.t), { noY: true, xl: t('lv.axis') });
    const R = runs(), yb = bx.t + (bx.b - bx.t) * 0.25, hb = (bx.b - bx.t) * 0.5;
    let busy = 0, nDone = 0, cur = null;
    R.forEach(([a, b]) => {
      busy += Math.min(b, SPAN) - a;
      if (a > sim) { ctx.fillStyle = 'rgba(255,255,255,.08)'; ctx.fillRect(X(a), yb, Math.max(2, X(Math.min(b, SPAN)) - X(a)), hb); return; }
      const e = Math.min(b, sim); ctx.fillStyle = b <= sim ? 'rgba(91,227,138,.75)' : 'rgba(255,204,51,.9)';
      ctx.fillRect(X(a), yb, Math.max(2, X(e) - X(a)), hb); if (b <= sim) nDone++; else cur = [a, b];
    });
    ctx.strokeStyle = '#ff4d6d'; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(X(sim), bx.t - 6); ctx.lineTo(X(sim), bx.b); ctx.stroke(); ctx.lineWidth = 1;
    const mmss = s => { s = Math.round(s); const m = Math.floor(s / 60), r = s % 60; return m + ':' + (r < 10 ? '0' : '') + r; };
    const st = cur ? ['#b38600', t('lv.running')] : nDone ? ['#1a8a1a', t('lv.done')] : ['#777', t('lv.idle')];
    $('#lvStatus').innerHTML = '<b style="color:' + st[0] + '">' + st[1] + '</b>';
    $('#lvRes').innerHTML = '<span class="pill">' + t('lv.time', mmss(sim)) + '</span><span class="pill">' + t('lv.runs', R.length) + '</span><span class="pill ' + (busy / SPAN > 0.6 ? 'bad' : 'good') + '">' + t('lv.busy', fx(100 * busy / SPAN, 0)) + '</span>';
    $('#lvRun').textContent = run ? t('lv.pause') : t('lv.run');
  }
  function tick(now) { if (!run) return; sim = Math.min(SPAN, sim + (now - last) / 1000 * SPEED); last = now; if (sim >= SPAN) run = false; draw(); if (run) requestAnimationFrame(tick); }
  $('#lvRun').onclick = () => { if (run) { run = false; draw(); return; } if (sim >= SPAN) sim = 0; run = true; last = performance.now(); draw(); requestAnimationFrame(tick); };
  $('#lvReset').onclick = () => { run = false; sim = 0; draw(); };
  ['#lvInt', '#lvDur'].forEach(id => $(id).addEventListener('input', draw));
  io.observe(cv); GUIDE.onRedraw(draw);
})();

GUIDE.Q.heroAnim(document.getElementById('cvHero'), document.getElementById('heroStat'));   // заставка с квантами, как на главной (`AMBER246`)
GUIDE.init();
</script>
