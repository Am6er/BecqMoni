<title>Установка и окно программы — BecqMoni гайд</title>

<style>
/* длинные пути меню переносятся, иначе на телефоне они распирают страницу вбок */
.ui{white-space:normal}
/* снимок со своей легендой рядом (легенда внутри figure — тогда номер и строка подсвечивают друг друга) */
figure.shot.side{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,.9fr);gap:16px;align-items:start}
figure.shot.side .shot-legend{margin-top:0}
figure.shot.side.sm .shot-frame{width:100%;max-width:340px;justify-self:center}
figure.shot.side.md .shot-frame{width:100%;max-width:470px;justify-self:center}
.shot-legend.cols2{grid-template-columns:1fr 1fr}
.pane{display:none}.pane.on{display:block}
.tabbar{margin:2px 0 14px}
/* макет окна «Помощь → Проверить обновление» */
.upd{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,.85fr);gap:14px;margin-top:12px}
.desk{position:relative;border:1px solid #3a4a78;border-radius:10px;overflow:hidden;background:#273350;min-height:318px;font:13px/1.35 "Segoe UI",system-ui,sans-serif;user-select:none}
.desk .tb{background:#fff;color:#111;padding:6px 10px;font-size:12.5px;display:flex;align-items:center;gap:8px;white-space:nowrap;overflow:hidden}
.desk .tb i{width:14px;height:14px;border-radius:3px;background:linear-gradient(135deg,#ffcc33,#ff4d6d);flex:none}
.desk .mb{background:#f3f3f3;color:#111;display:flex;gap:1px;padding:2px 4px;border-bottom:1px solid #d6d6d6;flex-wrap:wrap}
.desk .mb span{padding:3px 8px;border:1px solid transparent}
.desk .mb span.act{cursor:pointer}
.desk .mb span.act:hover,.desk .mb span.on{background:#cce4f7;border-color:#99c9ef}
.desk .mb span.pulse{animation:pulse 1.6s infinite}
@keyframes pulse{50%{background:#ffe48a;border-color:#ffcc33}}
.desk svg.ws{display:block;width:100%;height:250px}
.desk .dd{position:absolute;top:56px;background:#f9f9f9;color:#111;border:1px solid #ccc;box-shadow:2px 4px 12px rgba(0,0,0,.35);min-width:200px;padding:3px 0;z-index:3}
.desk .dd div{padding:5px 24px 5px 30px;cursor:pointer;white-space:nowrap}
.desk .dd div:hover{background:#cce4f7}
.desk .dd hr{border:0;border-top:1px solid #ddd;margin:3px 2px 3px 28px}
.mbox{position:absolute;left:50%;top:54%;transform:translate(-50%,-50%);width:min(350px,92%);background:#fff;color:#111;border:1px solid #777;box-shadow:0 12px 40px rgba(0,0,0,.6);z-index:5}
.mbox.anim{animation:mb .18s ease-out}
@keyframes mb{from{transform:translate(-50%,-44%)}}
.mbox code{color:#7a3e00;word-break:break-all}
.mbox .t{padding:7px 10px;font-size:12px;border-bottom:1px solid #eee}
.mbox .m{padding:14px 12px;display:flex;gap:10px;align-items:flex-start;font-size:13px}
.mbox .ic{flex:none;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;color:#fff;font:700 15px Georgia,serif;background:#1f6fd1}
.mbox .ic.q{background:#1f6fd1;font-family:system-ui}.mbox .ic.x{background:#d33}
.mbox .b{background:#f0f0f0;padding:8px 10px;display:flex;justify-content:flex-end;gap:8px}
.mbox button{min-width:74px;padding:3px 10px;border:1px solid #adadad;background:#e1e1e1;font:inherit;color:#111;cursor:pointer}
.mbox button:first-child{border-color:#0078d7}
.mbox button:hover{background:#e5f1fb}
.mbox .bar{height:14px;border:1px solid #bcbcbc;background:#e6e6e6;margin-top:8px}
.mbox .bar i{display:block;height:100%;width:0;background:#06b025;transition:width .25s linear}
.tree{font:13px/1.55 ui-monospace,Consolas,monospace;background:#060912;border:1px solid var(--line);border-radius:10px;padding:10px 10px;color:var(--soft);overflow-x:auto;min-height:318px}
.tree .n{display:flex;align-items:center;gap:6px;white-space:nowrap;padding:1px 6px;border-radius:6px;cursor:default}
.tree .n:hover,.tree .n.on{background:rgba(255,204,51,.12)}
.tree .n .ic{width:15px;flex:none;text-align:center}
.tree .d{color:var(--gold)}.tree .f{color:#cfe0ff}
.tree .n small{margin-left:auto;padding-left:10px;font:600 11px system-ui;color:var(--ok)}
.tree .n.flash{animation:flash 1s 3}
@keyframes flash{50%{background:rgba(91,227,138,.32)}}
.tnote{min-height:42px;margin-top:8px;font-size:13.5px;color:var(--soft)}
/* игра «найдите на экране» */
.qbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:2px 0 10px}
.qbar .q{font-size:17px;font-weight:700;color:var(--ink)}
.qbar .q b{display:inline-grid;place-items:center;min-width:26px;height:26px;border-radius:50%;background:var(--gold);color:#1a1300;font-size:13px;margin-right:8px;padding:0 5px}
.qdots{display:flex;gap:5px;margin-left:auto}
.qdots i{width:12px;height:12px;border-radius:50%;background:var(--panel2);border:1px solid #34426b}
.qdots i.cur{border-color:var(--gold);box-shadow:0 0 0 2px rgba(255,204,51,.35)}
.qdots i.g{background:var(--ok);border-color:var(--ok)}.qdots i.y{background:var(--gold);border-color:var(--gold)}.qdots i.r{background:var(--photo);border-color:var(--photo)}
.qscroll{overflow-x:auto;border-radius:10px}
.qframe{position:relative;border:1px solid #3a4a78;border-radius:10px;overflow:hidden;cursor:crosshair;background:#0b1020}
.qframe img{display:block;width:100%;height:auto;pointer-events:none}
.qmark{position:absolute;border:3px solid var(--ok);border-radius:6px;background:rgba(91,227,138,.18);pointer-events:none;animation:qm .5s ease-out}
.qmark.rv{border-color:var(--gold);background:rgba(255,204,51,.18)}
.qmark.hint{border-style:dashed;border-color:var(--gold);background:transparent;animation:blink 1s 3}
@keyframes qm{from{transform:scale(1.6)}}
@keyframes blink{50%{opacity:.15}}
.qdot{position:absolute;width:20px;height:20px;margin:-10px 0 0 -10px;border-radius:50%;pointer-events:none;border:3px solid #fff;box-shadow:0 0 0 2px rgba(0,0,0,.5);animation:qm .35s ease-out}
.qdot.ok{background:var(--ok)}.qdot.no{background:var(--photo)}
@media (max-width:900px){.upd{grid-template-columns:1fr}figure.shot.side{grid-template-columns:1fr}.shot-legend.cols2{grid-template-columns:1fr}}
@media (max-width:900px){.qframe{width:880px}}
.mobonly{display:none}@media (max-width:900px){.mobonly{display:inline}}
</style>
</head>

/* ── вкладки: chips над стопкой .pane ── */
function tabset(barId, card) {
  const panes = $$('.pane', card), bar = $('#' + barId);
  bar.innerHTML = panes.map((p, i) => '<button class="chip' + (i ? '' : ' on') + '" data-i="' + i + '" data-t="' + p.dataset.tab + '"></button>').join('');
  $$('button', bar).forEach(b => b.onclick = () => { $$('button', bar).forEach(x => x.classList.toggle('on', x === b)); panes.forEach((p, i) => p.classList.toggle('on', i === +b.dataset.i)); });
}
tabset('mnTabs', $('#mnTabs').parentNode);
tabset('pTabs', $('#pTabs').parentNode);

/* ── 1. установка: проверка обновления на макете окна ── */
(function upd() {
  const OLD = '2026.10.12.01', NEW = '2026.10.19.01';
  const S = { mode: 'co', ver: OLD, menu: false, dlg: null, flash: false, later: false, sel: -1 };
  const desk = $('#uDesk'), tree = $('#uTree'), note = $('#uNote'), cbNew = $('#uNew');
  // спектр-заставка в рабочей области макета: детерминированный, без случайностей
  const WS = (() => {
    const n = 220, pts = []; let mx = 0; const v = [];
    for (let i = 0; i < n; i++) { const e = i / n * 1600; let y = 900 * Math.exp(-e / 180) + 140 * Math.exp(-e / 700) + 1400 * Math.exp(-0.5 * ((e - 662) / 22) ** 2) + 260 * Math.exp(-0.5 * ((e - 32) / 6) ** 2) + 70 * Math.exp(-0.5 * ((e - 1461) / 38) ** 2) + (e < 477 && e > 200 ? 110 : 0); v.push(y); mx = Math.max(mx, y); }
    v.forEach((y, i) => pts.push((i / (n - 1) * 400).toFixed(1) + ',' + (240 - Math.sqrt(y / mx) * 215).toFixed(1)));
    return '<svg class="ws" viewBox="0 0 400 250" preserveAspectRatio="none"><defs><linearGradient id="wsg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#5be38a" stop-opacity=".9"/><stop offset="1" stop-color="#5be38a" stop-opacity=".15"/></linearGradient></defs>' +
      [50, 100, 150, 200].map(y => '<line x1="0" x2="400" y1="' + y + '" y2="' + y + '" stroke="rgba(255,255,255,.08)"/>').join('') +
      '<polygon fill="url(#wsg)" points="0,240 ' + pts.join(' ') + ' 400,240"/></svg>';
  })();
  const TREE = {
    co: [[0, 'd', '%AppData%\\BecqMoni\\', 'tr.appdata', 'keep'], [1, 'd', 'config\\', 'tr.cfg', 'keep'], [2, 'f', 'BecquerelMonitor.xml', 'tr.main', 'keep'], [2, 'd', 'device\\', 'tr.dev', 'keep'], [2, 'd', 'layout\\', 'tr.lay', 'keep'], [2, 'f', 'NuclideDefinition.xml', 'tr.nuc', 'keep'], [2, 'f', 'Geometry… · SampleTemplates.xml', 'tr.geo', 'keep'], [1, 'f', 'becqmoni.log', 'tr.log', 'keep'],
      [0, 'd', '@tr.progname', 'tr.prog', 'prog'], [1, 'f', 'BecquerelMonitor.exe', 'tr.exe', 'prog'], [1, 'f', 'nucdb · matdb · schemedb .sqlite', 'tr.db', 'prog'], [1, 'f', 'SpecUtilsNet.dll', 'tr.spec', 'prog']],
    pt: [[0, 'd', '@tr.portname', 'tr.port', ''], [1, 'f', 'BecquerelMonitor.exe', 'tr.exe', ''], [1, 'f', 'nucdb · matdb · schemedb .sqlite', 'tr.db', ''], [1, 'f', 'SpecUtilsNet.dll', 'tr.spec', ''], [1, 'd', 'config\\', 'tr.cfg', ''], [2, 'f', 'BecquerelMonitor.xml', 'tr.main', ''], [2, 'd', 'device\\', 'tr.dev', ''], [2, 'd', 'layout\\', 'tr.lay', ''], [2, 'f', 'NuclideDefinition.xml', 'tr.nuc', ''], [2, 'f', 'Geometry… · SampleTemplates.xml', 'tr.geo', ''], [1, 'f', 'becqmoni.log', 'tr.log', '']],
  };
  const cfgPath = () => S.mode === 'co' ? '%AppData%\\BecqMoni\\config' : 'D:\\BecqMoni\\config';
  const logPath = () => S.mode === 'co' ? '%AppData%\\BecqMoni\\becqmoni.log' : 'D:\\BecqMoni\\becqmoni.log';
  $('#uMode').innerHTML = '<button class="chip on" data-m="co" data-t="u.co"></button><button class="chip" data-m="pt" data-t="u.pt"></button>';
  $$('#uMode .chip').forEach(b => b.onclick = () => { S.mode = b.dataset.m; S.dlg = null; S.menu = false; S.flash = false; S.later = false; S.sel = -1; $$('#uMode .chip').forEach(x => x.classList.toggle('on', x === b)); render(); });
  let lastDlg = null;
  function box(title, html, icon, btns) {
    const an = S.dlg !== lastDlg; lastDlg = S.dlg;
    return '<div class="mbox' + (an ? ' anim' : '') + '"><div class="t">' + title + '</div><div class="m"><span class="ic ' + (icon || '') + '">' + (icon === 'q' ? '?' : icon === 'x' ? '×' : 'i') + '</span><div>' + html + '</div></div>' +
      (btns && btns.length ? '<div class="b">' + btns.map(([k, act]) => '<button data-act="' + act + '">' + t(k) + '</button>').join('') + '</div>' : '') + '</div>';
  }
  function dialog() {
    const d = S.dlg; if (!d) { lastDlg = null; return ''; }
    if (d === 'avail') return box(t('d.updShort'), t('d.updLong', NEW), 'q', [['d.ok', 'install'], ['d.cancel', 'close']]);

  }
  function render() {
    const idle = !S.menu && !S.dlg;
    desk.innerHTML = '<div class="tb"><i></i>BecqMoni Nuclear Edition ' + S.ver + '</div>' +
      '<div class="mb"><span>' + t('m.file') + '</span><span>' + t('m.spec') + '</span><span>' + t('m.view') + '</span><span>' + t('m.tool') + '</span><span class="act' + (S.menu ? ' on' : '') + (idle ? ' pulse' : '') + '" data-act="menu" id="uHelp">' + t('m.help') + '</span></div>' + WS +
      (S.menu ? '<div class="dd" id="uDD"><div data-act="manual">' + t('m.manual') + '</div><hr><div data-act="check">' + t('m.upd') + '</div><div data-act="log">' + t('m.log') + '</div><div data-act="about">' + t('m.about') + '</div></div>' : '') + dialog();
    if (S.menu) { const h = $('#uHelp'), dd = $('#uDD'); dd.style.left = Math.min(h.offsetLeft, desk.clientWidth - dd.offsetWidth - 4) + 'px'; dd.style.top = (h.offsetTop + h.offsetHeight) + 'px'; }
    tree.innerHTML = TREE[S.mode].map((r, i) => {
      const name = r[2][0] === '@' ? t(r[2].slice(1)) : r[2];
      const tag = S.flash && r[4] === 'prog' ? '<small>✓ ' + S.ver + '</small>' : S.flash && r[4] === 'keep' && r[0] === 0 ? '<small>✓ ' + t('u.kept') + '</small>' : '';
      return '<div class="n' + (S.sel === i ? ' on' : '') + (S.flash && r[4] === 'prog' ? ' flash' : '') + '" data-i="' + i + '" style="padding-left:' + (6 + r[0] * 18) + 'px"><span class="ic ' + r[1] + '">' + (r[1] === 'd' ? '▸' : '·') + '</span><span class="' + r[1] + '">' + name + '</span>' + tag + '</div>';
    }).join('');
    $$('.n', tree).forEach(n => { n.onmouseenter = () => { S.sel = +n.dataset.i; note.textContent = t(TREE[S.mode][S.sel][3]); $$('.n', tree).forEach(x => x.classList.toggle('on', x === n)); }; n.onclick = n.onmouseenter; });
    note.textContent = S.sel >= 0 ? t(TREE[S.mode][S.sel][3]) : t('tr.hover');
    const pills = ['<span class="pill">' + t('u.ver', S.ver) + '</span>', '<span class="pill">' + t('u.where', cfgPath()) + '</span>'];
    if (S.later) pills.push('<span class="pill">' + t('u.later') + '</span>');
    if (S.mode === 'pt') pills.push('<span class="pill bad">' + t('u.ptnote') + '</span>');
    $('#uRes').innerHTML = pills.join('');
  }
  function bar(ms, then) { const t0 = performance.now(); const step = () => { const u = Math.min(1, (performance.now() - t0) / ms), b = $('#uBar'); if (b) b.style.width = (u * 100).toFixed(0) + '%'; if (u < 1) setTimeout(step, 60); else then(); }; setTimeout(step, 30); }
  desk.addEventListener('click', ev => {
    const a = ev.target.closest('[data-act]'); const act = a ? a.dataset.act : '';
    if (!act) { if (S.menu) { S.menu = false; render(); } return; }
    if (S.dlg && !a.closest('.mbox')) return;   // окно сообщения модально: пока оно открыто, меню не отвечает
    S.menu = act === 'menu' ? !S.menu : false;
    if (act === 'check') S.dlg = S.mode === 'pt' ? 'std' : (cbNew.checked && S.ver !== NEW) ? 'avail' : 'none';
    else if (act === 'manual' || act === 'log' || act === 'about') S.dlg = act;
    else if (act === 'close') S.dlg = null;
    else if (act === 'install') { S.dlg = 'loading'; render(); bar(1600, () => { S.dlg = 'done'; render(); }); return; }
    else if (act === 'later') { S.dlg = null; S.later = true; }
    else if (act === 'restart') { S.dlg = 'restarting'; S.later = false; render(); bar(900, () => { S.ver = NEW; S.dlg = null; S.flash = true; cbNew.checked = false; render(); }); return; }
    render();
  });
  cbNew.addEventListener('change', () => { S.dlg = null; if (cbNew.checked && S.ver === NEW) { S.ver = OLD; S.flash = false; } render(); });
  GUIDE.onRedraw(render);
})();

/* ── 3. игра «найдите на экране» по снимку main ── */
(function quiz() {
  const PAD = 0.008;
  const Q = [
    ['q1', 'e1', [[0.8119, 0.2488, 0.0450, 0.0232], [0.0295, 0.0319, 0.0311, 0.0194]]],
    ['q2', 'e2', [[0.8596, 0.9768, 0.1380, 0.0223]]],
    ['q3', 'e3', [[0.7621, 0.3262, 0.0932, 0.0194]]],
    ['q4', 'e4', [[0.1720, 0.0591, 0.0780, 0.0203]]],
    ['q5', 'e5', [[0.7572, 0.1326, 0.2190, 0.0250]]],
    ['q6', 'e6', [[0.1736, 0.9458, 0.1115, 0.0242]]],
    ['q7', 'e7', [[0.0815, 0.0319, 0.0509, 0.0194]]],
    ['q8', 'e8', [[0.7497, 0.5518, 0.2465, 0.0194]]],
    ['q9', 'e9', [[0.7503, 0.7920, 0.2454, 0.0150], [0.0043, 0.4960, 0.1600, 0.0150]]],
  ];
  const ZONES = [['z.ptabs', [0.7497, 0.5518, 0.2465, 0.0194]], ['z.ptabs', [0.7497, 0.9516, 0.2465, 0.0194]], ['z.status', [0, 0.9768, 1, 0.0232]], ['z.menu', [0, 0.0300, 1, 0.0232]],
    ['z.tabs', [0.1715, 0.0591, 0.5750, 0.0203]], ['z.bar', [0.1720, 0.9264, 0.5740, 0.0480]], ['z.chart', [0.1720, 0.0794, 0.5740, 0.8470]], ['z.fsa', [0, 0.0591, 0.1715, 0.9177]],
    ['z.ctrl', [0.7465, 0.0591, 0.2535, 0.4927]], ['z.peaks', [0.7465, 0.5712, 0.2535, 0.3804]], ['z.title', [0, 0, 1, 0.0300]]];
  const inside = (R, x, y, p) => x >= R[0] - p && x <= R[0] + R[2] + p && y >= R[1] - p && y <= R[1] + R[3] + p;
  const img = $('#qImg'), frame = $('#qFrame'), marks = $('#qMarks');
  let i = 0, tries = 0, answered = false, msg = '', cls = '', res = Q.map(() => '');
  img.onerror = () => { if (!img.dataset.tried) { img.dataset.tried = '1'; img.src = 'img/' + (GUIDE.lang === 'ru' ? 'en' : 'ru') + '/main.png'; } };
  function setImg() { const s = 'img/' + GUIDE.lang + '/main.png'; if (!img.src.endsWith(s)) { delete img.dataset.tried; img.src = s; } }
  const pct = v => (v * 100).toFixed(3) + '%';
  function rect(R, c) { const d = document.createElement('div'); d.className = 'qmark ' + c; d.style.left = pct(R[0]); d.style.top = pct(R[1]); d.style.width = pct(R[2]); d.style.height = pct(R[3]); marks.appendChild(d); }
  function show(R) { const sc = $('.qscroll'); if (sc.scrollWidth > sc.clientWidth + 2) sc.scrollLeft = (R[0] + R[2] / 2) * frame.offsetWidth - sc.clientWidth / 2; }
  function dot(x, y, ok) { const d = document.createElement('div'); d.className = 'qdot ' + (ok ? 'ok' : 'no'); d.style.left = pct(x); d.style.top = pct(y); marks.appendChild(d); }
  function ui() {
    const fin = i >= Q.length, first = res.filter(r => r === 'g').length;
    $('#qText').innerHTML = fin ? t('q.done', first, Q.length, t(first >= 7 ? 'q.great' : 'q.good')) : '<b>' + (i + 1) + '</b>' + t(Q[i][0]);
    $('#qDots').innerHTML = Q.map((_, k) => '<i class="' + (res[k] || (k === i ? 'cur' : '')) + '"></i>').join('');
    $('#qRes').innerHTML = (msg ? '<span class="pill ' + cls + '">' + msg + '</span>' : (fin ? '' : '<span class="pill">' + t('q.start') + '</span>')) + '<span class="pill">' + t('q.score', first, Q.length) + '</span>';
    $('#qNext').disabled = fin; $('#qHint').disabled = fin || answered;
  }
  frame.addEventListener('click', ev => {
    if (i >= Q.length || answered) return;
    const r = img.getBoundingClientRect(); if (!r.width) return;
    const x = (ev.clientX - r.left) / r.width, y = (ev.clientY - r.top) / r.height, q = Q[i];
    const hit = q[2].some(R => inside(R, x, y, PAD));
    $$('.qdot', marks).forEach(d => d.remove()); dot(x, y, hit);
    if (hit) { answered = true; res[i] = tries === 0 ? 'g' : 'y'; q[2].forEach(R => rect(R, '')); msg = t('q.ok', t(q[1])); cls = 'good'; }
    else {
      tries++; const z = ZONES.find(Z => inside(Z[1], x, y, 0));
      if (tries >= 2) { answered = true; res[i] = 'r'; q[2].forEach(R => rect(R, 'rv')); show(q[2][0]); msg = t('q.miss2', t(q[1])); cls = ''; }
      else { msg = t('q.miss', z ? t(z[0]) : t('q.nothing')); cls = 'bad'; }
    }
    ui();
  });
  $('#qHint').onclick = () => { if (answered || i >= Q.length) return; tries = Math.max(tries, 1); $$('.qmark.hint', marks).forEach(d => d.remove()); Q[i][2].forEach(R => rect(R, 'hint')); show(Q[i][2][0]); ui(); };
  $('#qNext').onclick = () => { if (i < Q.length) { if (!res[i]) res[i] = 'r'; i++; } tries = 0; answered = false; msg = ''; marks.innerHTML = ''; ui(); };
  $('#qAgain').onclick = () => { i = 0; tries = 0; answered = false; msg = ''; res = Q.map(() => ''); marks.innerHTML = ''; ui(); };
  GUIDE.onRedraw(() => { setImg(); ui(); });
})();

GUIDE.init();
</script>
