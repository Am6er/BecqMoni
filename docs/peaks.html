<style>
/* только для этой главы */
@media (max-width:560px){.ui{white-space:normal}}
.shot-legend.cols2{grid-template-columns:1fr 1fr}
@media (max-width:900px){.shot-legend.cols2{grid-template-columns:1fr}}
.gates{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-top:12px}
.gate{position:relative;background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:8px 10px;font-size:13px;color:var(--soft);min-width:0}
.gate b{display:block;color:var(--ink);font-size:13.5px}
.gate .n{font-size:22px;font-weight:800;font-variant-numeric:tabular-nums;color:var(--ok)}
.gate:not(:last-child)::after{content:"";position:absolute;right:-7px;top:50%;width:8px;height:8px;border-top:2px solid var(--gold);border-right:2px solid var(--gold);transform:translateY(-50%) rotate(45deg);z-index:2}
@media (max-width:900px){.gates{grid-template-columns:1fr 1fr}.gate::after{display:none}}
.tblw{overflow-x:auto;margin-top:10px;border-radius:10px;border:1px solid var(--line)}
table.cand{border-collapse:collapse;width:100%;font-size:13px;font-variant-numeric:tabular-nums;min-width:640px}
table.cand th,table.cand td{padding:5px 8px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
table.cand th{color:var(--muted);font-weight:700;background:var(--panel)}
table.cand td:first-child,table.cand th:first-child{text-align:left}
table.cand tr.win td{background:rgba(255,204,51,.12)}
table.cand tr.riv td{background:rgba(255,160,60,.08)}
.ok{color:var(--ok);font-weight:800}.no{color:var(--photo);font-weight:800}.na{color:var(--dim)}
.flagbox{display:inline-block;background:#fffbd0;color:#111;border:1px solid #000;padding:1px 8px 1px 12px;font:13px "Segoe UI",system-ui,sans-serif;clip-path:polygon(0 100%,7px 0,100% 0,100% 100%)}
.quiz{display:grid;grid-template-columns:1.2fr .8fr;gap:16px;margin-top:6px}
@media (max-width:900px){.quiz{grid-template-columns:1fr}}
.answers{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.answers .btn{width:100%;text-align:left}
.answers .btn.right{background:rgba(91,227,138,.2);border-color:var(--ok)}
.answers .btn.wrong{background:rgba(255,77,109,.18);border-color:var(--photo)}
.score{font-size:30px;font-weight:800;font-variant-numeric:tabular-nums}
</style>

  function marks() {
    const right = chosen === cur[0];
    $$('#qAns .btn').forEach(x => { x.disabled = true; if (x.dataset.n === cur[0]) x.classList.add('right'); else if (x.dataset.n === chosen) x.classList.add('wrong'); });
    $('#qMsg').innerHTML = '<span class="pill ' + (right ? 'good' : 'bad') + '">' + (right ? t('q.right') : t('q.wrong', cur[0])) + t(cur[2]) + '</span>' + (k === order.length - 1 ? '<span class="pill">' + t('q.done', score, order.length) + '</span>' : '');
  }
  function pick(n) {
    if (chosen) return; chosen = n; if (n === cur[0]) score++;
    marks(); $('#qScore').textContent = t('q.score', score, k + 1);
  }
  $('#qNext').onclick = () => { if (!chosen) return; if (k < order.length - 1) { k++; ask(); } else round(); };
  order = shuffle(Q.slice()).slice(0, 5); cur = order[0]; opts = shuffle([cur[0]].concat(shuffle(ALL.filter(n => n !== cur[0])).slice(0, 3)));
  io.observe($('#cvQ')); GUIDE.onRedraw(render);
})();

GUIDE.Q.heroAnim(document.getElementById('cvHero'), document.getElementById('heroStat'));   // заставка с квантами, как на главной (`AMBER246`)
GUIDE.init();
</script>
</body>
</html>
