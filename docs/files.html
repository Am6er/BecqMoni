.blk.dim{opacity:.35}
.detail{background:linear-gradient(180deg,var(--panel2),var(--panel));border:1px solid var(--line);border-radius:14px;padding:12px 14px;min-width:0}
.detail h4{margin:0 0 6px;font-size:17px}
.detail dl{margin:8px 0 0;display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:14px}
.detail dt{color:var(--muted);font-weight:700}
.detail dd{margin:0;color:var(--soft)}
pre.xml{margin:10px 0 0;background:#060912;border:1px solid var(--line);border-radius:10px;padding:9px 11px;font:12.5px/1.45 Consolas,"Cascadia Mono",monospace;color:#cfe3ff;overflow-x:auto;white-space:pre}
pre.xml .tg{color:#7fb6ff}pre.xml .vl{color:#ffe08a}pre.xml .cm{color:#6a7899}
.fmt{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:16px}
@media (max-width:900px){.fmt{grid-template-columns:1fr 1fr}}
@media (max-width:480px){.fmt{grid-template-columns:1fr}}
.fcard{background:var(--panel);border:1px solid var(--line);border-top:4px solid var(--c);border-radius:12px;padding:10px 12px}

.fcard ul{list-style:none;margin:8px 0 0;padding:0;font-size:13.5px;color:var(--soft)}
.fcard li{margin:2px 0}
.fcard li::before{display:inline-block;width:18px;font-weight:800}
.fcard li.y::before{content:"✓";color:var(--ok)}.fcard li.n::before{content:"✗";color:var(--photo)}.fcard li.w::before{content:"!";color:var(--gold)}
.csvw{display:grid;grid-template-columns:1fr 1fr;gap:12px}

.csvw .lbl{display:block;margin-top:8px}

details.faq summary::-webkit-details-marker{display:none}
details.faq summary::before{content:"+";position:absolute;left:14px;top:9px;width:22px;height:22px;border-radius:50%;background:var(--gold);color:#1a1300;font-weight:900;display:grid;place-items:center;font-size:15px}
details.faq[open] summary::before{content:"−"}
details.faq .a{padding:0 14px 12px 44px;color:var(--soft);font-size:15px}
details.faq .a p{margin:4px 0}
details.faq .a q{color:#ffd8b0;quotes:"«" "»"}
.faqs{margin-top:16px}

'q.lead':'Почти все «странности» с файлами — из-за того, что в файле лежит ссылка, а не вещь, или из-за того, чего в чужом формате просто нет. Откройте нужный вопрос.',
'faq':[
 ['Открыл чужой файл — «Старт» пишет «Не выбрана конфигурация устройства.»','<p>В файле спектра лежит только <b>ссылка</b> на прибор — имя и GUID. У вас такой конфигурации нет, и спектр открылся без прибора.</p><p><b>Что делать:</b> для разбора прибор не нужен — калибровки, FWHM, кривая и фон уже в файле. Выбор своей конфигурации в <span class="ui m">Вид → Управление измерением</span> → <span class="ui">Устройство</span> <b>сразу заменит</b> калибровку энергии, FWHM и фон спектра приборными, а при другом числе каналов спектр будет удалён (программа спросит). Так делают, только если спектр снят таким же прибором.</p>'],
 ['Импорт пишет «Несоответствие числа каналов между выбранным устройством и импортируемым спектром»','<p>В файле, скажем, 1024 канала, а у выбранного прибора 8192. Спектр открывается, но у него снимаются прибор, фон, модель FWHM и найденные пики — они были для другого числа каналов.</p><p><b>Что делать:</b> выберите конфигурацию с тем же числом каналов или пересоберите спектр: <span class="ui m">Спектр → Изменить число каналов</span>.</p>'],
 ['Вопрос «Сбросить калибровку спектра в y = x?»','<p>В файле нет калибровки энергии (или она негодная). Без ответа «Да» спектр не откроется.</p><p><b>Что делать:</b> «Да», а затем откалибровать по известным пикам (глава 6) или выбрать конфигурацию прибора с калибровкой.</p>'],
 ['Дата набора — 1970-01-01','<p>В файле нет времени начала набора: так бывает у CSV и части N42. Программа ставит 1970-01-01 нарочно, чтобы выдуманную дату не приняли за измеренную.</p><p><b>Что делать:</b> <span class="ui m">Вид → Информация об образце</span> → <span class="ui">Дата отбора</span>. К ней приводится активность при коррекции на полураспад.</p>'],
 ['Не добавляется ещё один спектр в документ','<p>В одном документе — не больше <b>16 спектров</b>. При импорте файла с множеством измерений лишние не читаются.</p><p><b>Что делать:</b> откройте остальное отдельным документом или удалите ненужные спектры в <span class="ui m">Вид → Список спектров</span>.</p>'],
 ['Фон не выбирается: «Несовместимые параметры каналов.»','<p>Фон обязан иметь столько же каналов, сколько спектр. Другая калибровка — можно (фон разложится по энергии), другое число каналов — нельзя.</p><p><b>Что делать:</b> наберите фон тем же прибором с тем же числом каналов или пересоберите его через <span class="ui m">Спектр → Изменить число каналов</span>.</p>'],
 ['Друг открыл мой файл — а пики у него другие','<p>Настройки поиска пиков (Мин SNR, Допуск, диапазон, число пиков) <b>не пишутся в файл</b> — они берутся из конфигурации прибора того, кто открыл. Набор нуклидов и библиотека тоже свои у каждого.</p><p><b>Что делать:</b> сверить <span class="ui">Мин SNR</span>, <span class="ui">Допуск</span> и <span class="ui">Набор:</span> на панели «Обнаружение пиков».</p>'],
 ['Отправил CSV — у получателя другая скорость счёта','<p>CSV хранит только отсчёты и <b>реальное</b> время. Живого времени и калибровки в нём нет, и при мёртвом времени 10 % скорость у получателя будет на 10 % ниже.</p><p><b>Что делать:</b> отдавать N42 или свой XML; CSV — только для таблиц.</p>'],
 ['Расширенный CSV «не сырой»','<p>Он пишет то, что на экране: включён <span class="ui">Показать спектр за вычетом фона</span> — в файле вычтенный спектр; включено сглаживание — сглаженный.</p><p><b>Что делать:</b> на полосе под графиком выберите <span class="ui">Показать фоновый спектр</span> и сглаживание <span class="ui">Нет</span>, потом экспортируйте.</p>'],
 ['Где лежат мои конфигурации и библиотека?','<p>В папке <code>%AppData%\\BecqMoni\\config</code>: приборы — <code>device\\*.xml</code>, матрицы — <code>device\\response\\*.rmx</code>, библиотека и наборы — <code>NuclideDefinition.xml</code>. Обновление программы их не трогает.</p><p><b>Открыть:</b> <span class="ui m">Инструменты → Открыть папку конфигурации приложения в Windows Explorer...</span></p>'],
],
'hoodtxt':'<li><b>Файл</b> — сериализованный <code>ResultDataFile</code>: список <code>ResultData</code> (до 16), в каждом карточка образца, ссылка на прибор (имя + GUID), кривая с геометрией, по настройке матрица отклика (байты <code>.rmx</code>, GZip + base64, ≈ 0.3 МБ), время начала и конца, предел времени, спектр, фон, модель FWHM.</li><li><b>Спектр</b> в файле — по строке на канал, ≈ 37 байт: 8192 канала дают ≈ 0.3 МБ; фон — столько же.</li><li><b>Матрица из файла</b> живёт только в памяти: на склад получателя (<code>device\\response</code>) она не кладётся.</li><li><b>Вычет фона</b>: k = t<sub>живое спектра</sub>/t<sub>живое фона</sub> (нет живого — берётся реальное); каждый канал n<sub>с</sub> − k·n<sub>ф</sub>, ниже нуля — 0. Тот же вычтенный спектр идёт на график, в поиск пиков, в «Расширенный CSV файл» и в «Жёсткий вычет в файл».</li><li><b>CSV</b> пишется с шапкой <code>Channel,Counts (TotalTime=3600.0s)</code>, время — до 8 знаков после точки; свой импорт CSV читает это время обратно.</li>',

'q.lead':'Almost every file “oddity” comes from the file holding a reference rather than the thing itself, or from what a foreign format simply does not have. Open the question you need.',
'faq':[
 ['I opened someone’s file — “Start” says “Device configuration is not selected.”','<p>A spectrum file holds only a <b>reference</b> to the device — a name and a GUID. You have no such configuration, so the spectrum opened without a device.</p><p><b>What to do:</b> analysis needs no device — the calibrations, FWHM, curve and background are already in the file. Choosing your configuration in <span class="ui m">View → Measurement Control</span> → <span class="ui">Device Config.</span> <b>at once replaces</b> the spectrum’s energy calibration, FWHM and background with the device’s, and with another channel count the spectrum is erased (the program asks). Do it only if the spectrum was taken with the same kind of device.</p>'],
 ['Import says “Channel mismatch between device and imported spectra file”','<p>The file has, say, 1024 channels while the selected device has 8192. The spectrum opens, but its device, background, FWHM model and detected peaks are removed — they were for another channel count.</p><p><b>What to do:</b> choose a configuration with the same channel count or re-bin the spectrum: <span class="ui m">Spectrum → Change channel number</span>.</p>'],
 ['The question “Do you want to reset spectrum to default calibration y = x?”','<p>The file has no energy calibration (or a broken one). Without “Yes” the spectrum will not open.</p><p><b>What to do:</b> “Yes”, then calibrate on known peaks (chapter 6) or choose a device configuration with a calibration.</p>'],
 ['The acquisition date is 1970-01-01','<p>The file has no start time: this happens with CSV and some N42. The program sets 1970-01-01 on purpose, so that a made-up date is not taken for a measured one.</p><p><b>What to do:</b> <span class="ui m">View → Sample Information</span> → <span class="ui">Sampling Date</span>. Half-life correction of activity refers to it.</p>'],
 ['I cannot add one more spectrum to the document','<p>A document holds at most <b>16 spectra</b>. When a file with many measurements is imported, the extra ones are not read.</p><p><b>What to do:</b> open the rest as another document or delete unneeded spectra in <span class="ui m">View → Spectrum List</span>.</p>'],
 ['The background cannot be selected: “Incompatible channel parameters.”','<p>The background must have as many channels as the spectrum. Another calibration is fine (the background is re-binned by energy), another channel count is not.</p><p><b>What to do:</b> acquire the background with the same device and channel count, or re-bin it via <span class="ui m">Spectrum → Change channel number</span>.</p>'],
 ['My friend opened my file — and found other peaks','<p>Peak search settings (Min SNR, Tolerance, range, number of peaks) are <b>not written into the file</b> — they come from the device configuration of whoever opens it. The nuclide set and the library are also everyone’s own.</p><p><b>What to do:</b> compare <span class="ui">Min SNR</span>, <span class="ui">Tolerance</span> and <span class="ui">Use set:</span> on the “Peak Detection” panel.</p>'],
 ['I sent a CSV — the recipient gets another count rate','<p>A CSV holds only counts and the <b>real</b> time. It has no live time and no calibration, and with 10 % dead time the recipient’s rate comes out 10 % lower.</p><p><b>What to do:</b> hand over N42 or your own XML; use CSV only for spreadsheets.</p>'],
 ['The Extended CSV is “not raw”','<p>It writes what is on screen: with <span class="ui">Show Spectrum with Background Subtracted</span> on, the file holds the subtracted spectrum; with smoothing on, the smoothed one.</p><p><b>What to do:</b> on the bar under the chart choose <span class="ui">Show Background Spectrum</span> and smoothing <span class="ui">None</span>, then export.</p>'],
 ['Where are my configurations and library?','<p>In <code>%AppData%\\BecqMoni\\config</code>: devices — <code>device\\*.xml</code>, matrices — <code>device\\response\\*.rmx</code>, the library and sets — <code>NuclideDefinition.xml</code>. Program updates do not touch them.</p><p><b>Open it:</b> <span class="ui m">Tool → Open config dir in Explorer...</span></p>'],
],
'hoodtxt':'<li><b>The file</b> is a serialised <code>ResultDataFile</code>: a list of <code>ResultData</code> (up to 16), each with the sample card, a device reference (name + GUID), the curve with its geometry, the response matrix if enabled (the <code>.rmx</code> bytes, GZip + base64, ≈ 0.3 MB), start and end time, preset time, the spectrum, the background, the FWHM model.</li><li><b>A spectrum</b> takes one line per channel in the file, ≈ 37 bytes: 8192 channels make ≈ 0.3 MB; the background as much again.</li><li><b>A matrix from a file</b> lives only in memory: it is not put into the recipient’s store (<code>device\\response</code>).</li><li><b>Background subtraction</b>: k = t<sub>live spectrum</sub>/t<sub>live background</sub> (real time if live is absent); every channel n<sub>s</sub> − k·n<sub>b</sub>, below zero → 0. The same subtracted spectrum goes to the chart, the peak search, the “Extended CSV File” and “Hard subtract to File”.</li><li><b>CSV</b> is written with the header <code>Channel,Counts (TotalTime=3600.0s)</code>, the time with up to 8 decimals; the program’s own CSV import reads that time back.</li>',
}});

/* ── 1. раскладка файла ── */
(function anatomy() {

/* ── общая модель: спектр Cs-137 и фон комнаты, 512 каналов по 6 кэВ ── */
const MODEL = (() => {
  const NCH = 512, A1 = 6, En = c => A1 * (c + 0.5), fw = E => 0.075 * 662 * Math.sqrt(Math.max(E, 20) / 662);
  const room = new Float64Array(NCH), src = new Float64Array(NCH);
  const lines = (arr, L) => L.forEach(([E0, a]) => { const sg = fw(E0) / 2.355, ce = E0 * (2 * E0 / 511) / (1 + 2 * E0 / 511);
    for (let c = 0; c < NCH; c++) { const E = En(c); arr[c] += a * A1 / (sg * 2.5066) * Math.exp(-0.5 * ((E - E0) / sg) ** 2) + (E0 > 150 ? 1.9 * a * A1 / ce * (0.55 + 0.45 * E / ce) / (1 + Math.exp((E - ce) / (0.7 * sg))) : 0); } });
  for (let c = 0; c < NCH; c++) { const E = En(c); room[c] = (2.4 * Math.exp(-E / 150) + .25 * Math.exp(-E / 600) + .008) / (1 + Math.exp(-(E - 22) / 2.5)); }
  lines(room, [[74.97, .6], [351.93, .5], [609.31, .5], [1120.29, .15], [1460.82, .7], [1764.49, .15], [2614.5, .15]]);
  lines(src, [[661.66, 4]]);
  return { NCH, A1, En, room, src };
})();

/* ── 2. Расширенный CSV ── */
(function ecsv() {
  const { NCH, A1, En, room, src } = MODEL, T = 3600, TB = 36000, k = T / TB;
  const SP = Float64Array.from(room, (r, c) => poisson((r + src[c]) * T)), BG = Float64Array.from(room, r => poisson(r * TB));
  const S = { mode: 'show', sm: 'none' };
  const sma = (a, i, h) => { let s = 0, n = 0; for (let j = -h; j <= h; j++) { const q = i + j; if (q < 0 || q >= a.length) continue; s += a[q]; n++; } return s / n; };
  const num = v => String(Math.round(v * 1e6) / 1e6);
  function render() {
    [['cMode', [['show', 'c.show'], ['sub', 'c.sub']], 'mode'], ['cSm', [['none', 'c.none'], ['sma', 'c.sma']], 'sm']].forEach(([id, L, key]) => {
      $('#' + id).innerHTML = L.map(([v, kk]) => '<button class="chip' + (S[key] === v ? ' on' : '') + '" data-v="' + v + '">' + t(kk) + '</button>').join('');
      $$('#' + id + ' .chip').forEach(b => b.onclick = () => { S[key] = b.dataset.v; render(); });
    });
    const base = S.mode === 'sub' ? Float64Array.from(SP, (v, c) => Math.max(0, Math.round(v - k * BG[c]))) : SP;
    const rows = [], raw = [];
    for (let c = 106; c <= 115; c++) { const v = S.sm === 'sma' ? sma(base, c, 2) : base[c]; rows.push('<span class="vl">' + c + ',' + num(En(c) - A1 / 2) + ',' + num(v) + '</span>'); raw.push('<span class="vl">' + c + ',' + SP[c] + '</span>'); }
    $('#cExt').innerHTML = '<span class="tg">Channel,Energy,Counts (TotalTime=' + fx(T, 1) + 's)</span>\n<span class="cm">…</span>\n' + rows.join('\n') + '\n<span class="cm">…</span>';
    $('#cRaw').innerHTML = '<span class="tg">Channel,Counts (TotalTime=' + fx(T, 1) + 's)</span>\n<span class="cm">…</span>\n' + raw.join('\n') + '\n<span class="cm">…</span>';
  }
  GUIDE.onRedraw(render);
})();

/* ── 3. вычет фона по живому времени ── */
(function subtract() {
  const { NCH, A1, En, room, src } = MODEL, TS = 3600, DB = 0.01;
  const cv = $('#cvB'); let SP = null, BG = null, mode = 'live', phase = 0, u = 1, anim = null;
  const S = () => ({ d: +$('#rDt').value / 100, tb: +$('#rTb').value * 3600 });
  function acquire() { const { d, tb } = S(); SP = Float64Array.from(room, (r, c) => poisson((r + src[c]) * TS * (1 - d))); BG = Float64Array.from(room, r => poisson(r * tb * (1 - DB))); }
  function kk() { const { d, tb } = S(); const Ls = TS * (1 - d), Lb = tb * (1 - DB); return { Ls, Lb, tb, kl: Ls / Lb, kr: TS / tb, k: mode === 'live' ? Ls / Lb : TS / tb }; }
  function draw() {
    const K = kk(), { ctx, w, h } = setup(cv), bx = { l: 50, t: 16, r: w - 10, b: h - 24 }, X = scale('lin', 0, 3000, bx.l, bx.r);
    // фаза 1 — фон сжимается (u: 0→1), фаза 2 — вычитается (u: 0→1)
    const kNow = phase === 0 ? 1 : phase === 1 ? lerp(1, K.k, u) : K.k, subU = phase === 2 ? u : 0;
    let mx = 0; for (let c = 3; c < NCH; c++) mx = Math.max(mx, SP[c], phase === 0 ? BG[c] : BG[c] * kNow);
    const Y = scale('sqrt', 0, mx * 1.05, bx.b, bx.t);
    axes(ctx, bx, X, Y, { xl: t('ax.e'), yl: t('ax.c') });
    const area = (arr, col, fill) => { ctx.beginPath(); ctx.moveTo(X(0), bx.b); for (let c = 0; c < NCH; c++) { ctx.lineTo(X(En(c) - A1 / 2), Y(arr(c))); ctx.lineTo(X(En(c) + A1 / 2), Y(arr(c))); } ctx.lineTo(X(3000), bx.b); ctx.closePath(); ctx.fillStyle = fill; ctx.fill(); ctx.strokeStyle = col; ctx.lineWidth = 1; ctx.stroke(); };
    let neg = 0;
    const res = c => { const v = SP[c] - kNow * BG[c] * subU; return Math.max(0, v); };
    if (phase < 2 || subU < 1) area(c => SP[c], '#00b400', 'rgba(0,180,0,.35)');
    area(c => phase === 2 ? BG[c] * kNow * (1 - subU) : BG[c] * kNow, '#29c4c4', 'rgba(0,128,128,.45)');
    if (phase === 2) { area(res, '#ffcc33', 'rgba(255,204,51,.35)');
      for (let c = 0; c < NCH; c++) if (SP[c] - K.k * BG[c] < 0 && subU > 0.95) { neg++; ctx.fillStyle = '#ff4d6d'; ctx.fillRect(X(En(c)) - 1, bx.b - 5, 2, 5); } }
    // подписи слоёв
    ctx.font = '700 12px system-ui'; ctx.textAlign = 'left'; let lx = bx.r - 170, ly = bx.t + 14;
    [['#00b400', t('b.sp'), phase < 2 || subU < 1], ['#29c4c4', t(phase === 0 ? 'b.bg0' : 'b.bg'), true], ['#ffcc33', t('b.res'), phase === 2]].forEach(([c, s, on]) => { if (!on) return; ctx.fillStyle = c; ctx.fillRect(lx, ly - 8, 10, 10); ctx.fillStyle = '#cdd8f3'; ctx.fillText(s, lx + 15, ly + 1); ly += 17; });
    // числа: K-40 и Cs-137 после полного вычета, без обнуления
    const win = (e0, e1) => { let s = 0, v = 0; for (let c = 0; c < NCH; c++) { const E = En(c); if (E >= e0 && E <= e1) { s += SP[c] - K.k * BG[c]; v += SP[c] + K.k * K.k * BG[c]; } } return { s, sd: Math.sqrt(v) }; };
    const K40 = win(1380, 1540), k40 = K40.s, cs = win(600, 720).s; let csTrue = 0; for (let c = 0; c < NCH; c++) { const E = En(c); if (E >= 600 && E <= 720) csTrue += src[c] * K.Ls; }
    $('#vDt').textContent = fx(S().d * 100, 0) + ' %'; $('#vTb').textContent = $('#rTb').value;
    $('#bRes').innerHTML = '<span class="pill">' + t('b.k', fx(K.k, 4)) + ' · ' + (mode === 'live' ? t('b.kl', fx(K.Ls, 0), fx(K.Lb, 0)) : t('b.kr', TS, K.tb)) + '</span>' +
      '<span class="pill ' + (Math.abs(k40) < 3 * K40.sd ? 'good' : 'bad') + '">' + t('b.k40', fx(k40, 0) + ' ± ' + fx(K40.sd, 0)) + '</span>' +
      '<span class="pill">' + t('b.cs', fx(cs, 0), fx(csTrue, 0)) + '</span>' + (phase === 2 && subU > 0.95 ? '<span class="pill">' + t('b.neg', neg) + '</span>' : '');
  }
  function play() {
    if (anim) return; phase = 1; u = 0; const t0 = performance.now();
    anim = () => { const q = (performance.now() - t0) / 900; if (q < 1) { u = 1 - Math.pow(1 - q, 3); phase = 1; } else if (q < 1.25) { u = 1; phase = 1; } else if (q < 2.25) { phase = 2; u = 1 - Math.pow(1 - (q - 1.25), 3); } else { phase = 2; u = 1; draw(); anim = null; return; } draw(); requestAnimationFrame(anim); };
    requestAnimationFrame(anim);
  }
  function modeChips() { $('#bMode').innerHTML = [['live', 'b.live'], ['real', 'b.real']].map(([m, kk2]) => '<button class="chip' + (m === mode ? ' on' : '') + '" data-m="' + m + '">' + t(kk2) + '</button>').join(''); $$('#bMode .chip').forEach(b => b.onclick = () => { mode = b.dataset.m; modeChips(); draw(); }); }
  $('#bPlay').onclick = () => { if (phase === 2 && u === 1) { phase = 0; u = 1; } play(); };
  $('#bReset').onclick = () => { anim = null; phase = 0; u = 1; draw(); };
  ['#rDt', '#rTb'].forEach(s => $(s).addEventListener('input', () => { acquire(); draw(); }));
  acquire(); io.observe(cv); GUIDE.onRedraw(() => { modeChips(); draw(); });
})();

GUIDE.Q.heroAnim(document.getElementById('cvHero'), document.getElementById('heroStat'));   // заставка с квантами, как на главной (`AMBER246`)
GUIDE.init();
</script>
