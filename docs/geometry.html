<style>
/* только эта глава: вкладки снимков, конвейер «где лежит кривая» */
.tabsel{display:flex;flex-wrap:wrap;gap:6px;margin-top:18px}
.pane{display:none}.pane.on{display:block}
.pipe{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-top:10px}
.pipe button{position:relative;text-align:left;background:var(--panel2);border:1px solid #34426b;color:var(--soft);border-radius:12px;padding:9px 10px 9px 38px;font:inherit;font-size:13.5px;cursor:pointer;min-height:58px;transition:border-color .15s,background .15s}
.pipe button b{position:absolute;left:9px;top:9px;width:22px;height:22px;border-radius:50%;background:#2a3658;color:var(--soft);display:grid;place-items:center;font-size:12px}
.pipe button.done b{background:var(--ok);color:#06210f}
.pipe button.on{border-color:var(--gold);background:linear-gradient(180deg,rgba(255,204,51,.14),var(--panel2))}
.pipe button.on b{background:var(--gold);color:#1a1300}
.where{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:12px}
.place{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:10px 12px;min-height:118px;transition:border-color .25s,box-shadow .25s}
.place.hit{border-color:var(--gold);box-shadow:0 0 0 3px rgba(255,204,51,.12)}
.place h4{margin:0 0 6px;font-size:14px;color:var(--ink)}
.place h4 small{display:block;color:var(--muted);font-weight:500;font-size:12px}
.tag{display:inline-block;margin:3px 4px 0 0;border-radius:999px;padding:2px 9px;font-size:12.5px;font-weight:700}
.tag.new{background:rgba(255,204,51,.18);color:#ffe08a}
.tag.ok{background:rgba(91,227,138,.16);color:#bff5d2}
.tag.wait{background:rgba(106,168,255,.16);color:#cfe1ff}
.tag.none{background:transparent;border:1px dashed #3a4a78;color:var(--dim);font-weight:500}
/* снимок и его легенда — в одной фигуре: подсветка точка ↔ пункт работает только внутри figure */
figure.shot.side{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,.85fr);gap:6px 16px;align-items:start;margin-top:22px}
figure.shot.side.nr{grid-template-columns:minmax(0,.8fr) minmax(0,1.2fr)}
figure.shot.side>.shot-frame{grid-column:1;grid-row:1}
figure.shot.side>figcaption{grid-column:1;grid-row:2}
figure.shot.side>ol.shot-legend{grid-column:2;grid-row:1 / span 2;margin-top:0}
@media (max-width:900px){.pipe{grid-template-columns:1fr 1fr}.where{grid-template-columns:1fr 1fr}
  figure.shot.side,figure.shot.side.nr{grid-template-columns:1fr}figure.shot.side>ol.shot-legend{grid-column:1;grid-row:3}}
@media (max-width:560px){.pipe,.where{grid-template-columns:1fr}}
/* дневная тема (`AMBER258`) */
[data-theme=light] .pipe button{border-color:#c2ccdf}[data-theme=light] .pipe button b{background:#dfe5f1}[data-theme=light] .pipe button.done b{color:#fff}
[data-theme=light] .tag.new{color:#8a5d00}[data-theme=light] .tag.ok{color:#11683a}[data-theme=light] .tag.wait{color:#1f4fa0}[data-theme=light] .tag.none{border-color:#b6c1d8}
</style>
</head>

GUIDE.texts({ ru: {"mc.n": "Маринелли", "mc.k": "Монте-Карло", "mc.h": "Банка или Маринелли", "mc.lead": "Один и тот же кристалл Ø63 × 63 мм, одна и та же вода с одним нуклидом. Слева банка 0.2 л на торце, справа сосуд Маринелли, обнимающий кристалл. Видно, откуда фотоны входят в кристалл и сколько их пролетает мимо.", "mc.pick": "Фотоны:", "mc.l1": "банка на торце", "mc.l2": "Маринелли", "mc.t1": "в пике: банка", "mc.t2": "в пике: Маринелли", "mc.t3": "Маринелли ловит в пик больше", "mc.f1": "<b>Маринелли окружает кристалл</b> — больше телесного угла, больше пик на испущенный фотон.", "mc.f2": "<b>Зато путь сквозь пробу длиннее.</b> Плотная проба сильнее гасит низкие энергии — попробуйте Am-241.", "mc.f3": "<b>Обе кривые BecqMoni строит из геометрии</b> тем же переносом фотонов — в конструкторе кривой ниже на этой странице."},
 en: {"mc.n": "Marinelli", "mc.k": "Monte Carlo", "mc.h": "A jar or a Marinelli beaker", "mc.lead": "The same Ø63 × 63 mm crystal, the same water with one nuclide. On the left a 0.2 l jar on the face, on the right a Marinelli beaker wrapped around the crystal. You can see where photons enter the crystal and how many fly past.", "mc.pick": "Photons:", "mc.l1": "jar on the face", "mc.l2": "Marinelli", "mc.t1": "in the peak: jar", "mc.t2": "in the peak: Marinelli", "mc.t3": "Marinelli puts more into the peak", "mc.f1": "<b>A Marinelli beaker surrounds the crystal</b> — more solid angle, a bigger peak per emitted photon.", "mc.f2": "<b>But the path through the sample is longer.</b> A dense sample absorbs low energies more — try Am-241.", "mc.f3": "<b>BecqMoni builds both curves from the geometry</b> with the same photon transport — in the curve maker further down this page."} });
(function () {
  const { $, $$, sig, fx, t, Q } = GUIDE;
  const CH = [[59.54, 'Am-241'], [661.66, 'Cs-137'], [1460.82, 'K-40'], [2614.5, 'Tl-208']];
  let E = 661.66;
  const mc = Q.mcDuo($('#cvMC'), { scenes: [{ geo: { size: 6.3, gap: 0.5, src: 'jar' }, label: () => t('mc.l1') }, { geo: { size: 6.3, gap: 0.5, src: 'mar' }, label: () => t('mc.l2') }], lines: [[E, 1]], onStats: () => {
    const s = mc.scenes; if (!s[0] || s[0].S.n < 800) return;
    const e0 = s[0].S.fep / s[0].S.n, e1 = s[1].S.fep / s[1].S.n;
    $('#mcT1').textContent = sig(100 * e0, 2) + ' %'; $('#mcT2').textContent = sig(100 * e1, 2) + ' %';
    $('#mcT3').textContent = '× ' + fx(e1 / Math.max(e0, 1e-9), 1);
  } });
  function chips() {
    $('#mcChips').innerHTML = CH.map(([e, n]) => '<button class="chip' + (Math.abs(e - E) < 1 ? ' on' : '') + '" data-e="' + e + '">' + n + ' · ' + Math.round(e) + '</button>').join('');
    $$('#mcChips .chip').forEach(b => b.onclick = () => { E = +b.dataset.e; mc.setLines([[E, 1]]); ['#mcT1', '#mcT2', '#mcT3'].forEach(s => $(s).textContent = '…'); chips(); });
  }
  GUIDE.onRedraw(chips); chips();
})();
</script>

'm.s6':'<b>Чертёж</b>: вид сбоку и вид со стороны детектора — прибор поверх пробы; галка «Со стороны пробы» показывает второй вид с другой стороны; объём пробы',
'm.s7':'<b>Сохранить кривую</b> — загорается после расчёта или правки геометрии (без расчёта в конфигурацию ляжет только геометрия)','m.cap4':'«Редактор геометрии» → «Защита»: галка снята','m.w1':'<b>Измерение в защите</b> — галка; при ней появляются слои защиты','m.w2':'<b>Пояснение</b>: без слоёв защита не входит в сцену расчёта и говорит лишь, что квант рассеивается назад; со слоями она входит в сцену и в клеймо матрицы','m.w3':'<b>Чертёж</b>: один разрез; слои защиты показаны не в масштабе, их толщины в легенде','m.views':'<b>Два вида на чертеже геометрии.</b> Рядом с разрезом стоит второй вид — взгляд вдоль оси. На вкладке «Источник» это по умолчанию вид со стороны детектора: взгляд из-за прибора на пробу. Прибор лежит поверх сосуда и пробы, а закрытые им контуры сосуда, колодца маринелли и точечного источника показаны штрихом (невидимый контур, ГОСТ 2.303-68); размер на невидимом контуре не ставится — он есть на разрезе. Галка «Со стороны пробы» у заголовка вида показывает его с другой стороны: проба и сосуд поверх прибора, под ними штрихом контуры кристалла, корпуса и колодца. В узком окне у галки короткая подпись «от пробы» или один квадрат; полная подпись — во всплывающей подсказке. Выбор запоминается в настройках программы и действует на все кривые; на кривую и матрицу он не влияет. На вкладке «Детектор» второй вид — со стороны пробы: грань кристалла, обращённая к пробе. На разрезе видны толщины и глубина, на втором виде — грань кристалла, обвязка, колодец и сосуд. Масштаб у видов общий. Поле в фокусе подсвечивает свой размер там, где он стоит. Если выбрано «Проба у широкой боковой грани», второй вид покажет, какая грань теперь смотрит на пробу (у Nano 16 это стороны Y и Z), а подпись назовёт размер, ставший глубиной (там же X). Размеры проставлены по ГОСТ 2.307-2011, все числа горизонтально: у вертикального размера число стоит рядом с линией, а в тесноте — на полке выноски. Если места совсем мало (самое маленькое окно, очень длинная сцена), часть толщин скрывается и появляется при переходе на их поле. На вкладке «Защита» один разрез: слои защиты показаны не в масштабе, их толщины в легенде.','m.gh':'Импорт GDML: геометрия из файла','m.glead':'Кнопка <span class="ui">Импорт…</span> открывает и файл .gdml. Программа спрашивает, что содержится в файле — детектор, образец, защита, — и раскладывает выбранное в поля редактора: дальше это обычная геометрия, её можно считать и сохранять. Взятое из файла только читается, и его вкладок в редакторе нет; вручную задаётся то, чего в файле нет.','m.gcap':'Подвкладка «Файл GDML»: сопоставление и сверка слева, два вида справа','m.g1':'<b>Сопоставление</b>: какая деталь — кристалл, какая — вещество пробы, с чего начинается защита. Отражатель, зазор, корпус и стенки сосуда программа находит сама — лучами от кристалла и от пробы наружу. Неверное сопоставление исправляется здесь же: выберите деталь или снимите галку и нажмите <span class="ui">Пересчитать</span> — до этого выбор только выделяет деталь на чертеже. Снятая галка возвращает вкладку для ручной настройки; поставленная забирает вкладку под файл, и программа сначала спросит «Из файла теперь берётся: … Продолжить?» — заданное на ней вручную пропадёт. <span class="ui">Как угадано</span> возвращает выбор программы. Изменённое помечено «выбрано вручную»','m.g2':'<b>Вид сбоку, в разрезе</b> — сцена разрезана вдоль оси детектора; линия A–A показывает, где снят второй вид. Стрелки дают общий размер вида; где проходит плоскость разреза, сказано во всплывающей подсказке вида','m.g3':'<b>Поперечный разрез</b> — сечение поперёк оси по линии A–A, через центр кристалла; на нём подписан только кристалл. Выноски на виде сбоку повторяют «Сопоставление»: кристалл, проба, защита и детектор (сборка вокруг кристалла) — только то, что взято в расчёт. Если проба из файла не взята, стрелка «к пробе» показывает сторону детектора, обращённую к пробе','m.g4':'<b>Легенда</b> — две группы: «В расчёте:» — роль, вещество и масса («Кристалл: …», «Защита: …») и «Не вошло в расчёт:» — эти детали на чертеже бледные, как и их значки. «≥» значит, что масса части деталей неизвестна','m.g5':'<b>Строка состояния</b>: имя файла, что из него взято и что задаётся вручную (то же — в строке над вкладками). Если кристалл не узнан, поля остаются прежними, а файл только показан — выберите кристалл в «Сопоставлении»','m.g1c':'<b>FWHM на 662 кэВ</b> и, у кристалла-параллелепипеда, <b>сторона к пробе</b> стоят в этом же блоке под строкой кристалла: в файле GDML их нет. После импорта в поле — число для вещества кристалла из файла; своё число и число из калибровки прибора (кнопка <span class="ui">Из калибровки прибора</span> — когда у прибора есть калибровка FWHM) импорт не меняет','m.g1b':'<b>Сводка</b>: что взято из файла; сверка «в файле → в полях» — слои по лучу от кристалла наружу и числа, которые легли в поля; упрощения (слои одного рода сложены; слои корпуса из разных веществ заменены одним той же массовой толщины; бок взят по ближней стороне); свёрнутая строка «Не используется в геометрии» — детали, которых в расчёте нет, разворачивается щелчком; ниже подробности файла','m.gdlg':'Окно импорта. Детектор берётся всегда; образец и защита — по галке. В каждом списке — детали файла строкой «имя — вещество, масса»; угаданное программой стоит выбранным, не угадано — выберите сами. У защиты первая строка «найдено лучами» — всё твёрдое вокруг сцены; выбор отдельной детали значит «защита начинается с неё». На маленьком чертеже выбранное в полном цвете, остальное бледное; строка под списками говорит, что будет взято','m.gdi1':'<b>Что содержится в файле</b>: детектор берётся всегда, образец и защита — по галке; в каждом списке — детали файла','m.gdi2':'<b>Маленький чертёж</b> — тот же рисунок без размеров и масс: выбранное в полном цвете, остальное бледное и стоит в легенде в группе «Не вошло в расчёт:»','m.gdi3':'<b>Строка-итог</b>: что будет взято из файла','m.gshield':'Если из файла взяты детектор и защита, а образца в нём нет, пробу задайте на вкладке <span class="ui">Источник</span>: сцена стоит на дне защиты. Проба, которая в защиту не входит, названа сразу после импорта — в сводке и в строке состояния','m.gsave':'При сохранении рядом с конфигурацией прибора ложится копия файла GDML: при следующем открытии кривой подвкладка «Файл GDML» показана снова. Файл спектра копию не несёт — у получателя поля работают, картинок импорта нет','m.gcol':'Цвета те же, что в редакторе геометрии: кристалл бирюзовый, отражатель голубой, корпус серо-синий, проба серая, стенка сосуда светло-голубая, воздух почти белый; прочие вещества — своими цветами. Строки с оранжевой полоской над чертежом говорят, чего на нём нет: тело не нарисовано, нет точного сечения, сетка не замкнута и показана только контуром, деталь в тысячи раз больше остального и в рамку не взята.',
'm.air':'<b>Проба «из воздуха».</b> Если оставить веществом пробы воздух, а высоту — сантиметры, самопоглощение не учтётся, и кривая может ошибаться в разы. Журнал расчёта предупредит словом «ВНИМАНИЕ».',
'm.field':'<b>Сцены в поле</b> — «Детектор на земле» и «Детектор в лунке» — для съёмки грунта на месте: беккерели по ним считаются, а мощность дозы нет (программа откажет и предложит сцену ISO). «Изотропное поле (ISO)» — для мощности дозы фона; беккерели по такой кривой не выводятся (в окне результата будет «Бк скрыты»).',
'm.cap3':'«Расчёт из геометрии»: параметры, график кривой и журнал',

'm.c3':'<b>Точек</b>, <b>Историй на точку</b> (больше — точнее и дольше), <b>Потоков</b> (ядер процессора)',

'm.c7':'<b>Сохранить кривую</b> в конфигурацию эффективности и <b>Экспорт CSV…</b> — выгрузить точки',
'm.tipCalc':'<b>Сколько историй?</b> Умолчание 200000 на точку даёт гладкую кривую за минуты. Для финального результата поднимите до миллиона — разброс на точку покажет журнал.',
'm.steps':'Пошагово: Маринелли для почвы',
'm.st1':'<span class="ui">Создать…</span> → вкладка <span class="ui">Детектор</span> → <span class="ui">Готовый детектор:</span> — ваш прибор.',
'm.st2':'Вкладка <span class="ui">Источник</span> → <span class="ui">Тип источника</span> — <span class="ui">Маринелли</span>; размеры стакана по линейке.',
'm.st3':'<span class="ui">Проба</span> — вещество (например, почва) и плотность: масса пробы, делённая на её объём.',

'm.st5':'Вернувшись в окно конфигурации: <span class="ui">Матрица отклика...</span> → <span class="ui">Посчитать</span> → <span class="ui">Сохранить в текущую геометрию</span> → <span class="ui">Сохранить</span>.',
'm.f1':'<b>Плотность важна.</b> Та же банка с водой и с песком даёт разные кривые внизу шкалы: плотная проба сама глотает мягкие кванты.',
'm.f2':'<b>Миллиметры — не украшение.</b> У Atom Spectra Pro 80x80 кристалл утоплен за торцом на 26.7 мм, и точка «вплотную» видит его вдвое хуже, чем без зазора.',
'm.f3':'<b>Кривая знает, чем посчитана.</b> Её клеймо хранит параметры; открыв «Изменить…», вы получите те же поля, что были в прошлый раз.',

'x.gpu':'<b>Что нужно видеокарте:</b> Nvidia RTX 30xx или новее и свежий драйвер; CUDA Toolkit ставить не нужно. Галка выключена по умолчанию. Сцена «Изотропное поле (ISO)» на видеокарте не считается — матрица пойдёт на процессоре. Если видеокарта не досчитала, снимите галку: подробности — в <span class="ui m">Помощь → Показать журнал</span>.','x.sec':'<b>Раздел электрона.</b> Кнопка <span class="ui">Посчитать</span> считает фотонную матрицу и раздел электрона: отклик на электроны и позитроны пробы, 800000 историй на строку. По нему FSA учитывает бета-излучение пробы. Полоса хода делится пополам: фотонная часть и раздел. Матрица без годного раздела нынешнего рецепта требует пересчёта: окно пишет «Нужен пересчёт: у матрицы нет годного раздела электронов нынешнего рецепта.», а у кривой в списке стоит «!». Сцене «Изотропное поле (ISO)» раздел не нужен. Если раздел построить не удалось, фотонная матрица остаётся, причина — в строке хода.',
'x.f1':'<b>Матрица — отдельный файл на геометрию</b> на этом компьютере. «Устарела» — геометрию или параметры меняли после расчёта либо после обновления программы сменилось поколение переноса или формат файла: матрицу надо пересчитать.',
'x.f2':'<b>Без матрицы FSA работает</b>, но каскадное суммирование не учтено, и в отчёте будут красные строки (глава <a href="fsa.html#quality">FSA на практике</a>).',
'x.f3':'<b>Матрица едет в файл спектра</b> (настройка «Сохранять матрицу отклика в файл спектра», включена). Получатель без своей матрицы разберёт спектр ею, ничего не пересчитывая.',

'u.tip':'<b>Кривую выбирают у каждого спектра.</b> Сменили кривую в списке — FSA, активность и мощность дозы пересчитаются по ней. Если FSA включён без кривой, вопросов не будет: отчёт FSA назовёт причину отказа, а выбранная кривая сразу пустит разбор.',
'u.f1':'<b>«— из файла спектра»</b> — кривая, приехавшая вместе со спектром. Она может отличаться от кривой прибора с тем же именем.',
'u.f2':'<b>Мощность дозы</b> справа в строке состояния тоже считается по выбранной кривой; для фона нужна сцена «Изотропное поле (ISO)».',
'u.f3':'<b>«Сохранить» — обязательно.</b> Закрыть окно конфигурации и ответить «Нет» на «Сохранить?» — потерять и кривые, и посчитанные матрицы.',
'hoodtxt':'<li>Умолчания расчёта кривой: от 5 до 3000 кэВ, штатная сетка 34 точки (поле «Точек» при ней заперто), 200000 историй на точку, потоков — число ядер минус один. Логарифмическая сетка сама добавляет узлы ниже 40 кэВ и у K-краёв веществ.</li><li>Окно матрицы по умолчанию: 5–3000 кэВ, 140 узлов, бин 2 кэВ, 3000000 историй на узел. На видеокарте счёт плоский — ровно столько историй, сколько в поле; таблица пар (κ) после узлов считается на процессоре.</li><li>«!» на красном ставится кривой, о которой вкладка говорит «пересчитайте» (другое поколение переноса, прежнее определение пика — окно ±FWHM/2, прежняя сцена сосуда), и кривой, чью матрицу окно зовёт «устарела».</li><li>Видеокарту обслуживает библиотека rmgpu_f.dll рядом с программой; без неё, со старым драйвером или картой старше RTX 30xx галка серая, а подсказка на ней честно пишет «Недоступно: …».</li><li>Чертёж и «доля, летящая в кристалл» на этой странице — геометрия без поглощения; настоящая кривая в программе считается переносом квантов через все вещества сцены.</li>',
},en:{
'n.why':'Build it yourself','n.tab':'The “Efficiency” tab','n.maker':'Curve maker','n.mx':'Response matrix','n.use':'Curve for a spectrum',
'h.k':'Chapter 8 · Geometry and matrix',
'h.h':'Telling the program <em>how the sample sits</em>',
'h.lead':'A peak in the spectrum is not yet becquerels. To turn counts into decays the program must know your crystal and where the jar stands. That description is the geometry; from it BecqMoni computes the efficiency curve and the response matrix itself. The why is in <a href="how-it-works.html#geometry">“How it works”</a>; here is where to click.',
'w.k':'Why','w.h':'Geometry is the exchange rate “counts → decays”',
'w.lead':'The same sample gives a different count if the jar is moved or put on another detector: some photons simply fly past the crystal. Try it — build a scene and see what share of photons even heads into the crystal.',
'g.h':'Build a geometry yourself',
'g.hint':'Pick a detector and a vessel, move the sizes. The drawing is a side cut, as in the program window. Below is the share of photons whose path crosses the crystal: the browser counts it itself by “firing” rays from random points of the sample (gold — hit, dark — missed).',
'g.det':'Detector:','g.src':'Vessel:',
'g.s.point':'Point','g.s.cyl':'Cylinder','g.s.mar':'Marinelli',
'g.dist':'Beaker to detector front distance','g.diam':'Beaker diameter','g.hgt':'Source height','g.mdiam':'Marinelli beaker diameter','g.mfill':'Fill height from the bottom',
'g.keep':'Keep for comparison','g.kept':'kept: <b>{0}</b> → now <b>×{1}</b>','g.kept0':'keep a scene to compare',
'g.t.frac':'heads into the crystal','g.t.fracS':'±{0} % · rays {1}','g.t.cr':'crystal volume','g.t.sm':'sample volume','g.t.pt':'point','cm3':'cm³','ml':'ml','mm':'mm',
'g.cap.det':'Detector','g.cap.cyl':'Cylinder','g.cap.pt':'Point source, distance','g.cap.mar':'Marinelli beaker','g.cap.dist':'Distance to detector',
'w.f1':'<b>Closer means more.</b> A jar right on the front face sees the crystal at a wide angle; move it 5 cm away and the share drops several times. That is why geometry is given in millimetres.',
'w.f2':'<b>A Marinelli hugs the detector.</b> The sample sits above and around it: a litre in a Marinelli gives one and a half to two times more than the same volume in a tall jar. For weak samples it is the best vessel.',
'w.f3':'<b>This is only the start.</b> Besides the angle, photons are absorbed by the sample itself, the walls and the housing. BecqMoni simulates all of that from the same geometry — see <a href="how-it-works.html#geometry">“How it works” → Geometry</a>.',
't.k':'In the program','t.h':'The “Efficiency” tab of a device configuration',
't.lead':'Curves belong to the detector: <span class="ui m">Tool → Edit Device Configurations...</span> → the <span class="ui">Efficiency</span> tab. One configuration holds any number of curves: “jar 250 ml”, “Marinelli 1 l”, “point 5 cm”. Hover a number — the spot in the window lights up.',
't.cap':'The “Efficiency” tab: the curve list, the summary and the drawing of the chosen geometry',
't.l1':'<b>New...</b> — open the curve maker with an empty geometry',
't.l2':'<b>Edit...</b> — open the chosen curve in the maker: fix the geometry and recompute',
't.l3':'<b>Duplicate</b> and <b>Delete</b>; <b>Rename...</b> is on the right of the top row, above <b>Response matrix...</b>. A duplicate is handy for “the same jar, but 100 ml”',
't.l4':'<b>Response matrix...</b> — the matrix window of this geometry (section 5)',
't.l5':'<b>Efficiency configuration</b> — the curve list of the detector; outdated ones carry a <b>“!”</b> on red',
't.l6':'<b>Summary</b>: how many points, from and to what keV, what it was computed with',
't.l7':'<b>Drawing</b> — a cut of the detector and the vessel with sizes',
't.l8':'<b>Save</b> — writes curves and matrices to disk (answering “Yes” to the question on closing the window does the same)',
't.steps':'Step by step: a new curve',
't.s1':'<span class="ui m">Tool → Edit Device Configurations...</span> → pick the detector on the left → the <span class="ui">Efficiency</span> tab.',
't.s2':'<span class="ui">New...</span> — the curve maker opens (section 4).',
't.s3':'Describe the detector and the vessel, press <span class="ui">Calculate from geometry</span>, then <span class="ui">Save curve</span>.',
't.s4':'The new curve appears in the <span class="ui">Efficiency configuration:</span> list — check the summary and the drawing.',
't.s5':'For FSA also compute the <span class="ui">Response matrix...</span> (section 5).',
't.s6':'<span class="ui">Save</span> at the bottom of the window. Close the window without it and the program asks “Save?”; answering “No” discards both the curves and the computed matrices.',
't.warn':'<b>A “!” on red before the name</b> — the curve or its matrix is out of date: the program physics, the peak definition or the vessel scene changed, or the geometry was edited after the calculation. The red line under the summary says what exactly. The cure: <span class="ui">Edit...</span> → <span class="ui">Calculate from geometry</span> → <span class="ui">Save curve</span>, and for the matrix — <span class="ui">Recompute</span>.',
't.f1':'<b>A curve without geometry</b> (from measurements or typed by hand) is fine for estimates, but FSA does not accept it: “no geometry — no FSA”.',
't.f2':'<b>One scene — one curve.</b> Another jar, another fill height, another distance is a new curve. Make them by duplicating and editing.',
't.f3':'<b>The curve also travels into the spectrum file</b> — a full copy with its geometry, so the spectrum can be analysed on another computer.',
'm.k':'Curve maker','m.h':'The curve maker: detector, source, calculation',
'm.lead':'The window opens with <span class="ui">New...</span> and <span class="ui">Edit...</span>. It is like a form: first the crystal’s passport, then the vessel, then “compute”. Switch the tabs:',
'm.tab1':'Detector','m.tab2':'Source','m.tab3':'Calculate from geometry','m.tab4':'Shield',
'm.cap1':'“Geometry editor” → “Detector”: Atom Spectra 80x80',
'm.d1':'<b>Known detector:</b> — pick your detector and all fields fill in. Next to it <b>Save</b> / <b>Clone...</b> / <b>Delete</b> for your own presets',
'm.d2':'<b>Crystal shape</b>: cylindrical or rectangular; for a bar — which face looks at the sample',
'm.d3':'<b>Crystal size</b> in millimetres',
'm.d4':'<b>Wrapping</b>: reflector, gap and cladding at the front and the side, the mounting behind the crystal',
'm.d5':'<b>FWHM at 662 keV</b> — a new geometry already has the typical value of its crystal material (NaI 7.1 %, CsI 7.07 %, LaBr3 2.94 % — from the corpus; BGO 10 %, CeBr3 4 %, SrI2 3.5 %, CZT 2.5 % — from manufacturers’ datasheets), and it follows the material until you edit it. The <b>From device calibration</b> button takes the value from the device’s FWHM calibration; if that calibration is a curve of three or more points and its value differs from the field by more than 0.1 percentage point, the program offers it by itself when the window opens',
'm.d6':'<b>Materials</b> of the crystal, reflector, gap and cladding with densities; “…” — your own mixtures',
'm.d7':'<b>Import...</b> — a .gdml file (the geometry is laid into the fields, see below), .in (geometry) or .txt/.efa/.efr (a curve)',
'm.d8':'<b>The drawing</b>: side view and view from the sample side, updated on every edit; at the top — the crystal volume',
'm.tipDet':'<b>Start with “Known detector”.</b> For RadiaCode-101/103/110, Atom Spectra Nano 3 and Nano 16, Obsidian, Atom Spectra Pro 80x80 and 40x40, Gamma-1S UDS-GC 63x63 the sizes and wrapping are already filled in; for Gamma-1S UDS-GC 63x63 and Atom Spectra Pro 40x40 the wrapping is borrowed from Nano 16 and unchecked, and 40x40 has no FWHM — enter it yourself. Save your own detector as a preset — it appears in the list marked “(own)”.',
'm.infoLsrm':'<b>A curve from another program</b> (LSRM) is fine for becquerels from a single line, but FSA needs the geometry — import it from the .in file, not just the curve.',
'm.cap2':'“Geometry editor” → “Source”: a cylinder jar ⌀40 mm, sample 14 mm',
'm.s1':'<b>Sample template:</b> — your own vessel presets: save once, fill in with one click',
'm.s2':'<b>Source type</b>: Point, Cylinder, Marinelli, Rectangular box and field scenes. Under the list — a hint on what the dose rate from this curve is for',
'm.s3':'<b>Sizes</b> of the beaker and the sample, wall thicknesses, distance to the detector front',
'm.s4':'<b>Beaker wall</b> and <b>Sample</b> — material and density. Soil, water, mushrooms — pick one or add your own',
'm.s5':'<b>Shield</b> — its own tab next to this one: the “Measured inside a shield” box with layers (material and side, bottom and top thicknesses) is part of the calculated scene; without layers it is the old flag that tells FSA there are surroundings and backscatter',
'm.s6':'<b>The drawing</b>: side view and view from the detector side — the device over the sample; the “From the sample side” check box shows the second view from the other side; the sample volume',
'm.s7':'<b>Save curve</b> — lights up after a calculation or a geometry edit (without a calculation only the geometry is stored)','m.cap4':'“Geometry editor” → “Shield”: the box is cleared','m.w1':'<b>Measured inside a shield</b> — a check box; with it the shield layers appear','m.w2':'<b>Explanation</b>: without layers the shield is not in the calculated scene and only says that a photon scatters back; with layers it is in the scene and in the matrix stamp','m.w3':'<b>The drawing</b>: the cross-section only; shield layers are not to scale, their thicknesses are in the legend','m.views':'<b>Two views on the geometry drawing.</b> Next to the cross-section there is a second view, looking along the axis. On the Source tab it is the view from the detector side by default: looking from behind the device at the sample. The device lies over the vessel and the sample, and the outlines of the vessel, the Marinelli well and a point source that it covers are dashed (hidden outlines, GOST 2.303-68); no dimension is put on a hidden outline — it is on the cross-section. The “From the sample side” check box next to the view title shows it from the other side: the sample and the vessel over the device, with the crystal, housing and well outlines under them dashed. In a narrow window the check box shows the short label “from sample” or just the box; the full label is in the tooltip. The choice is remembered in the program settings and applies to all curves; it does not affect the curve or the matrix. On the Detector tab the second view is from the sample side: the crystal face turned to the sample. The cross-section shows thicknesses and depth; the second view shows the crystal face, the wrapping, the well and the beaker. Both views share one scale. The field in focus highlights its size wherever that size is shown. With “Sample faces the wide side” selected, the second view shows which face now looks at the sample (Y and Z on a Nano 16), and a caption names the size that became the depth (X there). Dimensions follow GOST 2.307-2011, and every number is horizontal: on a vertical dimension it stands next to the line, and where room is tight, on a leader shelf. When there is very little room (the smallest window, a very long scene), some thicknesses are hidden and appear when you move to their field. The Shield tab has the cross-section only: shield layers are not to scale, their thicknesses are in the legend.','m.gh':'GDML import: geometry from a file','m.glead':'The <span class="ui">Import...</span> button also opens a .gdml file. The program asks what the file contains — detector, sample, shield — and lays the chosen parts into the editor fields: from then on it is an ordinary geometry that can be calculated and saved. What is taken from the file is read-only and has no tab in the editor; what the file lacks is set by hand.','m.gcap':'The “GDML file” tab: the mapping and the comparison on the left, two views on the right','m.g1':'<b>Mapping</b>: which part is the crystal, which is the sample material, where the shield starts. The reflector, gap, housing and vessel walls are found by the program — by rays from the crystal and the sample outwards. A wrong mapping is corrected here: choose a part or clear a check box and press <span class="ui">Recalculate</span> — until then the choice only marks the part on the drawing. A cleared check box brings the tab back for manual setup; a check box set again hands the tab over to the file, and the program first asks “Taken from the file now: … Continue?” — what was entered on it by hand is lost. <span class="ui">As guessed</span> restores the program’s choice. What was changed is marked “chosen by hand”','m.g2':'<b>Side view, cut open</b> — the scene is cut along the detector axis; line A-A marks where the second view is cut. Arrows give the overall size of the view; the tooltip of the view says where the cut plane lies','m.g3':'<b>Cross-section</b> is a cut across the axis along line A-A, through the crystal centre; only the crystal is labelled on it. Callouts on the side view repeat “Mapping”: crystal, sample, shield and detector (the assembly around the crystal) — only what is in the calculation. If the sample is not taken from the file, the “to sample” arrow shows the side of the detector that faces the sample','m.g4':'<b>The legend</b> has two groups: “In the calculation:” — role, material and mass (“Crystal: …”, “Shield: …”) and “Not in the calculation:” — those parts are drawn pale, and so are their swatches. “≥” means the mass of some parts is unknown','m.g5':'<b>The status line</b>: the file name, what is taken from it and what is set by hand (the same in the line above the tabs). If the crystal is not recognised, the fields stay as they were and the file is only shown — choose the crystal in “Mapping”','m.g1c':'<b>FWHM at 662 keV</b> and, for a box crystal, <b>the side facing the sample</b> are in the same block under the crystal line: a GDML file does not carry them. After the import the field holds the number for the crystal material of the file; your own number and the number from the device calibration (the <span class="ui">From device calibration</span> button, shown when the device has an FWHM calibration) are not changed by the import','m.g1b':'<b>Summary</b>: what is taken from the file; the comparison “in the file → in the fields” — the layers along a ray from the crystal outwards and the numbers that went into the fields; simplifications (layers of the same kind are added together; housing layers of different materials are replaced by one of the same mass thickness; the side is taken from the nearest side); the collapsed line “Not used in the geometry” — parts the calculation does not include, a click expands it; file details below','m.gdlg':'The import window. The detector is always taken; the sample and the shield by a check box. Each list holds the parts of the file as “name — material, mass”; the program’s guess is selected, and where it could not guess, choose the part yourself. The first line of the shield list, “found by rays”, is everything solid around the scene; choosing a single part means “the shield starts at this part”. On the small drawing the chosen parts are in full colour and the rest is pale; the line under the lists says what will be taken','m.gdi1':'<b>What the file contains</b>: the detector is always taken, the sample and the shield by a check box; each list holds the parts of the file','m.gdi2':'<b>The small drawing</b> is the same picture without dimensions and masses: the chosen parts in full colour, the rest pale and listed in the legend under “Not in the calculation:”','m.gdi3':'<b>The result line</b>: what will be taken from the file','m.gshield':'If the detector and the shield are taken from the file and it has no sample, set the source on the <span class="ui">Source</span> tab: the scene stands on the shield floor. A source set by hand that does not fit into the shield is named right after the import — in the summary and in the status line','m.gsave':'On saving, a copy of the GDML file is stored next to the device configuration: the “GDML file” tab is shown again when the curve is reopened. A spectrum file does not carry the copy — the recipient gets working fields without the import pictures','m.gcol':'Colours match the geometry editor: crystal teal, reflector light cyan, housing grey-blue, sample grey, vessel wall light blue, air nearly white; other materials have their own colours. Lines with an orange bar above the drawing say what is missing from it: a body not drawn, no exact section, an open mesh shown as an outline only, a part thousands of times larger than the rest left out of the frame.',
'm.air':'<b>A sample “made of air”.</b> If the sample material stays air while its height is centimetres, self-absorption is not accounted for and the curve can be off by a factor. The calculation log warns with “WARNING”.',
'm.field':'<b>Field scenes</b> — “Detector on the ground” and “Detector in a borehole” are for measuring soil in situ: becquerels are computed from them, the dose rate is not (the program refuses and points to the ISO scene). “Isotropic field (ISO)” is for the background dose rate; becquerels are not derived from it (the result window shows “Bq hidden”).',
'm.cap3':'“Calculate from geometry”: parameters, the curve plot and the log',
'm.c1':'<b>From, keV</b> / <b>to, keV</b> — the curve range',
'm.c2':'<b>Grid:</b> Standard (34 points) or Logarithmic — then the number of points can be set',
'm.c3':'<b>Points</b>, <b>Histories per point</b> (more — smoother and slower), <b>Threads</b> (CPU cores)',
'm.c4':'<b>Calculate from geometry</b> — turns into <b>Stop</b> while computing',
'm.c5':'<b>The curve plot</b>: the share of photons giving a peak, on a log scale',
'm.c6':'<b>The log</b>: which parameters were taken, spread per point, warnings',
'm.c7':'<b>Save curve</b> into the efficiency configuration and <b>Export CSV...</b> — dump the points',
'm.tipCalc':'<b>How many histories?</b> The default 200000 per point gives a smooth curve in minutes. For the final result raise it to a million — the log shows the spread per point.',
'm.steps':'Step by step: a Marinelli for soil',
'm.st1':'<span class="ui">New...</span> → the <span class="ui">Detector</span> tab → <span class="ui">Known detector:</span> — your detector.',
'm.st2':'The <span class="ui">Source</span> tab → <span class="ui">Source type</span> — <span class="ui">Marinelli</span>; beaker sizes from a ruler.',
'm.st3':'<span class="ui">Sample</span> — material (soil, for instance) and density: sample mass divided by its volume.',
'm.st4':'<span class="ui">Calculate from geometry</span> → <span class="ui">Calculate from geometry</span> → wait for the plot → <span class="ui">Save curve</span>.',
'm.st5':'Back in the configuration window: <span class="ui">Response matrix...</span> → <span class="ui">Compute</span> → <span class="ui">Save to the current geometry</span> → <span class="ui">Save</span>.',
'm.f1':'<b>Density matters.</b> The same jar with water and with sand gives different curves at the low end: a dense sample swallows soft photons itself.',
'm.f2':'<b>Millimetres are not decoration.</b> In Atom Spectra Pro 80x80 the crystal sits 26.7 mm behind the front face, and a point “right on it” sees the crystal half as well as without the gap.',
'm.f3':'<b>A curve knows how it was computed.</b> Its stamp keeps the parameters; open “Edit...” and you get the same fields as last time.',
'x.k':'Matrix','x.h':'The “Response matrix” window',
'x.lead':'The curve answers “how many photons gave a peak”. The matrix answers “what the whole trace of a photon looks like”: the peak, the Compton plateau, the escapes. From it FSA builds the whole response of each nuclide. Details — <a href="how-it-works.html#matrix">“How it works” → Matrix</a>.',
'x.cap':'The “Response matrix” window: the matrix is valid, with an electron section',
'x.l1':'<b>Explanation</b>: what the matrix is for and where it is stored',
'x.l2':'<b>State</b>: “Valid for the current geometry”, “Not computed for this geometry” or “Out of date… Recompute it”',
'x.l3':'<b>Details</b>: physics generation, nodes, bin, histories, size, when and how long it took, the electron section',
'x.l4':'<b>Use Nvidia GPU</b> — a check box; if the card does not qualify, the box is greyed out and its tooltip gives the reason',
'x.l5':'<b>Parameters</b>: from and to keV, nodes, bin, histories per node, threads',
'x.l6':'<b>Progress</b> and <b>Cancel</b>',
'x.l7':'<b>Compute</b> / <b>Recompute</b>',
'x.l8':'<b>Save to the current geometry</b> — the matrix goes into the store when the configuration is saved',
'r.h':'A race: CPU against GPU',
'r.hint':'The same matrix — 143 nodes of 3 million histories — on the developer’s machine: CPU 2203 s, GPU 19 s. The time below is sped up; nodes are shown advancing evenly.',
'r.run':'Compute','r.reset':'Reset','r.speed':'Playback speed:',
'r.cpu':'CPU','r.gpu':'Nvidia GPU','r.node':'node {0} of {1}','r.done':'done in {0}',
'r.x':'the GPU is <b>{0}</b> times faster','r.real':'“real” time passed <b>{0}</b>',
'x.gpu':'<b>What the GPU needs:</b> an Nvidia RTX 30xx or newer and a fresh driver; the CUDA Toolkit is not needed. The box is off by default. The “Isotropic field (ISO)” scene is not computed on the GPU — the matrix goes to the CPU. If the card could not finish, uncheck the box: details are in <span class="ui m">Help → Show log</span>.','x.sec':'<b>Electron section.</b> The <span class="ui">Compute</span> button computes the photon matrix and the electron section: the response to electrons and positrons from the sample, 800000 histories per row. FSA uses it to account for the sample’s beta. The progress bar is split in two: the photon part and the section. A matrix with no usable section of the current recipe needs a recompute: the window says “Recompute needed: the matrix has no usable electron section of the current recipe.”, and the curve in the list carries a “!”. The “Isotropic field (ISO)” scene needs no section. If the section could not be built, the photon matrix stays, with the reason in the progress line.',
'x.f1':'<b>The matrix is a separate file per geometry</b> on this computer. “Out of date” means the geometry or the settings changed after it was computed, or a program update changed the transport generation or the file format: recompute the matrix.',
'x.f2':'<b>FSA works without a matrix</b>, but cascade summing is not applied and the report shows red lines (chapter <a href="fsa.html#quality">FSA in practice</a>).',
'x.f3':'<b>The matrix travels into the spectrum file</b> (setting “Save response matrix into spectrum file”, on). A recipient without their own matrix analyses the spectrum with it, recomputing nothing.',
'u.k':'Spectrum','u.h':'What is on disk and which curve a spectrum takes',
'u.lead':'The curve maker, the matrix window and the configuration window are drafts. Walk the pipeline below and see where the curve and the matrix live at each step.',
'p.h':'Where the curve and the matrix live right now','p.hint':'Press the steps in order — the place the data went to lights up.',
'p.s1':'Calculate from geometry','p.s2':'Save curve','p.s3':'Matrix: Compute → Save to the current geometry','p.s4':'Save (configuration window)','p.s5':'Geometry → save the spectrum',
'p.w1':'Curve maker','p.w1s':'the window, while open','p.w2':'Configuration','p.w2s':'in the program’s memory','p.w3':'Disk','p.w3s':'device configuration and the matrix store','p.w4':'Spectrum file','p.w4s':'*.xml',
'p.curve':'curve','p.mat':'matrix','p.nothing':'empty','p.wait':'waits for “Save”',
'p.say0':'Start with step 1.',
'p.say1':'The curve is computed, but exists only in the maker window. Close the window — it is gone.',
'p.say2':'The curve is in the configuration, but in memory: the “Save” button of the configuration window has lit up.',
'p.say3':'The matrix is computed and “saved to the current geometry” — that is, it waits: “it goes into the store when the device configuration is saved”.',
'p.say4':'Now everything is on disk: the curve in the device configuration, the matrix as a file in the store.',
'p.say5':'A spectrum saved with this curve carries a copy of it with the geometry and the matrix — it can be analysed on another computer.',
'u.cap':'The “Measurement Control” panel: which curve this spectrum uses',
'u.l1':'<b>Device Config.</b> — the device configuration; <b>Edit...</b> opens its window',
'u.l2':'<b>Geometry</b> — this spectrum’s curve: “(none)”, the device curves or “… - from the spectrum file”; a red “!” means its curve or response matrix is outdated',
'u.l3':'<b>✕</b> — reset the efficiency curve of the spectrum',
'u.l4':'<b>Background</b> — the background spectrum (needed for activity from a selection)',
'u.tip':'<b>A curve is chosen per spectrum.</b> Change it in the list and FSA, activity and dose rate are recomputed with it. If FSA is on without a curve, there is no question: the FSA report names the reason for the refusal, and choosing a curve starts the analysis at once.',
'u.f1':'<b>“- from the spectrum file”</b> — the curve that came with the spectrum. It may differ from the device curve of the same name.',
'u.f2':'<b>The dose rate</b> on the right of the status bar is also computed from the chosen curve; for background you need the “Isotropic field (ISO)” scene.',
'u.f3':'<b>“Save” is a must.</b> Closing the configuration window and answering “No” to “Save?” loses both the curves and the computed matrices.',
'hoodtxt':'<li>Curve defaults: 5 to 3000 keV, the standard grid of 34 points (the “Points” field is locked with it), 200000 histories per point, threads — the core count minus one. The logarithmic grid adds nodes below 40 keV and at the K edges of the materials by itself.</li><li>Matrix window defaults: 5–3000 keV, 140 nodes, 2 keV bin, 3000000 histories per node. On the GPU the count is flat — exactly as many histories as in the field; the pair table (κ) is computed on the CPU after the nodes.</li><li>A “!” on red marks a curve the tab says to “recompute” (another transport generation, the previous peak definition — the ±FWHM/2 window, the previous vessel scene) and a curve whose matrix the window calls “out of date”.</li><li>The GPU is served by the rmgpu_f.dll library next to the program; without it, with an old driver or a card older than RTX 30xx the box is greyed out and its tooltip honestly says “Not available: …”.</li><li>The drawing and the “share heading into the crystal” on this page are geometry without absorption; the real curve in the program is computed by transporting photons through all materials of the scene.</li>',
}});

/* ── 1. «Соберите геометрию»: чертёж как в программе + доля лучей, попавших в кристалл ── */
const DET = [
  { id: 'rc103', nm: 'RadiaCode-103', box: [10, 10, 10], front: 5.5, clad: 1.5, side: 2, tail: 2 },
  { id: 'nano16', nm: 'Atom Spectra Nano 16', box: [15, 18, 60], front: 3.1, clad: 1.8, side: 3, tail: 2 },
  { id: 'g63', nm: 'Gamma-1S UDS-GC 63x63', cyl: [63, 63], front: 3.1, clad: 1.8, side: 3, tail: 2 },
  { id: 'as80', nm: 'Atom Spectra Pro 80x80', cyl: [80, 80], front: 26.7, clad: 3, side: 5, tail: 2 },
  { id: 'rc110', nm: 'RadiaCode-110', box: [14, 14, 14], front: 3.85, clad: 3, side: 6.05, tail: 1.5 },
];
const SRC = ['point', 'cyl', 'mar'];
const st = { det: 3, src: 1, dist: 0, diam: 40, hgt: 14, md: 130, mf: 120 };
let mc = { n: 0, hit: 0, rays: [] }, kept = null;
function detGeo(d) {
  const L = d.cyl ? d.cyl[1] : d.box[2], hx = d.cyl ? d.cyl[0] / 2 : d.box[0] / 2, hy = d.cyl ? d.cyl[0] / 2 : d.box[1] / 2;
  const Rh = Math.max(hx, hy) + d.side, z1 = -d.front, z0 = -d.front - L, Hl = d.front + L + d.tail;
  const vol = d.cyl ? Math.PI * hx * hx * L : d.box[0] * d.box[1] * d.box[2];
  return { L, hx, hy, Rh, z0, z1, Hl, vol: vol / 1000 };
}
function srcGeo(G) {
  if (SRC[st.src] === 'point') return { kind: 'point', z: st.dist, vol: 0 };
  if (SRC[st.src] === 'cyl') { const Ri = st.diam / 2 - 1, zb = st.dist + 1, zt = zb + st.hgt; return { kind: 'cyl', Ri, zb, zt, Ro: st.diam / 2, vol: Math.PI * Ri * Ri * st.hgt / 1000 }; }
  const Rw = G.Rh + 0.5, Wd = Math.min(G.Hl - 2, 80), Ri = st.md / 2 - 1, zb = -Wd, zt = Math.max(zb + st.mf, 6), Rx = Rw + 1;
  const vol = Math.PI * Ri * Ri * (zt - zb) - Math.PI * Rx * Rx * (Math.min(zt, 1) - zb);
  return { kind: 'mar', Ri, zb, zt, Rw, Rx, Wd, Ro: st.md / 2, vol: vol / 1000 };
}
function samplePoint(S) {
  if (S.kind === 'point') return [0, 0, S.z];
  for (;;) {
    const r = S.Ri * Math.sqrt(Math.random()), f = 2 * Math.PI * Math.random(), z = S.zb + (S.zt - S.zb) * Math.random();
    if (S.kind === 'mar' && r < S.Rx && z < 1) continue;
    return [r * Math.cos(f), r * Math.sin(f), z];
  }
}
function hitT(P, u, D, G) {   // расстояние до входа луча в кристалл или -1
  let lo = 0, hi = Infinity;
  const slab = (p, v, a, b) => { if (Math.abs(v) < 1e-12) return p >= a && p <= b; let t1 = (a - p) / v, t2 = (b - p) / v; if (t1 > t2) [t1, t2] = [t2, t1]; lo = Math.max(lo, t1); hi = Math.min(hi, t2); return lo <= hi; };
  if (!slab(P[2], u[2], G.z0, G.z1)) return -1;
  if (D.cyl) {
    const a = u[0] * u[0] + u[1] * u[1], b = 2 * (P[0] * u[0] + P[1] * u[1]), c = P[0] * P[0] + P[1] * P[1] - G.hx * G.hx;
    if (a < 1e-12) { if (c > 0) return -1; } else { const q = b * b - 4 * a * c; if (q < 0) return -1; const s = Math.sqrt(q); lo = Math.max(lo, (-b - s) / (2 * a)); hi = Math.min(hi, (-b + s) / (2 * a)); }
  } else {
    if (!slab(P[0], u[0], -G.hx, G.hx) || !slab(P[1], u[1], -G.hy, G.hy)) return -1;
  }
  return lo <= hi && hi > 0 ? Math.max(lo, 0) : -1;
}
function restart() {
  mc = { n: 0, hit: 0, rays: [] };
  const D = DET[st.det], G = detGeo(D), S = srcGeo(G), target = 300000;
  Jobs.add('geo', (function* () {
    while (mc.n < target) {
      for (let i = 0; i < 2500; i++) {
        const P = samplePoint(S), uz = 2 * Math.random() - 1, f = 2 * Math.PI * Math.random(), s = Math.sqrt(1 - uz * uz), u = [s * Math.cos(f), s * Math.sin(f), uz];
        const th = hitT(P, u, D, G); mc.n++; if (th >= 0) mc.hit++;
        if (i < 6) { mc.rays.push({ P, u, th }); if (mc.rays.length > 90) mc.rays.shift(); }
      }
      drawGeo(); yield;
    }
  })());
  drawGeo();
}
function fmtV(v, k) { return v >= 100 ? fx(v, 0) : v >= 10 ? fx(v, 1) : fx(v, 2); }
function drawGeo() {
  const cv = $('#cvGeo'), { ctx, w, h } = setup(cv), D = DET[st.det], G = detGeo(D), S = srcGeo(G), mm = t('mm');
  if (window.BQTHEME) BQTHEME.raw(cv);   // чертёж — как в окне программы: цвета не зависят от темы гида (`AMBER258`)
  ctx.fillStyle = '#d6d2c4'; ctx.fillRect(0, 0, w, h);
  const top = S.kind === 'point' ? S.z + 10 : S.zt + 8, bot = -G.Hl - 6;
  const xr = Math.max(G.Rh, S.Ro || 0, 14) + 8;
  const sc = Math.min((w - 24) / (2 * xr), (h - 24) / (top - bot)), cx = w / 2 + (w > 560 ? 60 : 0), X = x => cx + x * sc, Z = z => 12 + (top - z) * sc;
  const rect = (x0, z0, x1, z1, fill, line) => { ctx.fillStyle = fill; ctx.fillRect(X(x0), Z(z1), (x1 - x0) * sc, (z1 - z0) * sc); if (line) { ctx.strokeStyle = line; ctx.lineWidth = 1; ctx.strokeRect(X(x0) + .5, Z(z1) + .5, (x1 - x0) * sc - 1, (z1 - z0) * sc - 1); } };
  // сосуд
  if (S.kind === 'cyl') { rect(-S.Ro, S.zb - 1, S.Ro, S.zt + 1, '#b9bec8', '#5d6372'); rect(-S.Ri, S.zb, S.Ri, S.zt, '#7b818c', '#9fe7ec'); }
  if (S.kind === 'mar') {
    rect(-S.Ro, S.zb - 1, S.Ro, S.zt + 1, '#b9bec8', '#5d6372'); rect(-S.Ri, S.zb, S.Ri, S.zt, '#7b818c', '#9fe7ec');
    rect(-S.Rx, S.zb - 1.2, S.Rx, 1, '#b9bec8', '#5d6372'); rect(-S.Rw, S.zb - 1.2, S.Rw, 0, '#d6d2c4');
  }
  // детектор: корпус, зазор, кристалл
  rect(-G.Rh, -G.Hl, G.Rh, 0, '#8a96b6', '#3b4256');
  rect(-G.hx - 1, G.z0, G.hx + 1, -D.clad, '#e3e9f2');
  rect(-G.hx, G.z0, G.hx, G.z1, '#35a6ab', '#1d5e62');
  ctx.strokeStyle = '#8ee6ea'; ctx.lineWidth = 2; ctx.strokeRect(X(-G.hx) - 1, Z(G.z1) - 1, 2 * G.hx * sc + 2, (G.z1 - G.z0) * sc + 2); ctx.lineWidth = 1;
  // лучи
  mc.rays.forEach(r => {
    const L = r.th >= 0 ? r.th : 22, ex = r.P[0] + L * r.u[0], ez = r.P[2] + L * r.u[2];
    ctx.strokeStyle = r.th >= 0 ? 'rgba(255,170,0,.95)' : 'rgba(40,48,70,.28)'; ctx.lineWidth = r.th >= 0 ? 1.6 : 1;
    ctx.beginPath(); ctx.moveTo(X(r.P[0]), Z(r.P[2])); ctx.lineTo(X(ex), Z(ez)); ctx.stroke();
  });
  ctx.lineWidth = 1;
  if (S.kind === 'point') { ctx.fillStyle = '#ff4d6d'; ctx.beginPath(); ctx.arc(X(0), Z(S.z), 5, 0, 7); ctx.fill(); ctx.strokeStyle = '#7a1022'; ctx.stroke(); }
  // размеры кристалла
  ctx.fillStyle = '#ffffff'; ctx.font = '700 12px system-ui'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  const wtxt = (D.cyl ? '⌀' : '') + fx(2 * G.hx, 0) + ' × ' + fx(G.L, 0);
  if ((G.z1 - G.z0) * sc > 18 && 2 * G.hx * sc > 50) ctx.fillText(wtxt, X(0), Z((G.z0 + G.z1) / 2));
  // подпись в углу, как у программы
  const lines = [t('g.cap.det') + ': ' + (D.cyl ? '⌀' + fx(D.cyl[0], 0) + ' × ' + fx(D.cyl[1], 0) : fx(D.box[0], 0) + ' × ' + fx(D.box[1], 0) + ' × ' + fx(D.box[2], 0)) + ' ' + mm];
  if (S.kind === 'point') lines.push(t('g.cap.pt') + ': ' + fx(st.dist, 0) + ' ' + mm);
  if (S.kind === 'cyl') { lines.push(t('g.cap.cyl') + ': ⌀' + fx(st.diam, 0) + ' × ' + fx(st.hgt, 0) + ' ' + mm); lines.push(t('g.cap.dist') + ': ' + fx(st.dist, 0) + ' ' + mm); }
  if (S.kind === 'mar') lines.push(t('g.cap.mar') + ': ⌀' + fx(st.md, 0) + ' × ' + fx(S.zt - S.zb + 2, 0) + ' ' + mm);
  ctx.font = '12px system-ui'; ctx.textAlign = 'left'; ctx.textBaseline = 'top';
  const bw = Math.max(...lines.map(s => ctx.measureText(s).width)) + 14;
  ctx.fillStyle = 'rgba(244,242,234,.92)'; ctx.fillRect(8, 8, bw, lines.length * 16 + 8); ctx.fillStyle = '#1b1f2a';
  lines.forEach((s, i) => ctx.fillText(s, 15, 13 + i * 16));
  // плитки
  const f = mc.n ? mc.hit / mc.n : 0, e = mc.n ? Math.sqrt(f * (1 - f) / mc.n) : 0;
  $('#gTiles').innerHTML =
    '<div class="tile"><div class="big" style="color:var(--goldink)">' + fx(100 * f, 2) + ' %</div><div class="small">' + t('g.t.frac') + ' · ' + t('g.t.fracS', fx(100 * e, 2), mc.n) + '</div></div>' +
    '<div class="tile"><div class="big">' + fmtV(G.vol) + ' ' + t('cm3') + '</div><div class="small">' + t('g.t.cr') + ' · ' + D.nm + '</div></div>' +
    '<div class="tile"><div class="big">' + (S.kind === 'point' ? t('g.t.pt') : fmtV(S.vol) + ' ' + t('ml')) + '</div><div class="small">' + t('g.t.sm') + '</div></div>';
  $('#gKept').innerHTML = kept && f > 0 ? t('g.kept', kept.lbl + ' · ' + fx(100 * kept.f, 2) + ' %', fx(f / kept.f, 2)) : t('g.kept0');
}
function geoUI() {
  $('#gDet').innerHTML = DET.map((d, i) => '<button class="chip' + (i === st.det ? ' on' : '') + '" data-i="' + i + '">' + d.nm + '</button>').join('');
  $('#gSrc').innerHTML = SRC.map((s, i) => '<button class="chip' + (i === st.src ? ' on' : '') + '" data-i="' + i + '">' + t('g.s.' + s) + '</button>').join('');
  $$('#gDet .chip').forEach(b => b.onclick = () => { st.det = +b.dataset.i; geoUI(); restart(); });
  $$('#gSrc .chip').forEach(b => b.onclick = () => { st.src = +b.dataset.i; geoUI(); restart(); });
  const k = SRC[st.src];
  $('#slDist').style.display = k === 'mar' ? 'none' : ''; $('#slDiam').style.display = k === 'cyl' ? '' : 'none'; $('#slHgt').style.display = k === 'cyl' ? '' : 'none';
  $('#slMd').style.display = k === 'mar' ? '' : 'none'; $('#slMf').style.display = k === 'mar' ? '' : 'none';
  const mm = ' ' + t('mm');
  $('#vDist').textContent = st.dist + mm; $('#vDiam').textContent = st.diam + mm; $('#vHgt').textContent = st.hgt + mm; $('#vMd').textContent = st.md + mm; $('#vMf').textContent = st.mf + mm;
}
[['#rDist', 'dist'], ['#rDiam', 'diam'], ['#rHgt', 'hgt'], ['#rMd', 'md'], ['#rMf', 'mf']].forEach(([id, key]) => {
  const el = $(id); el.value = st[key]; el.addEventListener('input', () => { st[key] = +el.value; geoUI(); restart(); });
});
$('#gKeep').onclick = () => { if (!mc.n) return; const D = DET[st.det]; kept = { f: mc.hit / mc.n, lbl: D.nm + ', ' + t('g.s.' + SRC[st.src]) }; drawGeo(); };
GUIDE.onRedraw(() => { geoUI(); drawGeo(); });
restart();

/* ── 3. вкладки конструктора ── */
$$('#mTabs .chip').forEach(b => b.onclick = () => {
  $$('#mTabs .chip').forEach(c => c.classList.toggle('on', c === b));
  $$('#maker .pane').forEach(p => p.classList.toggle('on', p.id === b.dataset.p));
});

/* ── 4. гонка процессор / видеокарта (замер: 143 узла × 3 млн, CPU 2203 с, GPU 19 с) ── */
(function race() {
  const cv = $('#cvRace'), NODES = 143, T = { cpu: 2203, gpu: 19 }, SP = [20, 100, 600];
  let speed = 100, sim = 0, run = false, last = 0;
  $('#rSpeed').innerHTML = SP.map(v => '<button class="chip' + (v === speed ? ' on' : '') + '" data-v="' + v + '">×' + v + '</button>').join('');
  $$('#rSpeed .chip').forEach(b => b.onclick = () => { speed = +b.dataset.v; $$('#rSpeed .chip').forEach(c => c.classList.toggle('on', c === b)); });
  const mmss = s => { s = Math.round(s); const m = Math.floor(s / 60), r = s % 60; return m + ':' + (r < 10 ? '0' : '') + r; };
  function draw() {
    const { ctx, w, h } = setup(cv), narrow = w < 520, lab = narrow ? 6 : 150;
    const cols = narrow ? Math.max(10, Math.floor((w - 12) / 10)) : Math.min(72, Math.max(20, Math.floor((w - lab - 80) / 12))), cell = narrow ? (w - 12) / cols : 12;
    const rows = Math.ceil(NODES / cols), gh = rows * cell, head = narrow ? 36 : 0, gap = (h - 2 * (gh + head)) / 3;
    [['cpu', '#6aa8ff'], ['gpu', '#5be38a']].forEach(([k, col], li) => {
      const y0 = gap * (li + 1) + (gh + head) * li, gy = y0 + head, done = Math.min(NODES, Math.floor(NODES * sim / T[k])), fin = sim >= T[k];
      ctx.fillStyle = col; ctx.font = '700 13px system-ui'; ctx.textAlign = 'left'; ctx.textBaseline = 'top'; ctx.fillText(t('r.' + k), 6, y0);
      ctx.fillStyle = '#93a3c4'; ctx.font = '12px system-ui'; ctx.fillText(fin ? t('r.done', mmss(T[k])) : t('r.node', done, NODES), 6, y0 + 17);
      for (let i = 0; i < NODES; i++) { const cx = lab + (i % cols) * cell, cy = gy + Math.floor(i / cols) * cell; ctx.fillStyle = i < done ? col : 'rgba(255,255,255,.07)'; ctx.fillRect(cx, cy, cell - 1.5, cell - 1.5); }
      ctx.fillStyle = fin ? col : '#eef3ff'; ctx.font = '800 15px system-ui'; ctx.textAlign = 'right'; ctx.fillText(mmss(Math.min(sim, T[k])), w - 6, y0 + 2);
    });
    $('#rRes').innerHTML = '<span class="pill">' + t('r.real', mmss(sim)) + '</span><span class="pill good">' + t('r.x', fx(T.cpu / T.gpu, 0)) + '</span>';
  }
  function tick(now) { if (!run) return; const dt = (now - last) / 1000; last = now; sim = Math.min(T.cpu, sim + dt * speed); draw(); if (sim >= T.cpu) { run = false; $('#rRun').disabled = false; return; } requestAnimationFrame(tick); }
  $('#rRun').onclick = () => { if (sim >= T.cpu) sim = 0; run = true; $('#rRun').disabled = true; last = performance.now(); requestAnimationFrame(tick); };
  $('#rReset').onclick = () => { run = false; sim = 0; $('#rRun').disabled = false; draw(); };
  io.observe(cv); GUIDE.onRedraw(draw);
})();

/* ── 5. конвейер «где лежит кривая» ── */
(function pipe() {
  // на каждом шаге: [конструктор, конфигурация, диск, файл спектра] → список меток [ключ, вид]
  const S = [
    [[], [], [], []],
    [[['p.curve', 'new']], [], [], []],
    [[['p.curve', 'ok']], [['p.curve', 'new']], [], []],
    [[], [['p.curve', 'new'], ['p.mat', 'wait']], [], []],
    [[], [['p.curve', 'ok'], ['p.mat', 'ok']], [['p.curve', 'new'], ['p.mat', 'new']], []],
    [[], [['p.curve', 'ok'], ['p.mat', 'ok']], [['p.curve', 'ok'], ['p.mat', 'ok']], [['p.curve', 'new'], ['p.mat', 'new']]],
  ];
  const HIT = [[], [0], [1], [1], [2], [3]];
  let step = 0;
  function draw() {
    $('#pSteps').innerHTML = [1, 2, 3, 4, 5].map(i => '<button class="' + (i === step ? 'on' : i < step ? 'done' : '') + '" data-s="' + i + '"><b>' + i + '</b>' + t('p.s' + i) + '</button>').join('');
    $$('#pSteps button').forEach(b => b.onclick = () => { step = +b.dataset.s; draw(); });
    $('#pWhere').innerHTML = [1, 2, 3, 4].map((w, i) => {
      const tags = S[step][i];
      return '<div class="place' + (HIT[step].indexOf(i) >= 0 ? ' hit' : '') + '"><h4>' + t('p.w' + w) + '<small>' + t('p.w' + w + 's') + '</small></h4>' +
        (tags.length ? tags.map(([k, v]) => '<span class="tag ' + v + '">' + t(k) + (v === 'wait' ? ' · ' + t('p.wait') : '') + '</span>').join('') : '<span class="tag none">' + t('p.nothing') + '</span>') + '</div>';
    }).join('');
    $('#pSay').innerHTML = '<span class="pill ' + (step >= 1 && step <= 3 ? 'bad' : step >= 4 ? 'good' : '') + '">' + t('p.say' + step) + '</span>';
  }
  GUIDE.onRedraw(draw);
})();

GUIDE.Q.heroAnim(document.getElementById('cvHero'), document.getElementById('heroStat'));   // заставка с квантами, как на главной (`AMBER246`)
GUIDE.init();
