}

/* ── заставка: кванты из банки (общий движок assets/quanta.js, `AMBER244`) ── */

/* ── путь за пять шагов: одна картинка, пять состояний ── */
(function path() {
  const cv = $('#cvPath'); io.observe(cv);
  const STEPS = ['s1', 's2', 's3', 's4', 's5'], GO = ['devices', 'acquire', 'calibration', 'fsa', 'result'];
  let st = 0, t0 = performance.now(), auto = true, lastSwitch = performance.now();
  const box = $('#path');
  function buttons() {
    box.innerHTML = STEPS.map((k, i) => '<button class="' + (i === st ? 'on' : '') + '" data-i="' + i + '"><b>' + (i + 1) + '</b><span>' + t(k) + '</span><small>' + t(k + 'd') + '</small></button>').join('');
    $$('button', box).forEach(b => b.onclick = () => go(+b.dataset.i, true));
    const ch = GUIDE.CHAPTERS.find(c => c.id === GO[st]); const a = $('#pGo'); a.href = GUIDE.langHref(ch.file); a.textContent = t('p.go', ch[GUIDE.lang][0]);
  }
  function go(i, user) { st = (i + 5) % 5; t0 = performance.now(); lastSwitch = t0; if (user) { auto = false; $('#pAuto').checked = false; } buttons(); }
  $('#pPrev').onclick = () => go(st - 1, true); $('#pNext').onclick = () => go(st + 1, true);
  $('#pAuto').onchange = e => { auto = e.target.checked; lastSwitch = performance.now(); };
  GUIDE.onRedraw(buttons);
  // синтетический спектр: Cs-137 + K-40 + континуум, 1024 канала, 3 кэВ на канал с небольшим нулём
  const NCH = 600, KEV = c => 2.6 * c + 8, CH = e => (e - 8) / 2.6;
  const LINES = [[661.7, 1.0, '#FFCC77', 'Cs-137'], [1460.8, 0.32, '#CCDD00', 'K-40'], [32, 0.25, '#FFCC77', ''], [186, 0.12, '#FF6655', 'Ra-226']];
  function shape(e, E, a) { const s = 0.075 * 662 * Math.sqrt(E / 662) / 2.355; const peak = Math.exp(-0.5 * ((e - E) / s) ** 2); const ce = E * (2 * E / 511) / (1 + 2 * E / 511); const comp = e < ce ? 0.11 * (0.6 + 0.4 * e / ce) / (1 + Math.exp((e - ce) / (s * 0.7))) : 0.11 * Math.exp(-0.5 * ((e - ce) / s) ** 2) * 0.4; const bs = 0.03 * Math.exp(-0.5 * ((e - E / (1 + 2 * E / 511)) / (s * 1.6)) ** 2); return a * (peak + comp + bs); }
  const comp = LINES.map(([E, a]) => Float64Array.from({ length: NCH }, (_, c) => shape(KEV(c), E, a)));
  const cont = Float64Array.from({ length: NCH }, (_, c) => { const e = KEV(c); return 0.5 * Math.exp(-e / 160) + 0.03 * Math.exp(-e / 900); });
  const total = Float64Array.from({ length: NCH }, (_, c) => comp.reduce((s, a) => s + a[c], 0) + cont[c]);
  const noisy = Float64Array.from(total, v => Math.max(0, v + Math.sqrt(v / 900) * GUIDE.gauss()));
  function draw(now) {
    const { ctx, w, h } = setup(cv), u = clamp((now - t0) / 1600, 0, 1), e = 1 - Math.pow(1 - u, 3);
    const narrow = w < 640, bx = { l: 52, t: 18, r: w - 14, b: h - 28 };
    if (st === 0) {   // прибор → провод → компьютер, кванты летят
      const cx = narrow ? w * 0.28 : w * 0.3, cy = h * 0.5, R = Math.min(h * 0.22, 70);
      ctx.fillStyle = '#1d2232'; ctx.fillRect(cx - R * 0.7, cy - R * 1.6, R * 1.4, R * 3.2);
      const g = ctx.createLinearGradient(0, cy - R, 0, cy + R); g.addColorStop(0, 'rgba(150,200,255,.45)'); g.addColorStop(1, 'rgba(110,160,255,.18)');
      ctx.fillStyle = g; ctx.fillRect(cx - R * 0.55, cy - R * 1.45, R * 1.1, R * 1.3);
      ctx.fillStyle = '#cdd8f3'; ctx.font = '600 12px system-ui'; ctx.textAlign = 'center'; ctx.fillText(t('cv.dev'), cx, cy + R * 1.95);
      for (let k = 0; k < 9; k++) { const ph = ((now / 900) + k / 9) % 1, ang = -2.2 + k * 0.5, x0 = cx + Math.cos(ang) * R * 4, y0 = cy - R * 0.8 + Math.sin(ang) * R * 4; const x = lerp(x0, cx, ph), y = lerp(y0, cy - R * 0.8, ph); ctx.strokeStyle = eCol(80 + k * 300, 0.8); ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(lerp(x0, cx, Math.max(0, ph - 0.15)), lerp(y0, cy - R * 0.8, Math.max(0, ph - 0.15))); ctx.lineTo(x, y); ctx.stroke(); if (ph > 0.93) { ctx.fillStyle = 'rgba(255,230,120,.9)'; ctx.beginPath(); ctx.arc(cx, cy - R * 0.8, 6, 0, 7); ctx.fill(); } }
      const px = narrow ? w * 0.72 : w * 0.7; ctx.strokeStyle = '#6a7899'; ctx.lineWidth = 2; ctx.setLineDash([6, 6]); ctx.lineDashOffset = -now / 40; ctx.beginPath(); ctx.moveTo(cx + R * 0.7, cy + R); ctx.bezierCurveTo(cx + R * 2, cy + R * 2, px - R * 2, cy + R * 1.5, px - R * 1.2, cy); ctx.stroke(); ctx.setLineDash([]);
      ctx.fillStyle = '#1a2440'; ctx.strokeStyle = '#3a4a78'; ctx.fillRect(px - R * 1.2, cy - R * 1.1, R * 2.4, R * 1.6); ctx.strokeRect(px - R * 1.2, cy - R * 1.1, R * 2.4, R * 1.6);
      ctx.fillStyle = '#eef3ff'; ctx.font = '800 15px system-ui'; ctx.fillText('Becq', px - 14, cy - R * 0.2); ctx.fillStyle = '#ffcc33'; ctx.fillText('Moni', px + 22, cy - R * 0.2);
      return;
    }
    const kev = st >= 2, X = kev ? scale('lin', 0, 1600, bx.l, bx.r) : scale('lin', 0, NCH, bx.l, bx.r);
    let mx = 0; for (let c = 5; c < NCH; c++) mx = Math.max(mx, total[c]);
    const Y = scale('sqrt', 0, mx * 1.1, bx.b, bx.t);
    axes(ctx, bx, X, Y, { xl: kev ? t('cv.kev') : t('cv.ch'), yl: t('cv.cnt'), noY: true });
    const fill = st === 1 ? e : 1, xOf = c => kev ? X(lerp(c * 2.6, KEV(c), st === 2 ? e : 1)) : X(c);
    if (st >= 3) {   // слои FSA
      const base = Float64Array.from(cont), grow = st === 3 ? e : 1;
      ctx.beginPath(); for (let c = 3; c < NCH; c++) ctx.lineTo(xOf(c), Y(base[c])); ctx.lineTo(xOf(NCH - 1), bx.b); ctx.lineTo(xOf(3), bx.b); ctx.closePath(); ctx.fillStyle = 'rgba(176,183,189,.75)'; ctx.fill();
      LINES.forEach(([, , col], k) => { ctx.beginPath(); for (let c = 3; c < NCH; c++) ctx.lineTo(xOf(c), Y(base[c] + comp[k][c] * grow)); for (let c = NCH - 1; c >= 3; c--) ctx.lineTo(xOf(c), Y(base[c])); ctx.closePath(); ctx.fillStyle = rgba(col, .85); ctx.fill(); for (let c = 0; c < NCH; c++) base[c] += comp[k][c] * grow; });
    }
    const nShow = Math.floor(NCH * fill); ctx.fillStyle = '#ffffff';
    for (let c = 3; c < nShow; c++) { const v = st === 1 ? noisy[c] * clamp(e * 1.4 - c / NCH * 0.4, 0, 1) : noisy[c]; ctx.fillRect(xOf(c) - 0.9, Y(v) - 0.9, 1.8, 1.8); }
    if (st === 2) {  // калибровка: две точки
      [[661.7, '#ff4d6d'], [1460.8, '#ff4d6d']].forEach(([E]) => { const x = xOf(Math.round(CH(E))); ctx.strokeStyle = 'rgba(255,77,109,.8)'; ctx.setLineDash([4, 4]); ctx.beginPath(); ctx.moveTo(x, bx.t + 14); ctx.lineTo(x, bx.b); ctx.stroke(); ctx.setLineDash([]); ctx.fillStyle = '#ff4d6d'; ctx.font = '600 12px system-ui'; ctx.textAlign = 'center'; ctx.fillText(fx(E, 1) + (GUIDE.lang === 'ru' ? ' кэВ' : ' keV'), x, bx.t + 10); });
    }
    if (st >= 3) { ctx.font = '700 12px system-ui'; ctx.textAlign = 'center'; LINES.forEach(([E, , col, nm]) => { if (!nm) return; const c = Math.round(CH(E)); ctx.fillStyle = col; ctx.fillText(nm, xOf(c), Y(total[c]) - 10); }); }
    if (st === 4) {  // карточка результата
      const cw = Math.min(260, w * 0.42), ch = 112, x = bx.r - cw - 6, y = bx.t + 30, a = e;
      ctx.globalAlpha = a; ctx.fillStyle = 'rgba(19,27,47,.95)'; ctx.strokeStyle = '#5be38a'; ctx.lineWidth = 1.5; ctx.beginPath(); ctx.rect(x, y, cw, ch); ctx.fill(); ctx.stroke();
      ctx.textAlign = 'left'; ctx.fillStyle = '#93a3c4'; ctx.font = '12px system-ui'; ctx.fillText(t('cv.res'), x + 12, y + 20);
      ctx.fillStyle = '#FFCC77'; ctx.font = '800 20px system-ui'; ctx.fillText('Cs-137  ' + fx(48.2 * a, 1) + ' ± 2.1', x + 12, y + 50);
      ctx.fillStyle = '#eef3ff'; ctx.font = '12px system-ui'; ctx.fillText(t('cv.bqkg'), x + cw - 50, y + 50);
      ctx.fillStyle = '#CCDD00'; ctx.font = '700 15px system-ui'; ctx.fillText('K-40  ' + fx(410 * a, 0) + ' ± 25', x + 12, y + 76);
      ctx.fillStyle = '#93a3c4'; ctx.font = '12px system-ui'; ctx.fillText('Ra-226 < 6.5 — ' + t('cv.lim'), x + 12, y + 98);
      ctx.globalAlpha = 1;
    }
  }
  function loop(now) {
    requestAnimationFrame(loop);
    if (!visible.get(cv)) return;
    if (auto && now - lastSwitch > 4200) go(st + 1, false);
    draw(now);
  }
  requestAnimationFrame(loop);
})();

GUIDE.init();
</script>
