const { $, $$, clamp, lerp, fx, sig, setup, scale, axes, eCol, rgba, gauss, poisson, Jobs, visible, io, t, Q } = GUIDE;
const kev = () => (GUIDE.lang === 'ru' ? ' кэВ' : ' keV');
const touchStop = (els, f) => els.forEach(el => el && ['pointerdown', 'keydown'].forEach(ev => el.addEventListener(ev, f)));

/* ── 0–1: заставка и «фотон в кристалле» — общий движок квантов ── */
Q.heroAnim($('#cvHero'), $('#heroStat'));
Q.photonLab();

/* ── 2: ведро под дождём ── */
(function geometry() {
  const cv = $('#cvGeoQ'), cvC = $('#cvGeoC'); io.observe(cv); io.observe(cvC);
  const E = 661.66, SRC = [['point', 's2.pt', '#ffcc33'], ['jar', 's2.jar', '#6aa8ff'], ['mar', 's2.mar', '#5be38a']];
  const SIZES = [[4.0, 'Ø40 × 40'], [6.3, 'Ø63 × 63'], [7.6, 'Ø76 × 76']];
  const st = { src: 'jar', gap: 1.0, size: 6.3 };
  let D = Q.dims(st), S = null, tracks = [], nEm = 0, nHit = 0, auto = true, dir = 1, lastStep = 0;
  const curve = {};                          // форма|кристалл → { отступ(мм) → доля в пике }
  const key = () => st.src + '|' + st.size;
  const srcBox = $('#geoSrc'), sizeBox = $('#geoSize'), gapSl = $('#geoGap');
  function chips() {
    srcBox.innerHTML = SRC.map(([k, l]) => '<button class="chip' + (st.src === k ? ' on' : '') + '" data-k="' + k + '">' + t(l) + '</button>').join('');
    sizeBox.innerHTML = SIZES.map(([s, l]) => '<button class="chip' + (st.size === s ? ' on' : '') + '" data-s="' + s + '">' + l + (GUIDE.lang === 'ru' ? ' мм' : ' mm') + '</button>').join('');
    $$('button', srcBox).forEach(b => b.onclick = () => { auto = false; st.src = b.dataset.k; changed(); });
    $$('button', sizeBox).forEach(b => b.onclick = () => { auto = false; st.size = +b.dataset.s; changed(); });
    $('#geoGapV').textContent = st.src === 'mar' ? '—' : fx(st.gap * 10, 0) + (GUIDE.lang === 'ru' ? ' мм' : ' mm');
    gapSl.disabled = st.src === 'mar';
  }
  function changed() { D = Q.dims(st); S = { n: 0, hit: 0, arr: 0, inter: 0, fep: 0 }; tracks = []; nEm = nHit = 0; chips(); }
  gapSl.addEventListener('input', () => { auto = false; st.gap = +gapSl.value / 10; changed(); });
  touchStop([gapSl], () => { auto = false; });
  const setT = (el, s) => { if (el.textContent !== s) el.textContent = s; };   // плитки зовутся каждый кадр — писать, только если число сменилось (`AMBER254`)
  function tiles() {
    const ok = S && S.n >= 600;
    setT($('#geoT1'), ok ? sig(100 * S.hit / S.n, 2) + ' %' : '…');
    setT($('#geoT2'), ok ? sig(100 * S.fep / S.n, 2) + ' %' : '…');
    setT($('#geoT3'), ok ? sig(1000 * S.fep / S.n, 2) : '…');
  }
  function drawScene() {
    const { ctx, w, h } = setup(cv);
    const zmin = D.point ? Math.min(D.point[2] - 2, -9) : D.jar ? Math.min(D.jar.z0 - 1.2, -9) : D.mar.z0 - 2;
    const ext = Math.max(D.R, D.jar ? D.jar.R : D.mar ? D.mar.Ro : D.R) + 3;
    const V = Q.view(w, h, zmin, D.H * 1.9 + 1.2, -ext, ext, 8);
    Q.drawSetup(ctx, V, D, { labels: true });
    tracks.forEach(x => Q.drawTrack(ctx, V, x.tr, Math.pow(1 - x.age / 46, 1.3), Math.min(1, (x.age + 1) / 12)));
    ctx.fillStyle = '#cdd8f3'; ctx.font = '600 12px system-ui'; ctx.textAlign = 'left';
    ctx.fillText((GUIDE.lang === 'ru' ? 'вылетело ' : 'emitted ') + nEm + (GUIDE.lang === 'ru' ? ' · в кристалл ' : ' · into the crystal ') + nHit, 10, h - 10);
  }
  function drawCurve() {
    const { ctx, w, h } = setup(cvC), bx = { l: 46, t: 12, r: w - 12, b: h - 24 };
    let mx = 1; Object.values(curve).forEach(c => Object.values(c).forEach(v => { mx = Math.max(mx, v * 100); }));
    const X = scale('lin', 0, 8, bx.l, bx.r), Y = scale('log', 0.05, mx * 1.6, bx.b, bx.t);
    axes(ctx, bx, X, Y, { xl: t('s2.ax'), yl: t('s2.ay'), nx: 5 });
    SRC.forEach(([k, , col]) => SIZES.forEach(([s]) => {
      const c = curve[k + '|' + s]; if (!c) return;
      const pts = Object.keys(c).map(Number).sort((a, b) => a - b);
      const cur = k + '|' + s === key();
      ctx.strokeStyle = rgba(col, cur ? .9 : .35); ctx.lineWidth = cur ? 2 : 1; ctx.beginPath();
      pts.forEach((g, i) => { const x = X(k === 'mar' ? 0.2 : g / 10), y = Y(c[g] * 100); if (i) ctx.lineTo(x, y); else ctx.moveTo(x, y); }); ctx.stroke();
      pts.forEach(g => { ctx.fillStyle = rgba(col, cur ? 1 : .45); ctx.beginPath(); ctx.arc(X(k === 'mar' ? 0.2 : g / 10), Y(c[g] * 100), cur ? 3.2 : 2.2, 0, Math.PI * 2); ctx.fill(); });
    }));
    if (S && S.n >= 600) { const x = X(st.src === 'mar' ? 0.2 : st.gap), y = Y(100 * S.fep / S.n); ctx.strokeStyle = '#fff'; ctx.lineWidth = 1.5; ctx.beginPath(); ctx.arc(x, y, 6, 0, Math.PI * 2); ctx.stroke(); }
  }
  function frame(ts) {
    requestAnimationFrame(frame);
    if (!visible.get(cv) && !visible.get(cvC)) return;
    for (let i = 0; i < 2; i++) { const tr = []; const r = Q.historyA(E, D, tr); nEm++; if (r.hit) nHit++; tracks.push({ tr, age: 0 }); }
    tracks.forEach(x => x.age++); tracks = tracks.filter(x => x.age < 46);
    Q.runW(E, D, 140, null, 1, S);
    if (S.n >= 600) { (curve[key()] = curve[key()] || {})[Math.round(st.gap * 10)] = S.fep / S.n; }
    if (auto && st.src !== 'mar' && ts - lastStep > 2600 && S.n >= 3000) {   // кривая строится сама: шаг расстояния каждые 2.6 с
      lastStep = ts; let g = Math.round(st.gap * 10) + dir * (st.gap < 1.5 ? 3 : st.gap < 3 ? 5 : 10);
      if (g > 80) { g = 80; dir = -1; } if (g < 2) { g = 2; dir = 1; st.src = st.src === 'jar' ? 'point' : 'jar'; }   // туда-обратно, затем другая форма пробы
      st.gap = g / 10; gapSl.value = g; changed();
    }
    drawScene(); tiles(); drawCurve();
  }
  GUIDE.onRedraw(() => { chips(); tiles(); drawScene(); drawCurve(); });
  changed(); requestAnimationFrame(frame);
})();

/* ── 3: словарь прибора — матрица печатается строка за строкой ── */
const MXQ = { E: [], rows: [], blurred: [], fep: [], hits: [], N: 0, bw: 10, nb: 280, sel: 12, auto: true };
(function matrix() {
  const cv = $('#cvMxQ'), cvR = $('#cvMxRow'); io.observe(cv); io.observe(cvR);
  const D = Q.dims({ size: 6.3, gap: 1.0, src: 'jar' }), NR = 24, NH = GUIDE.lite() ? 1500 : 3500;
  for (let i = 0; i < NR; i++) MXQ.E.push(50 * Math.pow(2700 / 50, i / (NR - 1)));
  const sl = $('#mxSel');
  sl.addEventListener('input', () => { MXQ.sel = +sl.value; MXQ.auto = false; draw(); });
  $('#mxAuto').onclick = () => { MXQ.auto = true; };
  touchStop([sl], () => { MXQ.auto = false; });
  Jobs.add('mxq', (function* () {
    for (let i = 0; i < NR; i++) {
      const raw = new Float64Array(MXQ.nb), S = { n: 0, hit: 0, arr: 0, inter: 0, fep: 0 };
      for (let k = 0; k < NH; k += 500) { Q.runW(MXQ.E[i], D, 500, raw, MXQ.bw, S); MXQ.N += 500; yield; }
      for (let b = 0; b < MXQ.nb; b++) raw[b] /= S.n;
      MXQ.rows[i] = raw; MXQ.blurred[i] = Q.blur(raw, MXQ.bw, 7.5); MXQ.fep[i] = S.fep / S.n; MXQ.hits[i] = S.inter / S.n;
      if (MXQ.auto) { MXQ.sel = i; sl.value = i; }
      draw();
    }
  })());
  function draw() {
    // карта: строки — энергия фотона (снизу вверх), столбцы — выделенная энергия
    { const { ctx, w, h } = setup(cv), bx = { l: 52, t: 10, r: w - 10, b: h - 26 };
      const X = scale('lin', 0, MXQ.nb * MXQ.bw, bx.l, bx.r), Y = scale('log', MXQ.E[0] / 1.09, MXQ.E[NR - 1] * 1.09, bx.b, bx.t);
      const rh = (bx.b - bx.t) / NR, cw = (bx.r - bx.l) / MXQ.nb;
      for (let i = 0; i < NR; i++) {
        const row = MXQ.blurred[i], yc = Y(MXQ.E[i]);
        if (!row) { ctx.fillStyle = 'rgba(255,255,255,.03)'; ctx.fillRect(bx.l, yc - rh / 2, bx.r - bx.l, rh - 1); continue; }
        let m = 1e-12; for (let b = 0; b < MXQ.nb; b++) m = Math.max(m, row[b]);
        for (let b = 0; b < MXQ.nb; b++) {
          const v = row[b] / m; if (v < 2e-3) continue;
          const a = clamp(1 + Math.log10(v) / 2.7, 0, 1);
          ctx.fillStyle = eCol((b + 0.5) * MXQ.bw, 0.15 + 0.85 * a); ctx.fillRect(bx.l + b * cw, yc - rh / 2, Math.ceil(cw), rh - 1);
        }
      }
      if (MXQ.rows[MXQ.sel]) { const yc = Y(MXQ.E[MXQ.sel]); ctx.strokeStyle = '#fff'; ctx.lineWidth = 1.5; ctx.strokeRect(bx.l - 2, yc - rh / 2 - 1, bx.r - bx.l + 4, rh + 1); }
      // диагональ «пик полного поглощения»
      ctx.strokeStyle = 'rgba(255,204,51,.55)'; ctx.setLineDash([4, 4]); ctx.beginPath(); ctx.moveTo(X(MXQ.E[0]), Y(MXQ.E[0])); for (let i = 1; i < NR; i++) ctx.lineTo(X(MXQ.E[i]), Y(MXQ.E[i])); ctx.stroke(); ctx.setLineDash([]);
      axes(ctx, bx, X, Y, { xl: t('s3.ax'), yl: t('s3.ay'), nx: 5 });
    }
    // строка
    { const { ctx, w, h } = setup(cvR), bx = { l: 50, t: 14, r: w - 12, b: h - 24 }, i = MXQ.sel, row = MXQ.blurred[i];
      const E = MXQ.E[i], emax = Math.max(150, E * 1.15);
      $('#mxRowT').textContent = t('s3.row', Math.round(E)); $('#mxSelV').textContent = Math.round(E) + kev();
      if (!row) { ctx.fillStyle = '#93a3c4'; ctx.font = '13px system-ui'; ctx.textAlign = 'center'; ctx.fillText('…', (bx.l + bx.r) / 2, (bx.t + bx.b) / 2); }
      else {
        let m = 1e-9; for (let b = 1; b < MXQ.nb; b++) if ((b + 0.5) * MXQ.bw < emax) m = Math.max(m, row[b]);
        const X = scale('lin', 0, emax, bx.l, bx.r), Y = scale('log', m * 2e-3, m * 2, bx.b, bx.t);
        axes(ctx, bx, X, Y, { xl: t('s3.ax'), noY: true, nx: 5 });
        Q.drawFeatures(ctx, bx, X, Q.features(E, false));
        ctx.beginPath(); ctx.moveTo(X(0), bx.b);
        for (let b = 0; b < MXQ.nb; b++) { const e = (b + 0.5) * MXQ.bw; if (e > emax) break; ctx.lineTo(X(e), Y(Math.max(row[b], m * 2e-3))); }
        ctx.lineTo(X(Math.min(emax, MXQ.nb * MXQ.bw)), bx.b); ctx.closePath();
        const g = ctx.createLinearGradient(bx.l, 0, bx.r, 0); g.addColorStop(0, eCol(60, .55)); g.addColorStop(1, eCol(Math.max(80, E), .55)); ctx.fillStyle = g; ctx.fill();
        ctx.strokeStyle = eCol(E, 1); ctx.lineWidth = 1.6; ctx.stroke();
      }
    }
    const done = MXQ.rows.filter(Boolean).length;
    $('#mxStat').innerHTML = '<span class="pill">' + t('s3.st', done, MXQ.N) + '</span>' + (MXQ.rows[MXQ.sel] ? '<span class="pill good">' + t('s3.pk', fx(100 * MXQ.fep[MXQ.sel] / Math.max(MXQ.hits[MXQ.sel], 1e-9), 0)) + '</span>' : '');
  }
  let last = 0;
  function loop(ts) {
    requestAnimationFrame(loop);
    if (!visible.get(cv) && !visible.get(cvR)) return;
    if (MXQ.auto && ts - last > 1300) {        // листает словарь сам: по строке раз в 1.3 с
      last = ts; const done = MXQ.rows.map((r, i) => r ? i : -1).filter(i => i >= 0);
      if (done.length) { const k = done.indexOf(MXQ.sel); MXQ.sel = done[(k + 1) % done.length]; sl.value = MXQ.sel; draw(); }
    }
  }
  GUIDE.onRedraw(draw); draw(); requestAnimationFrame(loop);
})();

/* ── 4: FSA — слои из словаря, подбор шаг за шагом ── */
(function fsa() {
  const cv = $('#cvFsaQ'), cvR = $('#cvFsaR'); io.observe(cv);
  const D = Q.dims({ size: 6.3, gap: 1.0, src: 'jar' }), BW = 10, NB = 280, EMIN = 40, FW = 7.5, NH = GUIDE.lite() ? 1300 : 2600;
  const NUC = [
    { id: 'Cs-137', c: '#6aa8ff', L: [[661.66, 0.851]] },
    { id: 'K-40', c: '#ff9f43', L: [[1460.82, 0.1066]] },
    { id: 'Ra-226', c: '#5be38a', L: [[186.2, 0.036], [242.0, 0.073], [295.2, 0.184], [351.9, 0.356], [609.3, 0.455], [768.4, 0.049], [1120.3, 0.149], [1238.1, 0.058], [1764.5, 0.153]] },
    { id: 'Th-232', c: '#c38bff', L: [[238.6, 0.436], [338.3, 0.113], [583.2, 0.304], [727.3, 0.067], [911.2, 0.258], [969.0, 0.158], [2614.5, 0.359]] },
  ];
  const BG = { id: 'bg', c: '#55607a' };
  const F = { tpl: [], ready: false, todo: 0, done: 0, truth: [], a: [], meas: null, it: 0, chi: NaN, run: false };
  // фон помещения: гладкое падающее плато
  const bgT = new Float64Array(NB); for (let b = 0; b < NB; b++) { const e = (b + 0.5) * BW; bgT[b] = e < EMIN ? 0 : Math.exp(-e / 260) + 0.08 * Math.exp(-e / 1400); }
  { let s = 0; for (let b = 0; b < NB; b++) s += bgT[b]; for (let b = 0; b < NB; b++) bgT[b] /= s; }
  F.todo = NUC.reduce((a, n) => a + n.L.length, 0);
  Jobs.add('fsaq', (function* () {
    for (const n of NUC) {
      const T = new Float64Array(NB);
      for (const [E, y] of n.L) {
        const raw = new Float64Array(NB), S = { n: 0, hit: 0, arr: 0, inter: 0, fep: 0 };
        for (let k = 0; k < NH; k += 650) { Q.runW(E, D, 650, raw, BW, S); yield; }
        for (let b = 0; b < NB; b++) T[b] += y * raw[b] / S.n;
        F.done++; draw();
      }
      const bl = Q.blur(T, BW, FW); for (let b = 0; b < NB; b++) if ((b + 0.5) * BW < EMIN) bl[b] = 0;
      F.tpl.push(bl);
    }
    F.tpl.push(bgT); F.ready = true; newSample();
  })());
  function newSample() {
    // «истина»: распадов на канал при условном времени; фон — заметный
    const pick = () => Math.random() < 0.25 ? 0 : 0.3 + Math.random();
    F.truth = [pick() * 9e5, pick() * 6e6, pick() * 1.2e6, pick() * 1.2e6, 9000 + Math.random() * 6000];
    if (F.truth.slice(0, 4).every(v => v === 0)) F.truth[0] = 6e5;
    F.meas = new Float64Array(NB);
    for (let b = 0; b < NB; b++) { let mu = 0; F.tpl.forEach((T, k) => mu += F.truth[k] * T[b]); F.meas[b] = (b + 0.5) * BW < EMIN ? 0 : poisson(mu); }
    restart();
  }
  function restart() {
    let tot = 0; for (let b = 0; b < NB; b++) tot += F.meas[b];
    F.a = F.tpl.map(T => { let s = 0; for (let b = 0; b < NB; b++) s += T[b]; return tot / F.tpl.length / Math.max(s, 1e-12); });
    F.it = 0; F.run = true;
  }
  function model(k, b) { return F.a[k] * F.tpl[k][b]; }
  function step() {                          // один шаг подбора (EM: множители, не уводящие слой в минус)
    const f = new Float64Array(NB);
    for (let b = 0; b < NB; b++) { let s = 1e-9; for (let k = 0; k < F.tpl.length; k++) s += model(k, b); f[b] = s; }
    for (let k = 0; k < F.tpl.length; k++) {
      let num = 0, den = 0; const T = F.tpl[k];
      for (let b = 0; b < NB; b++) { if ((b + 0.5) * BW < EMIN) continue; num += T[b] * F.meas[b] / f[b]; den += T[b]; }
      if (den > 0) F.a[k] *= num / den;
    }
    let chi = 0, nu = 0;
    for (let b = 0; b < NB; b++) { if ((b + 0.5) * BW < EMIN) continue; let s = 0; for (let k = 0; k < F.tpl.length; k++) s += model(k, b); chi += (F.meas[b] - s) ** 2 / Math.max(s, 1); nu++; }
    F.chi = chi / Math.max(1, nu - F.tpl.length); F.it++;
  }
  $('#fsaNew').onclick = () => { if (F.ready) newSample(); };
  $('#fsaRe').onclick = () => { if (F.ready) restart(); };
  const label = k => k < NUC.length ? NUC[k].id : t('s4.bg'), color = k => k < NUC.length ? NUC[k].c : BG.c;
  function draw() {
    const { ctx, w, h } = setup(cv), bx = { l: 52, t: 12, r: w - 12, b: h - 24 };
    const X = scale('lin', 0, 2800, bx.l, bx.r);
    if (!F.ready) {
      axes(ctx, bx, X, scale('lin', 0, 1, bx.b, bx.t), { xl: t('qn.ax.e'), noY: true });
      ctx.fillStyle = '#cdd8f3'; ctx.font = '600 14px system-ui'; ctx.textAlign = 'center'; ctx.fillText(t('s4.calc', F.done, F.todo), (bx.l + bx.r) / 2, (bx.t + bx.b) / 2);
      ctx.fillStyle = 'rgba(255,204,51,.7)'; ctx.fillRect(bx.l, (bx.t + bx.b) / 2 + 14, (bx.r - bx.l) * F.done / F.todo, 4);
      return;
    }
    let mx = 10; for (let b = 0; b < NB; b++) mx = Math.max(mx, F.meas[b]);
    const Y = scale('sqrt', 0, mx * 1.08, bx.b, bx.t), bw = X(BW) - X(0);
    axes(ctx, bx, X, Y, { xl: t('qn.ax.e'), yl: t('qn.ax.cnt') });
    // слои — снизу фон, сверху нуклиды
    const order = [F.tpl.length - 1, ...NUC.map((n, i) => i)];
    const acc = new Float64Array(NB);
    order.forEach(k => {
      ctx.beginPath(); ctx.moveTo(X(0), Y(acc[0]));
      const top = new Float64Array(NB); for (let b = 0; b < NB; b++) top[b] = acc[b] + model(k, b);
      for (let b = 0; b < NB; b++) ctx.lineTo(X((b + 0.5) * BW), Y(top[b]));
      for (let b = NB - 1; b >= 0; b--) ctx.lineTo(X((b + 0.5) * BW), Y(acc[b]));
      ctx.closePath(); ctx.fillStyle = rgba(color(k), .62); ctx.fill();
      for (let b = 0; b < NB; b++) acc[b] = top[b];
    });
    ctx.strokeStyle = 'rgba(255,255,255,.85)'; ctx.lineWidth = 1.2; ctx.beginPath();
    for (let b = 0; b < NB; b++) { const x = X((b + 0.5) * BW), y = Y(acc[b]); if (b) ctx.lineTo(x, y); else ctx.moveTo(x, y); } ctx.stroke();
    ctx.fillStyle = '#ffffff';
    for (let b = 0; b < NB; b++) { if ((b + 0.5) * BW < EMIN) continue; ctx.beginPath(); ctx.arc(X((b + 0.5) * BW), Y(F.meas[b]), Math.max(1.2, Math.min(2.2, bw / 2.5)), 0, Math.PI * 2); ctx.fill(); }
    // невязка
    { const r = setup(cvR), c2 = r.ctx, bxr = { l: bx.l, t: 4, r: bx.r, b: r.h - 4 }, ym = (bxr.t + bxr.b) / 2, k = (bxr.b - bxr.t) / 2 / 4;
      c2.fillStyle = 'rgba(255,255,255,.05)'; c2.fillRect(bxr.l, ym - 2 * k, bxr.r - bxr.l, 4 * k);
      c2.strokeStyle = 'rgba(255,255,255,.25)'; c2.beginPath(); c2.moveTo(bxr.l, ym); c2.lineTo(bxr.r, ym); c2.stroke();
      for (let b = 0; b < NB; b++) { if ((b + 0.5) * BW < EMIN) continue; const z = clamp((F.meas[b] - acc[b]) / Math.sqrt(Math.max(acc[b], 1)), -4, 4); c2.fillStyle = Math.abs(z) > 2 ? '#ff4d6d' : '#5be38a'; c2.fillRect(X(b * BW), ym - (z > 0 ? z * k : 0), Math.max(1, bw - .5), Math.abs(z) * k); }
    }
    // подписи
    $('#fsaLegend').innerHTML = order.slice().reverse().map(k => {
      let s = 0, s0 = 0; for (let b = 0; b < NB; b++) { s += model(k, b); s0 += F.truth[k] * F.tpl[k][b]; }
      return '<span><i style="background:' + color(k) + '"></i><b>' + label(k) + '</b> <small>' + t('s4.true', Math.round(s0), Math.round(s)) + '</small></span>';
    }).join('');
    $('#fsaStat').innerHTML = '<span class="pill' + (F.chi < 1.5 ? ' good' : '') + '">' + t('s4.st', F.it, isFinite(F.chi) ? fx(F.chi, 2) : '—') + '</span>';
  }
  let last = 0;
  function loop(ts) {
    requestAnimationFrame(loop);
    if (!visible.get(cv)) return;
    if (F.ready && F.run && ts - last > (F.it < 40 ? 70 : 25)) {   // первые шаги медленно — видно, как растут слои
      last = ts; step(); if (F.it >= 400) F.run = false; draw();
    }
  }
  GUIDE.onRedraw(draw); draw(); requestAnimationFrame(loop);
})();

/* ── 5: активность — набор идёт, коридор сужается ── */
(function activity() {
  const cv = $('#cvActQ'), cvC = $('#cvActC'); io.observe(cv); io.observe(cvC);
  const Y_LINE = 0.851, D = Q.dims({ size: 6.3, gap: 1.0, src: 'jar' });
  const S0 = Q.runW(661.66, D, 3000, null, 1);
  let EPS = S0.fep / S0.n;                   // эффективность пика той же банки, что в шаге 2; уточняется в фоне до 30 000 историй
  Jobs.add('acteps', (function* () { while (S0.n < 30000) { Q.runW(661.66, D, 1500, null, 1, S0); EPS = S0.fep / S0.n; yield; } })());
  const A_of = v => Math.round(5 * Math.pow(1000 / 5, v / 1000));
  const st = { A: A_of(500), t: 0, N: 0, dec: 0, hist: [], fast: false, flashes: [] };
  const aSl = $('#actA');
  aSl.addEventListener('input', () => { st.A = A_of(+aSl.value); reset(); });
  $('#actReset').onclick = reset;
  $('#actFast').onclick = () => { st.fast = !st.fast; $('#actFast').textContent = t(st.fast ? 's5.slow' : 's5.fast'); };
  function reset() { st.t = 0; st.N = 0; st.dec = 0; st.hist = []; st.flashes = []; $('#actAv').textContent = st.A + (GUIDE.lang === 'ru' ? ' Бк' : ' Bq'); formula(); }
  function est() { if (st.N <= 0 || st.t <= 0) return null; const a = st.N / (st.t * EPS * Y_LINE), s = Math.sqrt(st.N) / (st.t * EPS * Y_LINE); return [a, s]; }
  let fTxt = '';
  function formula() {
    const e = est();
    const s = e ? t('s5.f', st.N, fx(st.t, 0), fx(EPS, 4), Y_LINE, fx(e[0], e[0] < 100 ? 1 : 0) + ' ± ' + fx(2 * e[1], e[1] < 50 ? 1 : 0) + (GUIDE.lang === 'ru' ? ' Бк (2σ)' : ' Bq (2σ)')) : t('s5.fnone');
    if (s !== fTxt) $('#actF').innerHTML = fTxt = s;
  }
  function tick() {
    const dt = st.fast ? 60 : 6;            // секунд набора за кадр
    const nDec = poisson(st.A * dt), nPk = poisson(st.A * dt * EPS * Y_LINE);
    st.t += dt; st.dec += nDec; st.N += nPk;
    // на экране — выборка: до пяти распадов-«промахов» и до двух фотонов, дошедших до пика; счётчики — все
    for (let i = 0; i < Math.min(nDec, 3); i++) st.flashes.push({ x: Math.random(), y: Math.random(), age: 0, hit: false });
    for (let i = 0; i < Math.min(nPk, 1); i++) st.flashes.push({ x: Math.random(), y: Math.random(), age: 0, hit: true });
    if (st.flashes.length > 80) st.flashes.splice(0, st.flashes.length - 80);   // не больше 80 вспышек на экране — иначе телефон не тянет
    st.flashes.forEach(f => f.age++); st.flashes = st.flashes.filter(f => f.age < 40);
    // точка коридора — не чаще, чем через 0.5 % времени: ось логарифмическая, это около пикселя; раньше за 9 минут
    // до сброса копилось 33000 точек, и каждый кадр перерисовывал их все (`AMBER254`)
    const e = est(), hl = st.hist[st.hist.length - 1]; if (e && (!hl || st.t >= hl[0] * 1.005)) st.hist.push([st.t, e[0], e[1]]);
    if (st.t > 2e5) reset();
  }
  function drawScene() {
    const { ctx, w, h } = setup(cv);
    const jx = w * 0.07, jw = w * 0.36, jy = h * 0.16, jh = h * 0.6, cx = w * 0.62, cw = w * 0.16, cy = h * 0.22, ch = h * 0.48;
    ctx.fillStyle = 'rgba(80,170,255,.16)'; ctx.strokeStyle = 'rgba(120,190,255,.7)'; ctx.lineWidth = 1.5; ctx.fillRect(jx, jy, jw, jh); ctx.strokeRect(jx, jy, jw, jh);
    const g = ctx.createLinearGradient(0, cy, 0, cy + ch); g.addColorStop(0, 'rgba(150,200,255,.45)'); g.addColorStop(1, 'rgba(110,160,255,.22)');
    ctx.fillStyle = '#0b1222'; ctx.fillRect(cx, cy, cw, ch); ctx.fillStyle = g; ctx.fillRect(cx, cy, cw, ch);
    ctx.fillStyle = '#3b4560'; ctx.fillRect(cx + cw, cy + ch * 0.06, w * 0.12, ch * 0.88);
    st.flashes.forEach(f => {
      const px = jx + f.x * jw, py = jy + f.y * jh, a = 1 - f.age / 40;
      ctx.fillStyle = 'rgba(255,190,80,' + 0.25 * a + ')'; ctx.beginPath(); ctx.arc(px, py, 8, 0, Math.PI * 2); ctx.fill();   // вспышка: два круга вместо градиента — дёшево
      ctx.fillStyle = 'rgba(255,235,140,' + a + ')'; ctx.beginPath(); ctx.arc(px, py, 2.6, 0, Math.PI * 2); ctx.fill();
      if (f.hit) {                          // фотон долетел и отдал всё — вспышка в кристалле
        const k = Math.min(1, f.age / 14), tx = cx + cw * (0.25 + 0.5 * f.y), ty = cy + ch * (0.15 + 0.7 * f.x);
        ctx.strokeStyle = eCol(662, a); ctx.lineWidth = 1.6; ctx.beginPath(); ctx.moveTo(px, py); ctx.lineTo(lerp(px, tx, k), lerp(py, ty, k)); ctx.stroke();
        if (k >= 1) { ctx.fillStyle = 'rgba(255,77,109,' + 0.3 * a + ')'; ctx.beginPath(); ctx.arc(tx, ty, 9, 0, Math.PI * 2); ctx.fill(); ctx.fillStyle = 'rgba(255,120,150,' + a + ')'; ctx.beginPath(); ctx.arc(tx, ty, 3, 0, Math.PI * 2); ctx.fill(); }
      } else {
        const ang = f.x * 6.283, k = Math.min(1, f.age / 22); ctx.strokeStyle = 'rgba(255,204,51,' + 0.35 * a + ')'; ctx.lineWidth = 1; ctx.beginPath(); ctx.moveTo(px, py); ctx.lineTo(px + Math.cos(ang) * 60 * k, py + Math.sin(ang) * 60 * k); ctx.stroke();
      }
    });
    ctx.font = '600 13px system-ui'; ctx.fillStyle = '#cdd8f3'; ctx.textAlign = 'center';
    ctx.fillText(t('s5.dec') + ': ' + st.dec, jx + jw / 2, jy + jh + 20);
    ctx.fillStyle = '#ff9fb2'; ctx.fillText(t('s5.pk') + ': ' + st.N, cx + cw / 2, cy + ch + 20);
    ctx.fillStyle = '#93a3c4'; ctx.font = '12px system-ui'; ctx.fillText('t = ' + fx(st.t, 0) + (GUIDE.lang === 'ru' ? ' с' : ' s'), w * 0.5, 16);
  }
  function drawConv() {
    const { ctx, w, h } = setup(cvC), bx = { l: 52, t: 14, r: w - 12, b: h - 24 };
    const X = scale('log', 6, 2e5, bx.l, bx.r), Y = scale('lin', 0, st.A * 2.4, bx.b, bx.t);
    axes(ctx, bx, X, Y, { xl: t('s5.ax'), yl: t('s5.ay'), xt: [10, 100, 1000, 1e4, 1e5] });
    const H = st.hist;
    if (H.length > 1) {
      ctx.beginPath(); H.forEach(([tt, a, s], i) => { const x = X(Math.max(tt, 6)), y = Y(Math.min(a + 2 * s, st.A * 2.4)); if (i) ctx.lineTo(x, y); else ctx.moveTo(x, y); });
      for (let i = H.length - 1; i >= 0; i--) { const [tt, a, s] = H[i]; ctx.lineTo(X(Math.max(tt, 6)), Y(Math.max(a - 2 * s, 0))); }
      ctx.closePath(); ctx.fillStyle = 'rgba(106,168,255,.28)'; ctx.fill();
      ctx.strokeStyle = '#6aa8ff'; ctx.lineWidth = 1.8; ctx.beginPath(); H.forEach(([tt, a], i) => { const x = X(Math.max(tt, 6)), y = Y(Math.min(a, st.A * 2.4)); if (i) ctx.lineTo(x, y); else ctx.moveTo(x, y); }); ctx.stroke();
    }
    ctx.strokeStyle = '#ffcc33'; ctx.setLineDash([6, 5]); ctx.lineWidth = 1.5; ctx.beginPath(); ctx.moveTo(bx.l, Y(st.A)); ctx.lineTo(bx.r, Y(st.A)); ctx.stroke(); ctx.setLineDash([]);
  }
  let afr = 0;
  function loop() {
    requestAnimationFrame(loop);
    if (!visible.get(cv) && !visible.get(cvC)) return;
    tick(); drawScene(); drawConv(); if (++afr % 6 === 0) formula();   // формула — текстом в DOM, хватит 10 раз в секунду
  }
  GUIDE.onRedraw(() => { $('#actAv').textContent = st.A + (GUIDE.lang === 'ru' ? ' Бк' : ' Bq'); formula(); drawScene(); drawConv(); $('#actFast').textContent = t(st.fast ? 's5.slow' : 's5.fast'); });
  reset(); requestAnimationFrame(loop);
})();

GUIDE.init();
</script>
