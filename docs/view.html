'lb.lead':'Главное окно со спектром Cs-137. Флажки над графиком — как бирки на образцах: имя нуклида у каждого найденного пика. Курсор ведёт с собой маленькую панель — что лежит в этом канале.',

'lb.l1':'<b>Вкладки документов</b> — каждый открытый файл; звёздочка — есть несохранённые изменения',

'lb.l5':'<b>Шкала Y</b> — здесь логарифмическая: 1·10⁶, 1·10⁵…',

'lb.f1':'<b>Имя на флажке — из набора.</b> Какие нуклиды подписывать, решает поле <span class="ui">Набор:</span> на панели «Обнаружение пиков».',
'lb.f2':'<b>«(неизвестный)» — не ошибка.</b> Это пик без линии в наборе: край Комптона, обратное рассеяние или нуклид вне набора.',
'lb.f3':'<b>Скрыть флажки — кнопкой с флажком</b> на полосе: <span class="ui">Скрыть обнаруженные пики</span>. Пики остаются в списке.',
'hoodtxt':'<li><b>Степень Y</b> рисует высоту как y<sup>1/POW</sup>: POW = 1 — та же линейная шкала, POW = 4 — по умолчанию. Логарифм начинается с 0.7 отсчёта, чтобы пустые каналы не уходили в минус бесконечность.</li><li><b>Фон к спектру</b> приводится отношением живых времён: фон × t<sub>спектр</sub>/t<sub>фон</sub>; вычтенные каналы ниже нуля обнуляются; фон в другой калибровке раскладывается по энергии.</li><li><b>Lc и Ld</b> — пороги Карри по фону полосы: Lc = k·√(B·(1 + t<sub>ф</sub>/t<sub>с</sub>))·t<sub>с</sub>/t<sub>ф</sub>, Ld = k² + 2·Lc, k = 1.645 для 95 % (уровень доверия — <span class="ui m">Инструменты → Настройки → График</span>).</li><li><b>Имп. в пике</b> — сумма над подложкой: прямая между краями выделения, но не ниже приведённого фона. <b>FWHM</b> — полувысота над этой прямой, вершина уточняется параболой по логарифму отсчётов; <b>центр</b> — центр масс ядра пика.</li><li><b>Ctrl+колесо</b> меняет масштаб X в 1.1 раза за щелчок, до 10 точек на канал; <b>1:1</b> — одна точка экрана на канал.</li>',

  const setView = (a, b) => { let wd = clamp(b - a, 8, NCH - 1); a = clamp(a, 0, NCH - 1 - wd); S.v0 = a; S.v1 = a + wd; draw(); };
  const all = () => setView(0, NCH - 1);
  const magnify = () => { if (S.s0 < 0) return; const s = Math.min(S.s0, S.s1), e = Math.max(S.s0, S.s1), pad = Math.max(2, (e - s) * 0.08); setView(s - pad, e + pad); };
  const zoom = f => { const mid = (S.v0 + S.v1) / 2, wd = (S.v1 - S.v0) / f; setView(mid - wd / 2, mid + wd / 2); };
  const pan = d => { const wd = S.v1 - S.v0; setView(S.v0 + d * wd * 0.1, S.v0 + d * wd * 0.1 + wd); };
  $('#bA').onclick = all; $('#bM').onclick = magnify; $('#bZi').onclick = () => zoom(1.1); $('#bZo').onclick = () => zoom(1 / 1.1);
  $('#bL').onclick = () => pan(-1); $('#bR').onclick = () => pan(1);
  $('#b11').onclick = () => { if (!G) return; const wd = G.bx.r - G.bx.l; setView(0, Math.min(NCH - 1, wd)); };
  const chAt = ev => { const r = cv.getBoundingClientRect(), x = ev.clientX - r.left; return { x, c: clamp(Math.round(G.X.inv(x)), 0, NCH - 1) }; };
  cv.addEventListener('pointerdown', ev => {
    if (!G || ev.button !== 0) return; cv.focus({ preventScroll: true }); const { x, c } = chAt(ev);
    if (x < G.bx.l) { S.s0 = S.s1 = -1; draw(); return; }
    if (ev.shiftKey && S.s0 >= 0) S.s1 = c; else { S.s0 = S.s1 = c; }
    S.drag = true; try { cv.setPointerCapture(ev.pointerId); } catch (e) { } draw();
  });
  cv.addEventListener('pointermove', ev => {
    if (!G) return; const { x, c } = chAt(ev);
    S.cur = (x >= G.bx.l && x <= G.bx.r && ev.pointerType === 'mouse') ? c : -1;
    if (S.drag) S.s1 = c; req();
  });
  const end = () => { S.drag = false; };
  cv.addEventListener('pointerup', end); cv.addEventListener('pointercancel', end);
  cv.addEventListener('pointerleave', () => { S.cur = -1; req(); });
  let over = false; cv.addEventListener('mouseenter', () => over = true); cv.addEventListener('mouseleave', () => over = false);
  function onKey(ev) {
    if (ev.ctrlKey || ev.altKey || ev.metaKey) return;
    if (ev.code === 'KeyA') { all(); ev.preventDefault(); } else if (ev.code === 'KeyM') { magnify(); ev.preventDefault(); }
  }
  cv.addEventListener('keydown', onKey);
  document.addEventListener('keydown', ev => { if (over && document.activeElement !== cv && !/INPUT|SELECT|TEXTAREA/.test(document.activeElement.tagName)) onKey(ev); });
  cv.addEventListener('wheel', ev => {
    if (ev.ctrlKey) { ev.preventDefault(); zoom(ev.deltaY < 0 ? 1.1 : 1 / 1.1); }
    else if (ev.shiftKey || Math.abs(ev.deltaX) > Math.abs(ev.deltaY)) { ev.preventDefault(); pan((ev.deltaY || ev.deltaX) > 0 ? 1 : -1); }
  }, { passive: false });
  sync();
  // начальное выделение не ставится: человек протягивает сам
  io.observe(cv); GUIDE.onRedraw(() => { sync(); draw(); });
})();

GUIDE.Q.heroAnim(document.getElementById('cvHero'), document.getElementById('heroStat'));   // заставка с квантами, как на главной (`AMBER246`)
GUIDE.init();
</script>
