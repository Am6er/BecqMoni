.wp .pr{display:grid;grid-template-columns:62px minmax(0,1fr) 74px;gap:6px;align-items:center}

.pbar span{position:absolute;inset:0;display:grid;place-items:center;font-size:12px;white-space:nowrap}
.wp .btns{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:7px}
.wp .btns b{display:inline-block;width:9px;height:9px;border-radius:50%;background:#e00;margin-right:5px}
.wp .grid{display:grid;grid-template-columns:auto minmax(0,1fr) auto minmax(0,1fr);gap:5px 6px;align-items:center;margin-top:9px}

.wp .dlg .b{background:#f0f0f0;padding:7px 9px;display:flex;justify-content:flex-end;gap:7px}

'c.warn':'<b>«Сброс» стирает и прибор.</b> У Atom Spectra, RadiaCode и Obsidian вместе со спектром обнуляется накопитель в самом приборе — набранное там тоже пропадёт. Программа спросит «Очистить спектр?»: подумайте, прежде чем ответить «Да». У AtomSpectra TCP/REST «Сброс» стирает спектр на плате: в режиме REST программа сначала покажет, сколько на плате набрано, и переспросит («Нет» — по умолчанию), а при «Только наблюдении» плату не трогает; в режиме TCP команда сброса уходит сразу — переспрос только тогда, когда программа присоединилась к чужому набору, а без связи сброс уйдёт при следующем подключении. Если программа присоединилась к чужому набору, а запись уже остановлена, «Сброс» очищает только документ, а плату сбросит следующий «Старт»; набрала плата за это время ещё — «Старт» сначала спросит.',
'c.joined':'<b>«Стоп» чужого набора сначала спросит.</b> Если «Старт» лишь присоединился к набору, уже шедшему на плате AtomSpectra TCP/REST, то «Стоп», удаление спектра и закрытие документа спросят: '+UI('Остановить измерение на плате')+' или '+UI('Не останавливать')+' (по умолчанию — плата считает дальше). Остановка по лимиту ничего не спрашивает: присоединённый набор плата продолжает. Закрытие всей программы отсоединяется от платы, не останавливая её, — свой набор плата тоже продолжит.',
'c.info':'<b>Кнопка ⟳ у «Устройства»</b> применяет конфигурацию прибора к текущему спектру: калибровки и настройки поиска пиков заменятся приборными, фон — фоном по умолчанию со вкладки «Ссылки» (выбранный на панели пропадёт), а при другом числе каналов спектр будет стёрт — программа предупредит. То же — при выборе другого прибора в списке «Устройство».',

'hoodtxt':'<li>«Старт» не начинает набор, если реальное время уже не меньше лимита, — и говорит почему («Измерение уже достигло лимита времени…»): поднимите лимит или нажмите «Сброс». Отрицательный лимит даёт «Некорректное предустановленное время.»</li><li><code>Мерт. Время % = 100·(T − LT)/T</code>; цифры до 20 % обычные, 20–50 % тёмно-оранжевые, больше 50 % тёмно-красные. Живое время <code>LT = T·(1 − n·τ)</code>, n — все импульсы за реальное время.</li><li>«Скор. счёта имп/с» на панели — корректные импульсы, делённые на реальное время; активность и FSA делят на живое.</li><li>Фон вычитается с масштабом по живым временам (<code>фон × LT образца / LT фона</code>), отрицательные каналы обнуляются, при разной калибровке фон переводится по энергии.</li><li>Автосохранение раз в N минут пишет только документы с включённым автосохранением, в которых идёт набор и есть изменения; «Стоп» тоже сохраняет такой документ. «Сброс» у Atom Spectra, RadiaCode и Obsidian очищает и накопитель прибора — если этот прибор не пишет в этот миг другой спектр.</li><li>«Заменить спектр документа» у AtomSpectra TCP/REST кладёт в документ тот спектр, время и число импульсов платы, которые были показаны в вопросе, сразу на «Старте»; плату не сбрасывает: считающей ничего не посылает, стоящей — только <code>-sta</code>. Если плату сбросят, пока открыт вопрос, первый же снимок покажет это как сброс, и в документе останется спектр из вопроса. При сохранении файл документа перезаписывается — прежний спектр сначала сохраните под другим именем.</li>',

'c.warn':'<b>“Clear” wipes the device too.</b> For Atom Spectra, RadiaCode and Obsidian the buffer inside the device is reset along with the spectrum — whatever it collected is lost as well. The program asks “Clear spectrum?”: think before answering “Yes”. For AtomSpectra TCP/REST “Clear” wipes the spectrum on the board: in REST mode the program first shows how much the board holds and asks again (“No” is the default), and with “Observe only” it leaves the board alone; in TCP mode the reset command goes at once — it asks again only when the program joined someone else’s acquisition, and with no link the reset goes at the next connection. When the program joined someone else’s acquisition and recording is already stopped, “Clear” clears only the document and the next “Start” resets the board; if the board has counted more meanwhile, “Start” asks first.',
'c.joined':'<b>Stopping someone else’s acquisition asks first.</b> When “Start” only joined an acquisition already running on an AtomSpectra TCP/REST board, “Stop”, deleting the spectrum and closing the document ask: '+UI('Stop the acquisition on the board')+' or '+UI('Don\'t stop')+' (the default — the board keeps counting). A stop at the limit asks nothing: the board goes on with a joined acquisition. Closing the whole program detaches from the board without stopping it — the board goes on with its own acquisition too.',

/* ── общие спектральные формы: Cs-137 и фон, сцинтиллятор ~7 % при 662 кэВ ── */
const SIG = E => 0.07 * 662 * Math.sqrt(Math.max(E, 20) / 662) / 2.355;
const gs = (e, E, a) => a * Math.exp(-0.5 * ((e - E) / SIG(E)) ** 2) / (SIG(E) * 2.5066);
function shapeCs(e) {   // на 1 распознанный импульс источника
  const ce = 477.3, s = SIG(ce);
  return gs(e, 661.66, 0.36) + 0.5 / 470 * (1 / (1 + Math.exp((e - ce) / (0.6 * s)))) * (0.55 + 0.45 * e / ce) * (e > 15 ? 1 : 0) + gs(e, 190, 0.045) + gs(e, 32, 0.07);
}
function shapeBg(e) {
  return 0.55 * Math.exp(-e / 160) / 160 + 0.25 * Math.exp(-e / 700) / 700 + gs(e, 1460.8, 0.035) + gs(e, 609.3, 0.03) + gs(e, 351.9, 0.022) + gs(e, 295.2, 0.012) + gs(e, 2614.5, 0.012) + gs(e, 1764.5, 0.008) + gs(e, 1120.3, 0.006) + gs(e, 75, 0.03) + gs(e, 238.6, 0.012);
}
function pdf(f, nch, emax) { const p = new Float64Array(nch); let s = 0; for (let c = 0; c < nch; c++) { const e = (c + 0.5) * emax / nch; p[c] = Math.max(0, f(e)); s += p[c]; } for (let c = 0; c < nch; c++) p[c] /= s; return p; }

/* ── 1. симулятор набора ── */
(function sim() {

  const S = { hist: new Float64Array(NCH), T: 0, val: 0, inv: 0, run: false, preset: 600, file: '', auto: false, dev: 0, speed: 100, dateFmt: true, msgs: [], dlg: false, last: 0 };
  const cv = $('#cvSim'); io.observe(cv);
  const src = () => +$('#sSrc').value === 0 ? 0 : Math.pow(10, +$('#sSrc').value);
  function devs() { $('#pDev').innerHTML = DEVS.map((d, i) => '<option value="' + i + '">' + (d[0][0] === '@' ? t(d[0].slice(1)) : d[0]) + ' · τ ' + sig(d[1] * 1e6, 3) + ' ' + t('s.us') + '</option>').join(''); $('#pDev').value = S.dev; }
  $('#pDev').onchange = () => { S.dev = +$('#pDev').value; ui(); };
  function speeds() { $('#sSpeed').innerHTML = [1, 10, 100, 1000].map(v => '<button class="chip' + (v === S.speed ? ' on' : '') + '" data-v="' + v + '">× ' + v + '</button>').join(''); $$('#sSpeed .chip').forEach(b => b.onclick = () => { S.speed = +b.dataset.v; speeds(); }); }
  speeds();
  const tau = () => DEVS[S.dev][1];
  function times() { const tot = S.val + S.inv, lt = S.T > 0 ? Math.max(0, S.T * (1 - (tot / S.T) * tau())) : 0; return { tot, lt, dt: S.T > 0 && lt > 0 ? 100 * (S.T - lt) / S.T : 0 }; }
  function fmtT(sec) { const s = Math.floor(sec), d = Math.floor(s / 86400), p2 = v => String(v).padStart(2, '0'), hms = p2(Math.floor(s % 86400 / 3600)) + ':' + p2(Math.floor(s % 3600 / 60)) + ':' + p2(s % 60); return d > 0 ? d + t('p.days') + ' ' + hms : hms; }
  function msg(k, cls, ...a) { S.msgs = S.msgs.filter(m => m.k !== k); S.msgs.unshift({ k, cls, a }); S.msgs = S.msgs.slice(0, 4); }
  function step(dt) {
    if (!S.run) return;
    let d = dt * S.speed; if (S.T + d >= S.preset) d = S.preset - S.T;
    if (d > 0) {
      const m = BG + src(), n = m / (1 + m * tau()), lamV = n * d * 0.9994;
      for (let c = 0; c < NCH; c++) { const k = poisson(lamV * (BG * PB[c] + src() * PS[c]) / m); S.hist[c] += k; S.val += k; }

    }

      S.run = false; msg('done', '', S.preset);
      if (S.auto && S.file) msg('saved', 'good', S.file);
      msg('sound', '');
    }
  }
  function peakSnr(E) {   // окно пика против соседних окон — «проступил ли пик»
    const ch = e => Math.round(e / EMAX * NCH), w = 2.2 * SIG(E), a = ch(E - w), b = ch(E + w), L = ch(E - 2 * w), R = ch(E + 2 * w);
    let P = 0, side = 0; for (let c = a; c <= b; c++) P += S.hist[c]; for (let c = L; c < a; c++) side += S.hist[c]; for (let c = b + 1; c <= R; c++) side += S.hist[c];
    const bk = side * (b - a + 1) / Math.max(1, (a - L) + (R - b)); return P > 0 ? (P - bk) / Math.sqrt(P + bk) : 0;
  }
  function draw() {
    const { ctx, w, h } = setup(cv), bx = { l: 46, t: 18, r: w - 12, b: h - 26 };
    const X = scale('lin', 0, EMAX, bx.l, bx.r); let mx = 10; for (let c = 3; c < NCH; c++) mx = Math.max(mx, S.hist[c]);
    const Y = scale('sqrt', 0, mx * 1.12, bx.b, bx.t);
    axes(ctx, bx, X, Y, { xl: t('ax.e'), yl: t('ax.c') });
    ctx.beginPath(); ctx.moveTo(X(0), bx.b); for (let c = 0; c < NCH; c++) { const x0 = X(c * EMAX / NCH), x1 = X((c + 1) * EMAX / NCH), y = Y(S.hist[c]); ctx.lineTo(x0, y); ctx.lineTo(x1, y); } ctx.lineTo(X(EMAX), bx.b); ctx.closePath();
    const g = ctx.createLinearGradient(0, bx.t, 0, bx.b); g.addColorStop(0, 'rgba(32,200,64,.95)'); g.addColorStop(1, 'rgba(32,200,64,.35)'); ctx.fillStyle = g; ctx.fill();
    if (S.val === 0) { ctx.fillStyle = '#93a3c4'; ctx.font = '600 15px system-ui'; ctx.textAlign = 'center'; ctx.fillText(t('s.empty'), (bx.l + bx.r) / 2, (bx.t + bx.b) / 2); }
    ctx.font = '700 11.5px system-ui'; ctx.textAlign = 'center';
    [[661.66, 'Cs-137', '#FFCC77'], [1460.8, 'K-40', '#CCDD00'], [609.3, 'Bi-214', '#7fbf3f']].forEach(([E, nm, col]) => {
      const z = peakSnr(E); if (z < 5) return; const c = Math.round(E / EMAX * NCH); let top = 0; for (let k = c - 3; k <= c + 3; k++) top = Math.max(top, S.hist[k]);
      const x = X(E), y = Math.max(bx.t + 14, Y(top) - 10); ctx.strokeStyle = rgba(col, .7); ctx.setLineDash([3, 3]); ctx.beginPath(); ctx.moveTo(x, y + 3); ctx.lineTo(x, bx.b); ctx.stroke(); ctx.setLineDash([]); ctx.fillStyle = col; ctx.fillText(nm, x, y);
      if (!S.msgs.some(m => m.k === 'peak' + nm)) { S.msgs.push({ k: 'peak' + nm, cls: 'good', a: [nm], peak: true }); }

  }
  function ui() {
    const tm = times(), pct = S.preset > 0 ? clamp(S.T / S.preset * 100, 0, 100) : (S.T > 0 ? 100 : 0);
    $('#pBar i').style.width = pct.toFixed(1) + '%';
    $('#pBar span').textContent = (S.dateFmt ? fmtT(S.T) : Math.floor(S.T)) + ' (' + fx(pct, 1) + '%)';
    $('#pFile').value = S.file; $('#pAuto').checked = S.auto; $('#pDev').value = S.dev; $('#pDev').disabled = S.run;
    $('#pStart').disabled = S.run; $('#pStop').disabled = !S.run; $('#pPreset').disabled = S.run;
    $('#oTot').textContent = tm.tot.toFixed(0); $('#oVal').textContent = S.val.toFixed(0); $('#oInv').textContent = S.inv.toFixed(0);
    $('#oCps').textContent = fx(S.T > 0 ? S.val / S.T : 0, 2); $('#oLt').textContent = fx(tm.lt, 2); $('#oDt').textContent = fx(tm.dt, 4);
    $('#oDt').style.color = tm.dt <= 20 ? '#000' : tm.dt <= 50 ? '#ff8c00' : '#8b0000'; $('#oDt').style.fontWeight = tm.dt > 20 ? '700' : '400';
    const sv = src(); $('#sSrcV').textContent = sv ? fx(sv, sv < 100 ? 1 : 0) + ' ' + t('s.cps') : t('s.none');
    const dtk = tm.dt <= 20 ? ['good', 'r.dt0'] : tm.dt <= 50 ? ['', 'r.dt1'] : ['bad', 'r.dt2'];
    setHtml($('#sRes'), S.msgs.map(m => '<span class="pill ' + m.cls + '">' + (m.peak ? t('r.peak', m.a[0]) : t('r.' + m.k, ...m.a)) + '</span>').join('') + (S.T > 0 ? '<span class="pill ' + dtk[0] + '">' + t(dtk[1]) + '</span>' : ''));
    // окно «Да/Нет» пересобирается, только когда меняется его текст: пересборка между нажатием и отпусканием мыши терял щелчок (`AMBER254`)
    if (setHtml($('#pDlg'), S.dlg ? '<div class="dlg"><div class="t">' + t('p.q') + '</div><div class="m"><i>!</i><span>' + t('p.qtext') + '</span></div><div class="b"><button data-a="yes">' + t('p.yes') + '</button><button data-a="no">' + t('p.no') + '</button></div></div>' : ''))
      $$('#pDlg button').forEach(b => b.onclick = () => { S.dlg = false; if (b.dataset.a === 'yes') { S.run = false; S.hist.fill(0); S.T = 0; S.val = 0; S.inv = 0; S.msgs = []; msg('cleared', 'bad'); } ui(); draw(); });
  }
  function setHtml(el, s) { if (el._html === s) return false; el._html = s; el.innerHTML = s; return true; }
  $('#pStart').onclick = () => { if (S.preset < 0) { msg('bad', 'bad'); ui(); return; } if (S.T >= S.preset) { msg('nostart', 'bad', S.preset); ui(); return; } S.run = true; S.msgs = S.msgs.filter(m => m.k !== 'done' && m.k !== 'saved' && m.k !== 'sound' && m.k !== 'nostart'); S.last = performance.now(); ui(); };

})();

/* ── 3. фон: масштаб по живым временам и шум вычитания ── */
(function bgsub() {
  const NCH = 512, EMAX = 3000, TS = 3600, PS = pdf(shapeCs, NCH, EMAX), PB = pdf(shapeBg, NCH, EMAX), RB = 30, RS = 3;   // фон 30 имп/с, источник 3 имп/с
  let view = 2, gross, bgc, TB;
  const cv = $('#cvBg'), r = $('#bT');
  function acquire() { TB = Math.round(Math.pow(10, +r.value)); gross = Float64Array.from(PB, (p, c) => poisson(TS * (RB * p + RS * PS[c]))); bgc = Float64Array.from(PB, p => poisson(TB * RB * p)); }
  function chips() { $('#bView').innerHTML = ['b.v1', 'b.v2', 'b.v3'].map((k, i) => '<button class="chip' + (i === view ? ' on' : '') + '" data-i="' + i + '">' + t(k) + '</button>').join(''); $$('#bView .chip').forEach(b => b.onclick = () => { view = +b.dataset.i; chips(); draw(); }); }
  const fmtT = s => s >= 3600 ? fx(s / 3600, s >= 36000 ? 0 : 1) + ' ' + t('b.h1') : s + ' ' + t('b.s');
  function draw() {
    const k = TS / TB, net = new Float64Array(NCH); let zeroed = 0;
    for (let c = 0; c < NCH; c++) { const v = gross[c] - bgc[c] * k; if (v < 0) zeroed++; net[c] = Math.max(0, v); }
    const { ctx, w, h } = setup(cv), bx = { l: 46, t: 16, r: w - 12, b: h - 26 }, X = scale('lin', 0, EMAX, bx.l, bx.r);
    let mx = 10; for (let c = 4; c < NCH; c++) mx = Math.max(mx, view === 2 ? net[c] : gross[c]);
    const Y = scale('sqrt', 0, mx * 1.1, bx.b, bx.t);
    axes(ctx, bx, X, Y, { xl: t('ax.e'), yl: t('ax.c') });
    const path = (arr, mul, fill, stroke) => { ctx.beginPath(); ctx.moveTo(X(0), bx.b); for (let c = 0; c < NCH; c++) { const y = Y(arr[c] * mul); ctx.lineTo(X(c * EMAX / NCH), y); ctx.lineTo(X((c + 1) * EMAX / NCH), y); } ctx.lineTo(X(EMAX), bx.b); ctx.closePath(); if (fill) { ctx.fillStyle = fill; ctx.fill(); } if (stroke) { ctx.strokeStyle = stroke; ctx.lineWidth = 1.2; ctx.stroke(); ctx.lineWidth = 1; } };
    // цвета — как в Настройках → Цвет: образец зелёный, фон бирюзовый, вычтенный фиолетовый
    if (view === 2) path(net, 1, 'rgba(140,60,255,.75)');
    else { path(gross, 1, 'rgba(32,200,64,.85)'); if (view === 1) path(bgc, k, 'rgba(0,150,150,.85)'); }
    ctx.font = '600 11.5px system-ui'; ctx.textAlign = 'left';
    const leg = view === 2 ? [['#8c3cff', 'b.netl']] : view === 1 ? [['#20c840', 'b.gross'], ['#009696', 'b.bgl']] : [['#20c840', 'b.gross']];
    leg.forEach(([col, key], i) => { ctx.fillStyle = col; ctx.fillRect(bx.r - 160, bx.t + 4 + i * 16, 10, 10); ctx.fillStyle = '#cdd8f3'; ctx.fillText(t(key), bx.r - 145, bx.t + 13 + i * 16); });
    ctx.fillStyle = '#FFCC77'; ctx.textAlign = 'center'; ctx.fillText('Cs-137', X(661.66), bx.t + 10); ctx.fillStyle = '#CCDD00'; ctx.fillText('K-40', X(1460.8), bx.t + 10);
    // окна: Cs-137 и K-40 — сумма разности и её σ
    const win = E => { const a = Math.floor((E - 2.2 * SIG(E)) / EMAX * NCH), b = Math.ceil((E + 2.2 * SIG(E)) / EMAX * NCH); let G = 0, B = 0; for (let c = a; c <= b; c++) { G += gross[c]; B += bgc[c]; } return { n: G - k * B, s: Math.sqrt(G + k * k * B) }; };
    const cs = win(661.66), kk = win(1460.8);
    $('#bTv').textContent = fmtT(TB);
    $('#bRes').innerHTML = '<span class="pill">' + t('b.ratio', fx(k, k < 10 ? 2 : 1)) + '</span><span class="pill good">' + t('b.net', fx(cs.n, 0), fx(cs.s, 0)) + '</span><span class="pill ' + (Math.abs(kk.n) > 2 * kk.s ? 'bad' : '') + '">' + t('b.k40', fx(kk.n, 0) + ' ± ' + fx(kk.s, 0)) + '</span><span class="pill">' + t('b.zero', zeroed) + '</span>';

  $('#bAgain').onclick = () => { acquire(); draw(); };

/* ── 4. калькулятор: вес, объём, дата отбора ── */
(function calc() {
  const NUC = [['I-131', 8.0252], ['Cs-134', 754.3], ['Cs-137', 10983]];   // периоды полураспада, сут

    $('#kUnit').innerHTML = [['g', t('k.ug')], ['kg', t('k.ukg')]].map(([u, l]) => '<button class="chip' + (u === unit ? ' on' : '') + '" data-u="' + u + '">' + l + '</button>').join('');
    $$('#kNuc .chip').forEach(b => b.onclick = () => { nuc = +b.dataset.i; chips(); calc(); });

  function calc() {
    const A = +$('#kA').value, wv = +$('#kW').value, vv = +$('#kV').value, d = +$('#kD').value, en = GUIDE.lang === 'en';

    $('#kAv').textContent = A + (en ? ' Bq' : ' Бк');
    $('#kWv').textContent = wv === 0 ? t('k.none') : unit === 'g' ? wv + (en ? ' g' : ' г') : fx(wv / 1000, 3) + (en ? ' kg' : ' кг');
    $('#kVv').textContent = vv === 0 ? t('k.none') : unit === 'g' ? vv + (en ? ' ml' : ' мл') : fx(vv / 1000, 3) + (en ? ' l' : ' л');
    $('#kDv').textContent = d + ' ' + t('k.days');
    const f = Math.pow(2, d / NUC[nuc][1]);
    const tile = (k, v) => '<div class="tile"><div class="small">' + t(k) + '</div><div class="big">' + v + '</div></div>';
    $('#kTiles').innerHTML = tile('k.bqkg', wv ? sig(A / wkg, 3) : '—') + tile('k.bql', vv ? sig(A / (vv / 1000), 3) : '—') + tile('k.samp', sig(A * f, 3));
    $('#kRes').innerHTML = '<span class="pill">' + t('k.f', fx(f, f < 10 ? 3 : 1)) + '</span><span class="pill ' + (f > 1.5 ? 'bad' : 'good') + '">' + t(f > 1.5 ? 'k.short' : 'k.long') + '</span>';

  ['#kA', '#kW', '#kV', '#kD'].forEach(s => $(s).addEventListener('input', calc));
  GUIDE.onRedraw(() => { chips(); calc(); });
})();

GUIDE.Q.heroAnim(document.getElementById('cvHero'), document.getElementById('heroStat'));   // заставка с квантами, как на главной (`AMBER246`)
GUIDE.init();
</script>
