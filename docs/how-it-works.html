<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>BecqMoni — как это работает</title>
<script src="assets/theme.js?v=53cbbd2b"></script>
<meta name="description" content="Геометрия, кривые эффективности, матрица отклика, режим FSA и расчёт активности в BecqMoni — наглядно и интерактивно.">
<!--
  Самодостаточная страница: ни шрифтов, ни библиотек из сети. Всё, что движется, считается здесь же:
  перенос фотонов Монте-Карло в цилиндре NaI(Tl) по сечениям XCOM из matdb.sqlite приложения.
  Настоящие разборы FSA — дамп витрины tools/fsa_showcase (FsaStackShot), 07.11.2026, база rev53.
  Числа печатаются с точкой и без группировки разрядов (правило репозитория).
-->
<style>
:root{
  --bg:#090d18;--bg2:#0e1424;--panel:#131b2f;--panel2:#1a2440;--line:#25304d;
  --ink:#eef3ff;--soft:#cdd8f3;--muted:#93a3c4;--dim:#6a7899;
  --gold:#ffcc33;--photo:#ff4d6d;--compton:#ffd166;--pair:#c38bff;--esc:#4dd0e1;--ok:#5be38a;--blue:#6aa8ff;
  --r:18px;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{margin:0;color:var(--ink);font:16px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  background:radial-gradient(1200px 620px at 85% -8%,rgba(106,168,255,.13),transparent 60%),
             radial-gradient(900px 520px at -12% 8%,rgba(255,77,109,.10),transparent 60%),var(--bg)}
a{color:var(--blue)}
.wrap{max-width:1180px;margin:0 auto;padding:0 20px}
header.top{position:sticky;top:0;z-index:30;background:rgba(9,13,24,.84);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
header.top .wrap{display:flex;align-items:center;gap:12px;height:56px}
.brand{font-weight:800;white-space:nowrap;text-decoration:none;color:var(--ink);font-size:17px}
.brand span{color:var(--goldink)}
.brand small{font-weight:500;color:var(--muted);margin-left:6px;font-size:13.5px}
nav.steps{display:flex;gap:2px;margin-left:auto;overflow-x:auto;scrollbar-width:none;min-width:0}
nav.steps::-webkit-scrollbar{display:none}
nav.steps a{color:var(--muted);text-decoration:none;font-size:14px;padding:6px 10px;border-radius:999px;white-space:nowrap;transition:background .2s,color .2s}
nav.steps a b{display:inline-grid;place-items:center;width:20px;height:20px;border-radius:50%;background:var(--panel2);color:var(--soft);font-size:11px;margin-right:6px}
nav.steps a.on,nav.steps a:hover{color:var(--ink);background:var(--panel)}
nav.steps a.on b{background:var(--gold);color:#1a1300}
.lang{display:flex;border:1px solid var(--line);border-radius:999px;overflow:hidden;flex:none}
.lang button{background:none;border:0;color:var(--muted);font-family:inherit;font-weight:700;font-size:12.5px;padding:7px 10px;cursor:pointer}
.lang button.on{background:var(--gold);color:#1a1300}
section.sec{padding:72px 0 60px;border-top:1px solid var(--line)}
section.hero{padding:46px 0 54px}
.kicker{font-size:12.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--goldink);font-weight:800}
h1{font-size:clamp(31px,5vw,56px);line-height:1.06;margin:10px 0 14px;letter-spacing:-.01em;max-width:960px}
h1 em{font-style:normal;background:linear-gradient(90deg,#ffcc33,#ff6b8b 55%,#9c8bff);-webkit-background-clip:text;background-clip:text;color:transparent}
h2{font-size:clamp(25px,3.3vw,40px);line-height:1.12;margin:8px 0 12px}
h3{font-size:16.5px;margin:0 0 8px;color:var(--soft);font-weight:700}
.lead{font-size:clamp(16.5px,1.5vw,19px);color:var(--soft);max-width:840px;margin:0}
.lead b{color:var(--ink)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:24px}
.grid2.wl{grid-template-columns:1.18fr .82fr}
.card{background:linear-gradient(180deg,var(--panel),var(--bg2));border:1px solid var(--line);border-radius:var(--r);padding:14px 14px 12px;min-width:0}
.card.full{margin-top:16px}
canvas.cv{display:block;width:100%;height:330px;border-radius:12px;background:#060912;touch-action:pan-y}
canvas.cv.tall{height:390px}
canvas.cv.mid{height:290px}
canvas.cv.short{height:210px}
canvas.cv.strip{height:74px;margin-top:6px}
.cv.oxc{height:440px;margin-top:10px}
.oxrow{margin-top:6px}.oxrow .lbl{min-width:170px}
.oxtxt h4{margin:12px 0 4px;font-size:17px}
.oxtxt p{margin:5px 0;color:var(--soft);max-width:900px}
.oxtxt p b{color:var(--ink)}
.row{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;margin-top:10px}
.lbl{font-size:13px;color:var(--muted)}
.val{font-variant-numeric:tabular-nums;font-weight:800;color:var(--ink)}
.btn{background:var(--panel2);border:1px solid #34426b;color:var(--ink);border-radius:10px;padding:8px 13px;font-family:inherit;font-size:14px;font-weight:700;cursor:pointer;transition:border-color .15s,filter .15s}
.btn:hover{border-color:var(--gold)}
.btn.main{background:var(--gold);border-color:var(--gold);color:#1a1300}
.btn.main:hover{filter:brightness(1.08)}
.btn:disabled{opacity:.45;cursor:default}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{background:transparent;border:1px solid #34426b;color:var(--soft);border-radius:999px;padding:6px 11px;font-family:inherit;font-size:13.5px;cursor:pointer}
.chip.on{background:var(--soft);color:#0b1020;border-color:var(--soft);font-weight:800}
input[type=range]{accent-color:var(--gold);width:190px;max-width:100%}
.sw{display:inline-flex;align-items:center;gap:8px;font-size:14px;color:var(--soft);cursor:pointer;user-select:none}
.sw input{accent-color:var(--gold);width:16px;height:16px}
.facts{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:16px}
.fact{background:var(--panel);border:1px solid var(--line);border-left:4px solid var(--c,var(--gold));border-radius:12px;padding:11px 13px;font-size:15px;color:var(--soft)}
.fact b{color:var(--ink)}
details.hood{margin-top:14px;border:1px dashed #35446d;border-radius:12px;padding:10px 14px;background:rgba(19,27,47,.45)}
details.hood summary{cursor:pointer;color:var(--muted);font-weight:700;font-size:14px}
details.hood ul{margin:8px 0 2px;padding-left:18px;color:var(--soft);font-size:14.5px}
details.hood li{margin:3px 0}
details.hood code{font-size:13px;color:#ffe08a}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:10px}
.tile{background:var(--panel2);border-radius:12px;padding:9px 12px}
.tile .big{font-size:27px;font-weight:800;line-height:1.1;font-variant-numeric:tabular-nums}
.tile .small{font-size:12.5px;color:var(--muted)}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:13px;color:var(--soft);margin-top:8px}
.legend i{display:inline-block;width:11px;height:11px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.legend .it{cursor:pointer;user-select:none}
.legend .it.off{opacity:.35;text-decoration:line-through}
.legend .it small{color:var(--muted);margin-left:4px}
.note{font-size:13px;color:var(--dim);margin-top:8px}
.sliders{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px 18px;margin-top:10px}
.sl{display:flex;flex-direction:column;gap:2px;min-width:0}
.sl .top{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-size:13.5px;color:var(--soft)}
.sl .top i{width:10px;height:10px;border-radius:3px;display:inline-block;margin-right:6px}
.sl input{width:100%}
.sl.dis{opacity:.4;pointer-events:none}
.pills{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.pill{background:var(--panel2);border-radius:999px;padding:5px 11px;font-size:13.5px;color:var(--soft)}
.pill b{color:var(--ink)}
.pill.good{background:rgba(91,227,138,.15);color:#bff5d2}
.pill.bad{background:rgba(255,77,109,.15);color:#ffc2cf}
.chain{display:grid;grid-template-columns:repeat(6,1fr);gap:10px;margin-top:26px}
.node{position:relative;background:linear-gradient(180deg,var(--panel2),var(--panel));border:1px solid var(--line);border-radius:16px;padding:14px 12px 12px;text-decoration:none;color:var(--ink);transition:transform .2s,border-color .2s}
.node:hover{transform:translateY(-3px);border-color:var(--gold)}
.node svg{width:42px;height:42px;display:block;margin-bottom:8px}
.node b{display:block;font-size:15px}
.node span{display:block;font-size:12.5px;color:var(--muted);margin-top:3px}
.node:not(:last-child)::after{content:"";position:absolute;right:-9px;top:50%;width:8px;height:8px;border-top:2px solid var(--gold);border-right:2px solid var(--gold);transform:translateY(-50%) rotate(45deg);z-index:2}
.minichain{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}
.minichain a{display:flex;align-items:center;gap:8px;text-decoration:none;color:var(--soft);background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:6px 13px 6px 7px;font-size:14px}
.minichain a:hover{border-color:var(--gold);color:var(--ink)}
.minichain a b{display:inline-grid;place-items:center;width:24px;height:24px;border-radius:50%;background:var(--gold);color:#1a1300;font-size:12px}
.eq{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin-top:12px;font-size:15px}
.eq .box{background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:8px 12px;text-align:center;min-width:92px}
.eq .box b{display:block;font-size:20px;font-variant-numeric:tabular-nums}
.eq .box small{color:var(--muted);font-size:12px}
.eq .op{font-size:22px;color:var(--goldink);font-weight:800}
.tip{position:fixed;pointer-events:none;z-index:50;background:rgba(10,14,26,.95);border:1px solid #3a4874;border-radius:10px;padding:8px 10px;font-size:12.5px;color:var(--soft);min-width:150px;display:none;box-shadow:0 8px 28px rgba(0,0,0,.45)}
.tip b{color:var(--ink)}
.tip i{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:6px}
footer{padding:36px 0 60px;color:var(--dim);font-size:13.5px;border-top:1px solid var(--line)}
.tocl{display:inline-flex;align-items:center;gap:6px;background:var(--panel);border:1px solid var(--line);color:var(--ink);border-radius:999px;padding:6px 12px;font-size:14px;font-weight:700;text-decoration:none;white-space:nowrap}
.tocl:hover{border-color:var(--gold)}
.tocl b{color:var(--goldink)}
.gpager{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin:30px 0 0}
.gpager a{display:block;text-decoration:none;color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px 16px}
.gpager a:hover{border-color:var(--gold)}
.gpager a small{display:block;color:var(--muted);font-size:12.5px}
.gpager a.next{text-align:right}
@media (max-width:560px){.gpager{grid-template-columns:1fr}.tocl span{display:none}}
@media (max-width:980px){.chain{grid-template-columns:repeat(3,1fr)}.node:nth-child(3)::after{display:none}}
@media (max-width:900px){
  .grid2,.grid2.wl{grid-template-columns:1fr}.facts,.tiles{grid-template-columns:1fr}
  canvas.cv{height:270px}canvas.cv.tall{height:430px}canvas.cv.mid{height:250px}canvas.cv.oxc{height:640px}.oxrow .lbl{min-width:0;width:100%}
  nav.steps a span{display:none}nav.steps a b{margin-right:0}
  .brand small{display:none}
}
@media (max-width:560px){.chain{grid-template-columns:1fr 1fr}.node::after{display:none}.wrap{padding:0 16px}header.top .wrap{gap:6px}nav.steps a{padding:6px 3px}}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}}
/* ── переключатель темы и дневная тема (`AMBER258`; то же, что в assets/guide.css) ── */
.theme{display:flex;border:1px solid var(--line);border-radius:999px;overflow:hidden;flex:none}
.theme button{display:grid;place-items:center;background:none;border:0;color:var(--muted);padding:6px 9px;cursor:pointer}
.theme button:hover{color:var(--ink)}.theme button.on{background:var(--gold);color:#1a1300}.theme svg{display:block}
:root{--goldink:var(--gold)}
[data-theme=light]{--bg:#f4f6fb;--bg2:#e9eef7;--panel:#ffffff;--panel2:#edf1f8;--line:#d3dbea;--ink:#121a2e;--soft:#2c3752;--muted:#56627f;--dim:#737f9c;--gold:#f5b800;--goldink:#9a6a00;--photo:#d11f45;--compton:#a87b00;--pair:#7a3fd6;--esc:#0b8798;--ok:#1b9150;--blue:#2361c6}
[data-theme=light] body{background:radial-gradient(1200px 620px at 85% -8%,rgba(35,97,198,.08),transparent 60%),radial-gradient(900px 520px at -12% 8%,rgba(209,31,69,.06),transparent 60%),var(--bg)}
[data-theme=light] header.top{background:rgba(244,246,251,.88)}
[data-theme=light] h1 em{background:linear-gradient(90deg,#c98a00,#d8325a 55%,#5b45d6);-webkit-background-clip:text;background-clip:text}
[data-theme=light] canvas.cv{background:#ffffff;box-shadow:0 0 0 1px var(--line)}
[data-theme=light] .btn,[data-theme=light] .chip{border-color:#c2ccdf}[data-theme=light] .chip.on{background:var(--ink);color:#fff;border-color:var(--ink)}[data-theme=light] input[type=range],[data-theme=light] input[type=checkbox]{accent-color:var(--goldink)}
[data-theme=light] details.hood{border-color:#c2ccdf;background:rgba(255,255,255,.6)}[data-theme=light] details.hood code{color:#8a5d00}
[data-theme=light] .pill.good{background:rgba(27,145,80,.13);color:#11683a}[data-theme=light] .pill.bad{background:rgba(209,31,69,.11);color:#a3122f}
[data-theme=light] .tip{background:rgba(255,255,255,.97);border-color:#c2ccdf;box-shadow:0 8px 28px rgba(30,40,70,.18)}
</style>
</head>
<body>
<header class="top"><div class="wrap">
  <a class="brand" href="index.html">Becq<span>Moni</span><small data-t="brand.sub"></small></a>
  <a class="tocl" href="index.html#chapters"><b>☰</b><span data-t="toc"></span></a>
  <nav class="steps" id="nav">
    <a href="#photon"><b>1</b><span data-t="nav.1"></span></a>
    <a href="#geometry"><b>2</b><span data-t="nav.2"></span></a>
    <a href="#matrix"><b>3</b><span data-t="nav.3"></span></a>
    <a href="#fsa"><b>4</b><span data-t="nav.4"></span></a>
    <a href="#activity"><b>5</b><span data-t="nav.5"></span></a>
  </nav>
  <div class="lang"><button data-lang="ru">RU</button><button data-lang="en">EN</button></div>
</div></header>

<section class="hero" id="top"><div class="wrap">
  <div class="kicker" data-t="hero.k"></div>
  <h1 data-t="hero.h"></h1>
  <p class="lead" data-t="hero.sub"></p>
  <div class="card full">
    <canvas id="cvHero" class="cv tall" aria-label="animation"></canvas>
    <div class="row"><span class="pill" id="heroStat"></span><span class="note" data-t="hero.cap"></span></div>
  </div>
  <div class="minichain">
    <a href="#photon"><b>1</b><span data-t="ch.1"></span></a>
    <a href="#geometry"><b>2</b><span data-t="ch.2"></span></a>
    <a href="#matrix"><b>3</b><span data-t="ch.3"></span></a>
    <a href="#fsa"><b>4</b><span data-t="ch.4"></span></a>
    <a href="#activity"><b>5</b><span data-t="ch.5"></span></a>
  </div>
</div></section>

<!-- 1. ФОТОН -->
<section class="sec" id="photon"><div class="wrap">
  <div class="kicker" data-t="s1.k"></div>
  <h2 data-t="s1.h"></h2>
  <p class="lead" data-t="s1.lead"></p>
  <div class="grid2 wl">
    <div class="card">
      <h3 data-t="s1.scene"></h3>
      <canvas id="cvPh" class="cv"></canvas>
      <div class="row">
        <span class="lbl" data-t="s1.energy"></span>
        <div class="chips" id="phChips"></div>
      </div>
      <div class="row">
        <input type="range" id="phE" min="0" max="1000" value="600" aria-label="E">
        <span class="val" id="phEv"></span>
        <label class="sw"><input type="checkbox" id="phShield"><span data-t="s1.shield"></span></label>
      </div>
      <div class="row">
        <button class="btn main" id="ph1" data-t="s1.b1"></button>
        <button class="btn" id="ph100" data-t="s1.b100"></button>
        <button class="btn" id="ph10k" data-t="s1.b10k"></button>
        <button class="btn" id="phClr" data-t="s1.clr"></button>
      </div>
      <div class="legend" id="phLegend"></div>
    </div>
    <div class="card">
      <h3 data-t="s1.spec"></h3>
      <canvas id="cvPhS" class="cv"></canvas>
      <div class="pills" id="phStat"></div>
    </div>
  </div>
  <div class="facts">
    <div class="fact" style="--c:var(--photo)" data-t="s1.f1"></div>
    <div class="fact" style="--c:var(--compton)" data-t="s1.f2"></div>
    <div class="fact" style="--c:var(--esc)" data-t="s1.f3"></div>
  </div>
  <div class="card full ox" id="outcomes">
    <h3 data-t="ox.h"></h3>
    <p class="note" style="margin-top:0" data-t="ox.lead"></p>
    <div id="oxSel"></div>
    <canvas id="cvOx" class="cv oxc" aria-label="particle outcome"></canvas>
    <div class="row"><button class="btn main" id="oxAgain" data-t="ox.again"></button>
      <span class="lbl" data-t="ox.speed"></span><input type="range" id="oxSp" min="0.5" max="3" step="0.25" value="1" aria-label="speed"><span class="val" id="oxSpv"></span></div>
    <div class="pills" id="oxLed"></div>
    <div class="oxtxt" id="oxTxt"></div>
  </div>
  <details class="hood"><summary data-t="hood"></summary><ul data-t="hood.1"></ul></details>
</div></section>

<!-- 2. ГЕОМЕТРИЯ -->
<section class="sec" id="geometry"><div class="wrap">
  <div class="kicker" data-t="s2.k"></div>
  <h2 data-t="s2.h"></h2>
  <p class="lead" data-t="s2.lead"></p>
  <div class="grid2">
    <div class="card">
      <h3 data-t="s2.scene"></h3>
      <canvas id="cvGeo" class="cv"></canvas>
      <div class="row"><span class="lbl" data-t="s2.src"></span><div class="chips" id="geoSrc"></div></div>
      <div class="sliders">
        <div class="sl"><div class="top"><span data-t="s2.size"></span><span class="val" id="geoSizeV"></span></div><input type="range" id="geoSize" min="25" max="80" step="1" value="63"></div>
        <div class="sl" id="geoGapBox"><div class="top"><span data-t="s2.gap"></span><span class="val" id="geoGapV"></span></div><input type="range" id="geoGap" min="0" max="150" step="1" value="10"></div>
        <div class="sl" id="geoRhoBox"><div class="top"><span data-t="s2.rho"></span><span class="val" id="geoRhoV"></span></div><input type="range" id="geoRho" min="20" max="250" step="5" value="100"></div>
      </div>
    </div>
    <div class="card">
      <h3 data-t="s2.curve"></h3>
      <canvas id="cvEff" class="cv"></canvas>
      <div class="row">
        <button class="btn" id="effKeep" data-t="s2.keep"></button>
        <span class="legend" style="margin:0"><span><i style="background:var(--gold)"></i><span data-t="s2.now"></span></span><span><i style="background:#6a7899"></i><span data-t="s2.kept"></span></span><span><i style="background:var(--blue)"></i><span data-t="s2.total"></span></span></span>
      </div>
    </div>
  </div>
  <div class="tiles" id="effTiles"></div>
  <div class="facts">
    <div class="fact" style="--c:var(--blue)" data-t="s2.f1"></div>
    <div class="fact" style="--c:var(--photo)" data-t="s2.f2"></div>
    <div class="fact" style="--c:var(--gold)" data-t="s2.f3"></div>
  </div>
  <details class="hood"><summary data-t="hood"></summary><ul data-t="hood.2"></ul></details>
</div></section>

<!-- 3. МАТРИЦА -->
<section class="sec" id="matrix"><div class="wrap">
  <div class="kicker" data-t="s3.k"></div>
  <h2 data-t="s3.h"></h2>
  <p class="lead" data-t="s3.lead"></p>
  <div class="grid2">
    <div class="card">
      <h3 data-t="s3.map"></h3>
      <canvas id="cvMx" class="cv"></canvas>
      <div class="row"><span class="pill" id="mxProg"></span><button class="btn" id="mxRun" data-t="s3.run"></button></div>
    </div>
    <div class="card">
      <h3 id="mxSliceT"></h3>

's4.h':'FSA: разобрать спектр на цветные слои',
's4.lead':'Обычный поиск пиков меряет каждый пик по отдельности. <b>FSA</b> (полноспектральный разбор) работает со всем спектром сразу. Сначала по найденным пикам он решает, <b>кто</b> есть в пробе, и для каждого нуклида берёт готовый «слой» — как этот нуклид со всем своим рядом распада выглядит именно в вашей геометрии. Потом подбирает, <b>сколько</b> каждого слоя нужно, чтобы сложилась измеренная картина. Как художник, который знает чистые краски и угадывает пропорции смеси.',

's4.hint@day':'Двигайте ползунки, пока цветная гора не ляжет на чёрные точки измерения. Полоса снизу — невязка: чем она спокойнее, тем лучше. Слои посчитаны тем же переносом фотонов для вашей геометрии; фон помещения считаем уже вычтенным, как в программе.',

's4.chitext':'Шкала прибора дрейфует, например, от температуры. Если слои поставить «как есть», пики модели разъедутся с измерением. FSA сравнивает центры пиков полного поглощения модели и измерения — это опоры — и пересчитывает усиление шкалы. <span style="color:#ff4d6d">Красные точки</span> — сдвиг до привязки: они лежат на наклонной прямой, шкала растянута. <span style="color:#5be38a">Зелёные</span> — после: сдвиг ушёл.',

'hero.sub':'Five steps from a single photon to the activity of your sample. Everything on this page is live: sliders, buttons and charts are computed right in your browser. If you are just starting, read the <a href="preface.html">preface</a> first: the same story, shorter.',

's1.k':'Step 1',
's1.h':'What a photon does inside the crystal',
's1.lead':'A gamma photon enters the crystal like a ball flying into a dense forest. It may stop at once and give up all its energy, bounce off a "tree" and carry part of it away, or fly straight through. The instrument only sees what the photon <b>left behind</b> in the crystal.',

's1.f1':'<b>Full-energy peak</b> — the photon gave up all its energy. The peak position tells which nuclide it is; its area tells how much.',
's1.f2':'<b>Compton plateau</b> — the photon bounced and escaped, leaving only part of its energy. The plateau ends at the "Compton edge".',
's1.f3':'<b>Bumps and satellite peaks</b> — backscatter from the shield and lead X-rays (made by the surroundings) and escape peaks (made by the crystal itself). No new nuclide stands behind them.',

's2.k':'Step 2',
's2.h':'Geometry: why it matters where and how the sample sits',
's2.lead':'A sample shines in all directions, while the crystal catches only what flies into it — like a bucket in the rain. The farther and smaller the bucket, the fewer drops. A dense sample also "eats" part of its own radiation.',

's3.k':'Step 3',
's3.h':'The response matrix — the detector\'s dictionary',
's3.lead':'The efficiency curve answers <b>how many</b> photons reach the peak. The matrix answers a bigger question: <b>what</b> a photon of every energy looks like in the spectrum — peak, plateau, escape peaks, all of it. It is computed by running millions of virtual photons through a model of your geometry. The matrix keeps a "sharp" picture; the app adds the peak width later, from the peak-width (FWHM) calibration of your spectrum.',

's3.f1':'<b>The bright diagonal</b> — full-energy peaks: whatever energy came in is what gets recorded.',
's3.f2':'<b>The triangle left of the diagonal</b> — Compton plateaus. The higher the energy, the longer the plateau.',
's3.f3':'<b>Thin lines along the diagonal</b> — escape peaks: soft photons lose an iodine X-ray (−29 keV), the hardest ones lose 511 keV annihilation quanta.',
's3.real':'Why it matters: a real Cs-137 spectrum in a lead house',
's3.realcap':'White line — the measurement (ASN16, 99 hours, 250 million counts). In colour — what BecqMoni\'s model explains. Add the parts one by one: the peak, the Compton part of the matrix, then everything else — backscatter from the house and lead X-rays, which the app adds as separate layers.',

's4.k':'Step 4',
's4.h':'FSA: taking the spectrum apart into coloured layers',
's4.lead':'Ordinary peak search measures every peak on its own. <b>FSA</b> (full-spectrum analysis) works with the whole spectrum at once. First, from the peaks it found, it decides <b>who</b> is in the sample, and for every nuclide it takes a ready-made "layer" — what that nuclide with its whole decay chain looks like in exactly your geometry. Then it finds <b>how much</b> of each layer is needed to rebuild the measured picture. Like a painter who knows the pure paints and guesses the proportions of a mix.',
's4.game':'Try it: build the spectrum from layers',
's4.hint':'Move the sliders until the coloured hill lies on the white measurement dots. The strip below is the residual: the calmer it is, the better. The layers come from the same photon transport for your geometry; room background is taken as already subtracted, as in the app.',

3:'<li>Window: Device configuration → Efficiency → "Response matrix...". 140 energy nodes 5…3000 keV plus nodes at K-edges, 2 keV bins; 3 million photons per node — exactly on the GPU, on the CPU by a 3 % noise target: a quiet node gets fewer, a noisy one up to 24 million.</li>'+

      const col = PT_COL[e.k] || '#8892a8', r = e.k === 'ph' ? 4.5 : e.k === 'pa' ? 4.5 : 3, px = X(e.p[2]), py = Y(e.p[0]);
      if (e.k === 'ph' || e.k === 'pa') ctx.drawImage(glowSprite(col, d), px - 13, py - 13, 26, 26);
      ctx.fillStyle = col; ctx.beginPath(); ctx.arc(px, py, r, 0, TWO_PI); ctx.fill();
      if (e.k === 'abs') { ctx.strokeStyle = '#8892a8'; ctx.lineWidth = 1.5; ctx.beginPath(); ctx.moveTo(px - 4, py - 4); ctx.lineTo(px + 4, py + 4); ctx.moveTo(px + 4, py - 4); ctx.lineTo(px - 4, py + 4); ctx.stroke(); }
    }
  }
  ctx.globalAlpha = a0; ctx.lineCap = lc0; ctx.lineWidth = lw0;
}

(function hero() {
  const cv = $('#cvHero'); io.observe(cv);
  const G = { size: 6.3, gap: 0.6, src: 'jar', rho: 1.0, shield: false, al: 0.08 }, D = dims(G);
  const LINES = [[59.54, 0.36 * 0.6], [661.66, 0.851], [1173.2, 0.45], [1332.5, 0.45], [1460.8, 0.4]];
  const wsum = LINES.reduce((a, l) => a + l[1], 0);
  const pick = () => { let u = Math.random() * wsum; for (const l of LINES) { u -= l[1]; if (u <= 0) return l[0]; } return LINES[1][0]; };
  const NB = 170, EMAX = 1600, hist = new Float64Array(NB); let tracks = [], nEm = 0, nHit = 0, nSp = 0, fr = 0, statTxt = '';
  const BC = Array.from({ length: NB }, (_, b) => eCol((b + 0.5) * EMAX / NB, 0.9));   // цвет столбца от кадра не зависит (`AMBER254`)
  const statEl = $('#heroStat');
  function frame() {
    requestAnimationFrame(frame);
    if (!visible.get(cv)) return;
    for (let i = 0; i < 2; i++) { const tr = []; const r = historyA(pick(), D, tr); nEm++; if (r.hit) nHit++; if (r.ed > 15) { const e = smear(r.ed, 7.5), b = Math.floor(e / EMAX * NB); if (b >= 0 && b < NB) hist[b]++; nSp++; } tracks.push({ tr, age: 0 }); }
    const S = { n: 0, hit: 0, arr: 0, inter: 0, fep: 0 };
    for (let i = 0; i < 60; i++) { const E = pick(); historyW(E, D, S, (w, ed) => { if (ed > 15 && Math.random() < w * 2.2) { const e = smear(ed, 7.5), b = Math.floor(e / EMAX * NB); if (b >= 0 && b < NB) hist[b]++; nSp++; } }); }
    nEm += 60; nHit += Math.round(S.hit * 2.2);
    if (nSp > 160000) { for (let b = 0; b < NB; b++) hist[b] *= 0.5; nSp *= 0.5; }
    draw();
    tracks.forEach(x => x.age++); tracks = tracks.filter(x => x.age < 55);
  }
  function draw() {
    const { ctx, w, h } = setup(cv);
    const narrow = w < 760, sw = narrow ? w : w * 0.56, sh = narrow ? h * 0.52 : h;
    const V = view(sw, sh, -6.6, D.H * 1.9 + 1.2, -6.2, 6.2, 8);
    ctx.save(); ctx.beginPath(); ctx.rect(0, 0, sw, sh); ctx.clip();
    drawSetup(ctx, V, D, { labels: true });
    tracks.forEach(x => drawTrack(ctx, V, x.tr, Math.pow(1 - x.age / 55, 1.4), Math.min(1, (x.age + 1) / 14)));
    ctx.restore();
    // спектр
    const bx = narrow ? { l: 44, t: sh + 12, r: w - 12, b: h - 22 } : { l: sw + 50, t: 18, r: w - 14, b: h - 24 };
    let mx = 1; for (let b = 3; b < NB; b++) mx = Math.max(mx, hist[b]);
    const X = scale('lin', 0, EMAX, bx.l, bx.r), Y = scale('sqrt', 0, mx * 1.08, bx.b, bx.t);
    axes(ctx, bx, X, Y, { xl: t('ax.e'), nx: 4, noY: true });
    const bw = (bx.r - bx.l) / NB;
    for (let b = 1; b < NB; b++) { const y = Y(hist[b]); ctx.fillStyle = BC[b]; ctx.fillRect(bx.l + b * bw, y, Math.max(1, bw - 0.6), bx.b - y); }
    ctx.fillStyle = '#cdd8f3'; ctx.font = '600 12px system-ui'; ctx.textAlign = 'left'; ctx.fillText(LANG === 'ru' ? 'Спектр' : 'Spectrum', bx.l + 4, bx.t + 4);
    // счётчики — раз в 6 кадров: запись в DOM в каждом кадре заставляла браузер каждый кадр пересчитывать вёрстку (`AMBER254`)
    if (++fr % 6 === 1) { const s = t('hero.stat', nEm, nHit, Math.round(nSp)); if (s !== statTxt) statEl.innerHTML = statTxt = s; }
  }
  requestAnimationFrame(frame);
})();

const PH = { E: 662, n: 0, inter: 0, fep: 0, hist: null, nb: 220, emax: 800, tracks: [], anim: null };
(function photon() {
  const cv = $('#cvPh'), cvS = $('#cvPhS'); io.observe(cv);
  const chips = [[59.5, 'Am-241'], [661.7, 'Cs-137'], [1460.8, 'K-40'], [2614.5, 'Tl-208']];
  const box = $('#phChips');
  chips.forEach(([e, n]) => { const b = document.createElement('button'); b.className = 'chip'; b.textContent = n + ' · ' + Math.round(e); b.onclick = () => setE(e); box.appendChild(b); });
  const sl = $('#phE');
  const pos2E = p => 30 * Math.pow(3000 / 30, p / 1000), E2pos = e => Math.round(1000 * Math.log(e / 30) / Math.log(100));
  function setE(e) { PH.E = e; sl.value = E2pos(e); reset(); }
  function reset() { PH.n = PH.inter = PH.fep = 0; PH.emax = Math.max(120, PH.E * 1.13); PH.hist = new Float64Array(PH.nb); PH.tracks = []; PH.anim = null; refresh(); }
  sl.addEventListener('input', () => { PH.E = Math.round(pos2E(+sl.value)); reset(); });
  const sh = $('#phShield'); sh.checked = GEO.shield;
  sh.addEventListener('change', () => { GEO.shield = sh.checked; reset(); });
  function fire(n, keepTracks) {
    const D = dims(GEO);
    for (let i = 0; i < n; i++) {
      const tr = keepTracks ? [] : null;
      let r;
      if (tr) r = historyA(PH.E, D, tr);
      else { const t2 = []; r = historyA(PH.E, D, t2); if (i >= n - 6) PH.tracks.push({ tr: t2, age: 20 }); }
      PH.n++; if (r.ed > 1) { PH.inter++; const e = smear(r.ed, GEO.fwhm), b = Math.floor(e / PH.emax * PH.nb); if (b >= 0 && b < PH.nb) PH.hist[b]++; if (r.ed >= PH.E - 0.6) PH.fep++; }
      if (tr) PH.tracks.push({ tr, age: 0, slow: n === 1 });
    }
  }
  $('#ph1').onclick = () => { fire(1, true); };
  $('#ph100').onclick = () => { let k = 0; Jobs.add('ph100', (function* () { while (k < 100) { fire(3, true); k += 3; yield; } })()); };
  $('#ph10k').onclick = () => { let k = 0; Jobs.add('ph10k', (function* () { while (k < 100000) { fire(4000, false); k += 4000; yield; } })()); };
  $('#phClr').onclick = reset;
  function legend() {
    $('#phLegend').innerHTML = [['#ff4d6d', 's1.lg.ph'], ['#ffd166', 's1.lg.co'], ['#c38bff', 's1.lg.pa'], ['#4dd0e1', 's1.lg.esc'], ['#8892a8', 's1.lg.abs']].map(([c, k]) => '<span><i style="background:' + c + ';border-radius:50%"></i>' + t(k) + '</span>').join('');
    $$('#phChips .chip').forEach((b, i) => b.classList.toggle('on', Math.abs(chips[i][0] - PH.E) < 2));
    $('#phEv').textContent = Math.round(PH.E) + (LANG === 'ru' ? ' кэВ' : ' keV');
    $('#phStat').innerHTML = '<span class="pill">' + t('s1.st', PH.n, PH.inter, PH.fep) + '</span>';
  }
  function drawScene() {
    const { ctx, w, h } = setup(cv), D = dims(GEO);
    const zmin = D.point ? D.point[2] - 2.5 : D.jar ? D.jar.z0 - 1.5 : D.mar.z0 - 1.5, ext = Math.max(D.R, D.jar ? D.jar.R : D.mar ? D.mar.Ro : D.R) + (GEO.shield ? 8.6 : 2.5);
    const V = view(w, h, Math.min(zmin, GEO.shield ? -9 : zmin), D.H * 1.9 + 1.5, -ext, ext, 8);
    drawSetup(ctx, V, D, { labels: true });
    PH.tracks.forEach(x => drawTrack(ctx, V, x.tr, x.age < 60 ? 1 : Math.max(0, 1 - (x.age - 60) / 60), x.slow ? Math.min(1, x.age / 70) : Math.min(1, (x.age + 1) / 16)));
  }
  function drawSpec() {
    const { ctx, w, h } = setup(cvS), bx = { l: 46, t: 14, r: w - 12, b: h - 24 };
    let mx = 4; for (let b = 1; b < PH.nb; b++) mx = Math.max(mx, PH.hist[b]);
    const X = scale('lin', 0, PH.emax, bx.l, bx.r), Y = scale('sqrt', 0, mx * 1.1, bx.b, bx.t);
    axes(ctx, bx, X, Y, { xl: t('ax.e'), yl: t('ax.cnt') });
    drawFeatures(ctx, bx, X, features(PH.E, GEO.shield));
    const bw = (bx.r - bx.l) / PH.nb;
    for (let b = 0; b < PH.nb; b++) { if (!PH.hist[b]) continue; const y = Y(PH.hist[b]); ctx.fillStyle = eCol((b + 0.5) * PH.emax / PH.nb, .95); ctx.fillRect(bx.l + b * bw, y, Math.max(1, bw - 0.5), bx.b - y); }
  }
  function refresh() { legend(); drawScene(); drawSpec(); }
  let lastN = -1;
  function loop() {
    requestAnimationFrame(loop);
    if (!visible.get(cv) && !visible.get(cvS)) return;
    if (PH.tracks.length || PH.n !== lastN) {
      PH.tracks.forEach(x => x.age++); PH.tracks = PH.tracks.filter(x => x.age < 120);
      drawScene(); if (PH.n !== lastN) { drawSpec(); legend(); lastN = PH.n; }
    }
  }
  onRedraw(refresh); PH.reset = reset; PH.setE = setE;
  setE(661.7); requestAnimationFrame(loop);
})();

'ox.ann.t':'Аннигиляция вне кристалла','ox.ann.d':'Пара рождается в свинце или корпусе; позитрон аннигилирует там же, и один квант 511 влетает в кристалл.','ox.ann.s':'линия 511 кэВ — при любой исходной линии выше 1022 кэВ; из одной аннигиляции в кристалл попадает не больше одного кванта: они разлетаются в противоположные стороны.','ox.ann.b':'пары в пробе и обвязке — матрица, канал «Аннигиляция вне кристалла»; в домике — компонент FSA Ann-511 (флажок «Пики вылета и аннигиляция 511 кэВ»).',

'ox.casc.t':'Каскадное суммирование: вынос из пика','ox.casc.d':'Один квант поглощён целиком, второй — лишь частично (комптон). Импульс — их сумма, и пик 1332 кэВ недосчитался своего отсчёта.','ox.casc.s':'сумм-континуум между пиками и выше; сами пики меньше — тем сильнее, чем ближе проба к кристаллу.','ox.casc.b':'FSA, «Каскадное суммирование»: вынос из пиков, суммы, угловые корреляции — по матрице отклика.',

'ox.econv.t':'Конверсионный электрон','ox.econv.d':'Возбуждённое ядро отдаёт энергию не фотону, а электрону внутренней конверсии. Корпус и оболочки сдвигают и размывают линию.','ox.econv.s':'линия на энергии перехода минус энергия связи; у Ba-137m 661.7 → 624 кэВ.','ox.econv.b':'матрица, раздел электрона: линии конверсии идут одним образом с бетой, слой «Бета пробы (электроны из пробы)». Без матрицы этого слоя нет.',

'ox.estuck.t':'Застрял по дороге','ox.estuck.d':'Электрон беты не долетел до кристалла: его остановили сама проба, стенка капсулы или корпус. Чем мягче бета, тем чаще она застревает, не оставив отсчёта.','ox.estuck.s':'нигде — отсчёта нет. Спектр беты от этого только ниже, а форма его не меняется.','ox.estuck.b':'матрица, раздел электрона: перенос электронов в пробе, капсуле и корпусе, слой «Бета пробы (электроны из пробы)».',
'ox.ebrh.t':'Тормозной квант из корпуса','ox.ebrh.d':'Электрон застрял в корпусе, но, тормозясь, излучил квант — и тот долетел до кристалла. В кристалле остаётся энергия этого кванта, а не электрона.','ox.ebrh.s':'сплошной спектр тормозного излучения — от нуля до энергии электрона; у K-40 до 1311 кэВ.','ox.ebrh.b':'матрица, раздел электрона: тормозное электронов пробы и корпуса, слой «Бета пробы (электроны из пробы)». Без матрицы этого слоя нет.',
